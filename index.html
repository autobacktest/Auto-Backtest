        },
        /* ---- ranges, compression, expansion --------------------------------- */
        {
          id: 'consolidation', re: /\bconsolidat\w+\b|\bcompress\w+\b|\bsqueez\w+\b|\btight range\b|\bcoiling\b/,
          build: () => T({ l: { t: 'atr', n: 14 }, op: 'lt', r: { t: 'atr', n: 100 } },
            'price is swinging less than it usually does',
            { kind: 'state', short: 'compressed range', status: 'default', detail: '"consolidation" means the last 14 candles swung less than the last 100 did, on average' })
        },
        {
          re: /\bexpansion\b|\bexpanding\b|\bvolatile\b|\bhigh volatility\b/,
          build: () => T({ l: { t: 'atr', n: 14 }, op: 'gt', r: { t: 'atr', n: 100 } },
            'price is swinging more than it usually does',
            { kind: 'state', short: 'expanding range', status: 'default', detail: '"expansion" means the last 14 candles swung more than the last 100 did, on average' })
        },
        {
          re: /\branging market\b|\bchoppy\b|\bsideways\b|\bno trend\b/,
          build: () => T({ l: { t: 'adx', n: 14 }, op: 'lt', r: { t: 'num', v: 20 } }, 'ADX(14) is below 20',
            { kind: 'state', short: 'ranging', status: 'default', detail: '"ranging" uses ADX(14) below 20' })
        },
        /* ---- pullbacks and retracement -------------------------------------- */
        {
          id: 'pullback', re: /\bpull(?:s|ed)? ?back\b|\bpullback\b|\bretrac\w+\b|\bdips?\b/,
          build: (txt, ctx) => {
            if (/\bfvg\b|\bfair value gap\b|\bimbalance\b|\bgap\b|\bdisplacement\b|\border ?block\b/.test(txt)) return null;
            const m = txt.match(/(\d+(?:\.\d+)?)\s*%\s*(?:retrace\w*|pull ?back)?/);
            if (m) return T({ l: { t: 'rangePos', n: LANG_DEF.rangeLook }, op: 'lte', r: { t: 'num', v: 100 - +m[1] } },
              'price has retraced at least ' + m[1] + '% of the last ' + LANG_DEF.rangeLook + '-bar range',
              { short: 'retraced ' + m[1] + '%', status: 'exact' });
            const short = ctx.bias === 'short';
            return T(short ? { l: { t: 'rangePos', n: LANG_DEF.rangeLook }, op: 'gte', r: { t: 'num', v: 62 } }
              : { l: { t: 'rangePos', n: LANG_DEF.rangeLook }, op: 'lte', r: { t: 'num', v: 38 } },
              'price has pulled back into the ' + (short ? 'upper' : 'lower') + ' 38% of the last ' + LANG_DEF.rangeLook + '-bar range',
              {
                short: 'pullback', status: 'default',
                detail: '"pullback" uses a retracement past 62% of the last ' + LANG_DEF.rangeLook + ' bars. Say "38% retracement" or name a level to set it yourself'
              });
          }
        },
        /* ---- fair value gaps, order blocks --------------------------------- */
        {
          id: 'fvg', re: /\b(?:fvg|fair value gap|imbalance|inefficiency)\b/,
          build: (txt) => {
            const back = /\bretest|returns?|back into|fills?|taps?|mitigat|retrace\w*|into\b|area\b/.test(txt);
            const bear = /\bbearish\b/.test(txt);
            const f = back ? (bear ? 'inFvgBear' : 'inFvgBull') : (bear ? 'fvgBear' : 'fvgBull');
            return T({ f: f }, back ? 'price trades back into the open ' + (bear ? 'bearish' : 'bullish') + ' fair value gap'
              : 'a ' + (bear ? 'bearish' : 'bullish') + ' fair value gap forms (a three-bar imbalance)',
              {
                short: back ? 'return to the gap' : 'a fair value gap', status: 'default',
                detail: 'a fair value gap is the three-bar imbalance between bar 1\'s ' + (bear ? 'low' : 'high') + ' and bar 3\'s ' + (bear ? 'high' : 'low')
              });
          }
        },
        {
          id: 'ob', re: /\border ?block\b|\bdemand zone\b|\bsupply zone\b|\bmitigation block\b|\bbreaker\b/,
          build: (txt, ctx) => {
            const bear = /\bbearish|supply\b/.test(txt) || ctx.bias === 'short';
            return T({ f: bear ? 'obBear' : 'obBull' },
              'price taps the last ' + (bear ? 'bearish' : 'bullish') + ' order block — the last opposing candle before the move that broke structure',
              {
                short: (bear ? 'bearish' : 'bullish') + ' order block', status: 'default',
                detail: 'the order block is the last ' + (bear ? 'up' : 'down') + ' candle before the structure break, and it is discarded once price closes through it'
              });
          }
        },
        /* ---- candle patterns ------------------------------------------------ */
        {
          id: 'engulf', re: /\bengulf\w*\b/, build: (txt, ctx) => {
            const bear = /\bbearish\b/.test(txt) || ctx.bias === 'short';
            return T({ f: bear ? 'engulfBear' : 'engulfBull' }, 'a ' + (bear ? 'bearish' : 'bullish') + ' engulfing candle prints', { short: 'engulfing', status: 'exact' });
          }
        },
        { re: /\binside (?:bar|candle)\b/, build: () => T({ f: 'inside' }, 'an inside bar prints', { short: 'inside bar' }) },
        { re: /\boutside (?:bar|candle)\b/, build: () => T({ f: 'outside' }, 'an outside bar prints', { short: 'outside bar' }) },
        { re: /\bdoji\b/, build: () => T({ f: 'doji' }, 'a doji prints', { short: 'doji' }) },
        {
          id: 'equalHL', re: /\bequal (?:highs?|lows?)\b|\bdouble (?:top|bottom)\b|\beqh\b|\beql\b/,
          build: (txt, ctx) => {
            const high = /\bhighs?\b|\btop\b|\beqh\b/.test(txt);
            return T({ f: high ? 'eqHighs' : 'eqLows' },
              'two swing ' + (high ? 'highs' : 'lows') + ' form within a tenth of an ATR of each other',
              { short: high ? 'equal highs' : 'equal lows', status: 'default', detail: '"equal" allows a gap of up to a tenth of the average recent swing' });
          }
        },
        {
          re: /\b(\d+)\s*(?:higher|green|up|rising|bullish)\s*(?:closes?|candles?|bars?|days?)\b|\b(\d+)\s*(?:candles?|bars?|closes?)\s*(?:in a row|consecutive)?\s*(?:higher|up|green)\b/,
          build: (txt) => {
            const m = txt.match(/(\d+)/);
            return T({ f: 'upBars', n: +m[1] }, m[1] + ' candles have closed higher in a row', { short: m[1] + ' up closes' });
          }
        },
        {
          re: /\b(\d+)\s*(?:lower|red|down|falling|bearish)\s*(?:closes?|candles?|bars?|days?)\b|\b(\d+)\s*(?:candles?|bars?|closes?)\s*(?:in a row|consecutive)?\s*(?:lower|down|red)\b/,
          build: (txt) => {
            const m = txt.match(/(\d+)/);
            return T({ f: 'downBars', n: +m[1] }, m[1] + ' candles have closed lower in a row', { short: m[1] + ' down closes' });
          }
        },
        /* ---- indicators ------------------------------------------------------ */
        {
          id: 'oversold', re: /\b(?:oversold|cheap|too low)\b/, build: () => T({ l: { t: 'rsi', n: 14 }, op: 'lt', r: { t: 'num', v: 30 } }, 'RSI(14) is below 30',
            { kind: 'state', short: 'oversold', status: 'default', detail: '"oversold"/"cheap" uses RSI(14) below 30' })
        },
        {
          id: 'overbought', re: /\b(?:overbought|expensive|too high|stretched)\b/, build: () => T({ l: { t: 'rsi', n: 14 }, op: 'gt', r: { t: 'num', v: 70 } }, 'RSI(14) is above 70',
            { kind: 'state', short: 'overbought', status: 'default', detail: '"overbought"/"expensive" uses RSI(14) above 70' })
        },
        {
          id: 'rsi', re: /\brsi\b/, build: (txt) => {
            const p = (txt.match(/rsi\s*\(?\s*(\d+)/) || [])[1];
            const n = p ? +p : 14;
            const lvl = (txt.match(/(\d+(?:\.\d+)?)/g) || []).filter(x => +x !== n).map(Number);
            const cross = /\bcross\w*\b/.test(txt);
            const below = /\bbelow|under|oversold|drops?|falls?\b/.test(txt);
            if (/\boversold\b/.test(txt) && !lvl.length) return T({ l: { t: 'rsi', n: n }, op: 'lt', r: { t: 'num', v: 30 } }, 'RSI(' + n + ') is below 30',
              { kind: 'state', short: 'RSI oversold', status: 'default', detail: '"oversold" uses 30' });
            if (/\boverbought\b/.test(txt) && !lvl.length) return T({ l: { t: 'rsi', n: n }, op: 'gt', r: { t: 'num', v: 70 } }, 'RSI(' + n + ') is above 70',
              { kind: 'state', short: 'RSI overbought', status: 'default', detail: '"overbought" uses 70' });
            if (!lvl.length) return null;
            const v = lvl[lvl.length - 1];
            return T({ l: { t: 'rsi', n: n }, op: cross ? (below ? 'xdn' : 'xup') : (below ? 'lt' : 'gt'), r: { t: 'num', v: v } },
              'RSI(' + n + ') ' + (cross ? (below ? 'crosses below ' : 'crosses above ') : (below ? 'is below ' : 'is above ')) + v,
              { kind: cross ? 'event' : 'state', short: 'RSI ' + (below ? '<' : '>') + ' ' + v, status: 'exact' });
          }
        },
        {
          id: 'ma', re: /\b(?:moving average|ma|sma|ema|average|avg)\b/, build: (txt) => {
            const nums = (txt.match(/(\d+)\s*(?:period|bar|day)?\s*(?:ema|sma|ma|moving average|average)/g) || [])
              .map(x => ({ n: +(x.match(/\d+/)[0]), ema: /ema/.test(x) }));
            if (nums.length >= 2) {
              const up = /\babove|over|up\b/.test(txt) && !/\bbelow|under\b/.test(txt);
              const cross = /\bcross\w*\b/.test(txt);
              return T({
                l: { t: nums[0].ema ? 'ema' : 'sma', n: nums[0].n }, op: cross ? (up ? 'xup' : 'xdn') : (up ? 'gt' : 'lt'),
                r: { t: nums[1].ema ? 'ema' : 'sma', n: nums[1].n }
              },
                'the ' + nums[0].n + '-period average ' + (cross ? (up ? 'crosses above ' : 'crosses below ') : (up ? 'is above ' : 'is below ')) + 'the ' + nums[1].n + '-period average',
                {
                  kind: cross ? 'event' : 'state',
                  short: nums[0].n + (nums[0].ema ? ' EMA' : ' MA') + (cross ? (up ? ' crosses above ' : ' crosses below ') : (up ? ' above ' : ' below ')) + nums[1].n + (nums[1].ema ? ' EMA' : ' MA'),
                  status: 'exact'
                });
            }
            if (nums.length === 1) {
              const up = /\babove|over\b/.test(txt);
              const cross = /\bcross\w*\b/.test(txt);
              return T({ l: { t: 'close' }, op: cross ? (up ? 'xup' : 'xdn') : (up ? 'gt' : 'lt'), r: { t: nums[0].ema ? 'ema' : 'sma', n: nums[0].n } },
                'price ' + (cross ? (up ? 'crosses above ' : 'crosses below ') : (up ? 'is above ' : 'is below ')) + 'the ' + nums[0].n + '-period ' + (nums[0].ema ? 'EMA' : 'average'),
                {
                  kind: cross ? 'event' : 'state',
                  short: 'price ' + (cross ? (up ? 'crosses above ' : 'crosses below ') : (up ? 'above ' : 'below ')) + nums[0].n + (nums[0].ema ? ' EMA' : ' MA'),
                  status: 'exact'
                });
            }
            return null;
          }
        },
        /* ---- "when it crosses back below" — same comparison, other way ------ */
        {
          re: /\bcrosses?\s+(?:back\s+)?(?:above|below|under|over)\b|\bgoes? back (?:above|below)\b|\bthe other way\b|\bback below\b|\bback above\b/,
          build: (txt, ctx) => {
            if (!ctx.lastCmp) return null;
            const below = /\bbelow|under\b/.test(txt);
            const c = JSON.parse(JSON.stringify(ctx.lastCmp));
            c.op = below ? (c.op === 'xup' ? 'xdn' : (c.op === 'gt' ? 'lt' : c.op)) : (c.op === 'xdn' ? 'xup' : (c.op === 'lt' ? 'gt' : c.op));
            if (!below && (c.op === 'xdn' || c.op === 'lt')) c.op = c.op === 'xdn' ? 'xup' : 'gt';
            return T(c, condToText(c, 'UTC', []) + ' (the same pair as the rule before it, reversed)',
              {
                kind: 'event', short: 'the reverse cross', status: 'default',
                detail: '"it" was read as the two things compared in the previous rule'
              });
          }
        },
        /* ---- volume, volatility, sessions ----------------------------------- */
        {
          id: 'volume', re: /\bvolume\b/, build: (txt) => {
            const q = numFrom(txt, LANG_DEF.volMult);
            const low = /\blow volume\b|\bthin\b|\bdrying up\b/.test(txt);
            if (low) return T({ f: 'volSpike', v: q.v, within: 0, not: true } && { not: { f: 'volSpike', v: q.v } },
              'volume is not above ' + q.v + ' times its 20-bar average', { kind: 'state', short: 'low volume', status: 'default' });
            return T({ f: 'volSpike', v: q.v }, 'volume is at least ' + q.v + ' times its 20-bar average',
              {
                kind: 'state', short: 'high volume', status: q.exact ? 'exact' : 'default',
                detail: q.exact ? '' : '"high volume" uses ' + LANG_DEF.volMult + ' x the 20-bar average'
              });
          }
        },
        {
          re: /\blondon\b|\bnew york\b|\bny session\b|\basian?\b|\btokyo\b|\bkill ?zone\b|\bsilver bullet\b/,
          build: (txt) => {
            let lo = null, hi = null, name = '';
            if (/\bsilver bullet\b/.test(txt)) { lo = 10; hi = 11; name = 'the 10:00-11:00 window'; }
            else if (/\blondon\b/.test(txt)) { lo = 7; hi = 16; name = 'London hours (07:00-16:00)'; }
            else if (/\bnew york\b|\bny\b/.test(txt)) { lo = 12; hi = 21; name = 'New York hours (12:00-21:00)'; }
            else if (/\basian?\b|\btokyo\b/.test(txt)) { lo = 0; hi = 9; name = 'Asian hours (00:00-09:00)'; }
            if (lo == null) return null;
            return T({ all: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: lo } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: hi } }] },
              'the bar falls inside ' + name + ' in the timezone chosen for the run',
              { kind: 'state', short: name, status: 'default', detail: 'session hours are taken in the run timezone — set it to New York for ICT hours' });
          }
        },
        {
          re: /\b(?:on\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)s?\b/,
          build: (txt) => {
            const d = DOW_NAMES.findIndex(x => new RegExp('\\b' + x.toLowerCase() + 's?\\b').test(txt));
            if (d < 0) return null;
            return T({ f: 'dow', v: d }, 'the day is ' + DOW_NAMES[d], { kind: 'state', short: DOW_NAMES[d] });
          }
        },
        /* ---- open-trade tests (exits) --------------------------------------- */
        {
          re: /\b(?:up|in profit|gained)\s+(?:more than\s+|by\s+)?(\d+(?:\.\d+)?)\s*%/,
          build: (txt) => {
            const m = txt.match(/(\d+(?:\.\d+)?)\s*%/);
            return T({ f: 'openProfit', v: +m[1] }, 'the open trade is up more than ' + m[1] + '%', { kind: 'state', short: 'up ' + m[1] + '%' });
          }
        },
        {
          re: /\b(?:down|losing|in the red)\s+(?:more than\s+|by\s+)?(\d+(?:\.\d+)?)\s*%/,
          build: (txt) => {
            const m = txt.match(/(\d+(?:\.\d+)?)\s*%/);
            return T({ f: 'openLoss', v: +m[1] }, 'the open trade is down more than ' + m[1] + '%', { kind: 'state', short: 'down ' + m[1] + '%' });
          }
        },
        {
          re: /^\s*(\d+)\s*(?:bars?|candles?|hours?)\s*$/,
          build: (txt) => {
            const m = txt.match(/(\d+)/);
            return T({ f: 'barsHeld', n: +m[1] }, 'the trade has been open at least ' + m[1] + ' bars', { kind: 'state', short: m[1] + ' bars held' });
          }
        },
        {
          re: /\b(?:after|held for|open for|been open)\s+(\d+)\s*(?:bars?|candles?|hours?)\b/,
          build: (txt) => {
            const m = txt.match(/(\d+)\s*(?:bars?|candles?|hours?)/);
            return T({ f: 'barsHeld', n: +m[1] }, 'the trade has been open at least ' + m[1] + ' bars', { kind: 'state', short: m[1] + ' bars held' });
          }
        }
      ];

      /* ------------------------------------------- reading it another way round */
      /* Traders say the same thing a dozen ways: "if trend is bullish on 15m",
         "15m trend is up", "bullish structure on the 15m", "the 15m is going up".
         When no phrase pattern matches a clause, it is scored against these
         concepts by the words it contains, in any order. A concept only wins if
         every one of its groups is present and nothing rules it out, and whatever
         it produces is marked as a reading rather than as exact. */
      const CONCEPTS = [
        {
          tpl: 'trendUp', name: 'the trend being up', subjectFromTf: true,
          groups: [['trend', 'trends', 'trending', 'structure', 'bias', 'momentum', 'direction', 'market', 'chart', 'timeframe', 'it'],
          ['up', 'upward', 'upwards', 'bullish', 'higher', 'rising', 'positive', 'long']],
          not: ['down', 'bearish', 'lower', 'falling', 'negative', 'short', 'reject', 'sweep', 'break', 'wick']
        },
        {
          tpl: 'trendDn', name: 'the trend being down', subjectFromTf: true,
          groups: [['trend', 'trends', 'trending', 'structure', 'bias', 'momentum', 'direction', 'market', 'chart', 'timeframe', 'it'],
          ['down', 'downward', 'downwards', 'bearish', 'lower', 'falling', 'negative', 'short']],
          not: ['up', 'bullish', 'higher', 'rising', 'long', 'reject', 'sweep', 'break', 'wick']
        },
        {
          tpl: 'sweep', name: 'a liquidity sweep',
          groups: [['sweep', 'sweeps', 'swept', 'sweeping', 'grab', 'grabs', 'grabbed', 'raid', 'raids', 'raided',
            'hunt', 'hunts', 'hunted', 'liquidity', 'stophunt', 'stops', 'takeout', 'wick', 'wicks', 'wicked', 'pierce', 'pierces', 'dips', 'pokes'],
          ['low', 'lows', 'high', 'highs', 'level', 'levels', 'pdl', 'pdh', 'swing', 'previous', 'prior', 'yesterday', 'equal', 'session', 'asian', 'range']],
          not: []
        },
        {
          tpl: 'rejection', name: 'a rejection candle',
          groups: [['reject', 'rejects', 'rejected', 'rejection', 'wick', 'wicks', 'tail', 'pin', 'hammer', 'shooting', 'defended', 'held', 'bounce', 'bounced', 'bounces']],
          not: ['close', 'closes', 'closed', 'break', 'breaks', 'broke']
        },
        { tpl: 'engulf', name: 'an engulfing candle', groups: [['engulf', 'engulfs', 'engulfed', 'engulfing', 'swallow', 'swallows']], not: [] },
        {
          tpl: 'fvg', name: 'a fair value gap',
          groups: [['fvg', 'imbalance', 'imbalances', 'inefficiency', 'inefficiencies', 'gap', 'gaps', 'void']], not: []
        },
        {
          tpl: 'bos', name: 'a break of structure',
          groups: [['break', 'breaks', 'broke', 'broken', 'breaking', 'bos', 'mss', 'shift', 'shifts', 'shifted'],
          ['structure', 'structural', 'market']], not: []
        },
        {
          tpl: 'choch', name: 'a change of character',
          groups: [['choch', 'character', 'flip', 'flips', 'flipped', 'reversal', 'reverses'], ['change', 'changes', 'changed', 'character', 'flip', 'flips', 'reversal']], not: []
        },
        {
          tpl: 'ob', name: 'an order block',
          groups: [['order', 'ob', 'obs', 'block', 'blocks', 'demand', 'supply', 'mitigation', 'breaker'],
          ['block', 'blocks', 'zone', 'zones', 'area', 'ob', 'obs', 'demand', 'supply']], not: []
        },
        {
          tpl: 'ma', name: 'a moving average',
          groups: [['ma', 'sma', 'ema', 'average', 'averages', 'avg', 'mas'],
          ['cross', 'crosses', 'crossed', 'crossing', 'above', 'below', 'over', 'under', 'golden', 'death', 'reclaim', 'reclaims']], not: []
        },
        { tpl: 'rsi', name: 'RSI', groups: [['rsi'], ['above', 'below', 'over', 'under', 'cross', 'crosses', 'drops', 'falls', 'rises', 'goes', 'reaches', 'hits']], not: [] },
        { tpl: 'oversold', name: 'oversold', groups: [['oversold', 'washed', 'exhausted', 'cheap', 'beaten']], not: [] },
        { tpl: 'overbought', name: 'overbought', groups: [['overbought', 'stretched', 'extended', 'expensive', 'parabolic']], not: [] },
        {
          tpl: 'volume', name: 'a volume condition',
          groups: [['volume', 'vol', 'participation', 'flow'], ['high', 'heavy', 'big', 'large', 'above', 'spike', 'spikes', 'strong', 'increasing', 'rising', 'low', 'thin']], not: []
        },
        {
          tpl: 'strong', name: 'a strong candle',
          groups: [['strong', 'conviction', 'impulsive', 'impulse', 'momentum', 'decisive', 'powerful', 'big'],
          ['candle', 'candles', 'bar', 'bars', 'close', 'closes', 'move', 'moves', 'push', 'drive']], not: []
        },
        {
          tpl: 'pullback', name: 'a pullback',
          groups: [['pullback', 'pullbacks', 'pull', 'retrace', 'retraces', 'retracement', 'dip', 'dips', 'correction', 'throwback', 'revisit']], not: []
        },
        {
          tpl: 'consolidation', name: 'consolidation',
          groups: [['consolidation', 'consolidating', 'consolidates', 'compress', 'compression', 'squeeze', 'squeezing', 'tight', 'coiling', 'range', 'ranging', 'quiet']], not: []
        },
        {
          tpl: 'equalHL', name: 'equal highs or lows',
          groups: [['equal', 'equals', 'double', 'twin', 'matching', 'same'], ['high', 'highs', 'low', 'lows', 'top', 'bottom', 'tops', 'bottoms']], not: []
        },
        {
          tpl: 'breaks', name: 'breaking a level',
          groups: [['break', 'breaks', 'broke', 'broken', 'breaking', 'breakout', 'clears', 'clear', 'through', 'beyond', 'past'],
          ['high', 'highs', 'low', 'lows', 'level', 'levels', 'resistance', 'support', 'range', 'swing', 'previous', 'prior', 'yesterday', 'pdh', 'pdl']], not: []
        }
      ];
      function conceptTokens(txt) {
        return String(txt).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
      }
      function conceptMatch(txt, opt) {
        const toks = conceptTokens(txt), has = w => toks.indexOf(w) >= 0;
        const tfSubject = !!(opt && opt.hasTf);
        const hits = [];
        CONCEPTS.forEach(C => {
          if (C.not.some(has)) return;
          let score = 0;
          for (let g = 0; g < C.groups.length; g++) {
            const n = C.groups[g].filter(has).length;
            if (!n) {
              if (g === 0 && C.subjectFromTf && tfSubject) { score += 1; continue; }  /* "the 4h is going up" */
              return;
            }
            score += n;
          }
          hits.push({ tpl: C.tpl, name: C.name, score: score });
        });
        hits.sort((a, b) => b.score - a.score);
        if (!hits.length) return null;
        if (hits.length > 1 && hits[0].score === hits[1].score)
          return { ambiguous: [hits[0].name, hits[1].name] };
        return hits[0];
      }
      function templateById(id) {
        for (let i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].id === id) return TEMPLATES[i];
        return null;
      }

      /* ------------------------------------------------------- the assembler */
      const SEQ_WORDS = /^(?:then|after that|after which|followed by|next|and then|once|after|subsequently|later|when|while waiting|wait)\b/i;
      const WAIT_WORDS = /\bwait(?:s|ing)?\s+for\b|\bwait\s+until\b|\blook\s+for\b|\bonce\b|\bafter\b|\bfollowing\b|\bsubsequently\b|\beventually\b|\bgoes?\s+on\s+to\b/i;
      const NEG_WORDS = /\bunless\b|\bdoes not\b|\bdoesn'?t\b|\bdon'?t\b|\bdo not\b|\bwithout\b|\bfails? to\b|\bmust not\b|\bnever\b|\bavoid\b|\bexcept\b|\bnot in\b|\bnot between\b|\bnot on\b|\bno trades?\b|\bno\b\s/i;
      const FILTER_WORDS = /^(?:only if|provided|providing|as long as|while|given|but only|if)\b/i;
      const ROLE_WORDS = [
        [/\b(?:exit|close|get out of|flatten|cover)\s+(?:the\s+|my\s+|any\s+)?(?:long|longs)\b/, 'exitLong'],
        [/\b(?:exit|close|get out of|flatten|cover)\s+(?:the\s+|my\s+|any\s+)?(?:short|shorts)\b/, 'exitShort'],
        [/\b(?:exit|close the trade|close everything|get out|flatten|take profit when|cover)\b/, 'exitBoth'],
        [/\b(?:buy|go long|long|enter long|open a long|bullish entry)\b/, 'long'],
        [/\b(?:sell short|short|go short|sell|enter short|open a short|bearish entry)\b/, 'short']
      ];

      function splitSentences(text) {
        return String(text || '').replace(/\r/g, '')
          .replace(/(\d)\.(\d)/g, '$1\u0001$2')
          .split(/[\n;.!?]+/)
          .map(s => s.replace(/\u0001/g, '.').trim())
          .filter(s => s.replace(/[^a-z0-9]/gi, '').length > 2 || HEAD_TF.test(s));   /* "5M:" is a heading, not noise */
      }
      function splitClauses(sentence) {
        const parts = [];
        sentence = sentence.replace(/\b(higher|lower)\s+highs?\s+and\s+(higher|lower)\s+lows?\b/gi, '$1 highs \u0003 $2 lows')
          .replace(/\bbreaks?\s+and\s+clos\w*\s+(above|below)\b/gi, 'closes $1')
          .replace(/\bclos\w*\s+and\s+breaks?\s+(above|below)\b/gi, 'closes $1');
        sentence = sentence.replace(/(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\s+(?:and|to|until|till)\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/gi,
          (m, a, b) => a + '\u0002' + b);
        const re = /\b(then|after that|after which|followed by|and then|once|after(?!\s+\d)|next(?!\s+(?:candle|bar|\d))|and|or|with|while|unless|only if|provided that|as long as|plus|but|if)\b|,/gi;
        let last = 0, conn = '';
        let m;
        while ((m = re.exec(sentence)) !== null) {
          const chunk = sentence.slice(last, m.index);
          if (chunk.replace(/[^a-z0-9]/gi, '').length > 1) parts.push({ conn: conn, text: chunk });
          else if (parts.length && SEQ_WORDS.test(conn)) parts[parts.length - 1].seqSelf = true;
          conn = (m[1] || ',').toLowerCase();
          last = m.index + m[0].length;
        }
        const tail = sentence.slice(last);
        if (tail.replace(/[^a-z0-9]/gi, '').length > 1) parts.push({ conn: conn, text: tail });
        else if (parts.length && SEQ_WORDS.test(conn)) parts[parts.length - 1].seqSelf = true;  /* "...a strong candle after that" */
        parts.forEach(p => { p.text = p.text.replace(/\u0002/g, ' and ').replace(/\u0003/g, ' and '); });
        return parts;
      }
      function clauseNoise(txt) {
        return txt.replace(NOISE, '').replace(/\b(price|candle|bar|market|it|we|you|i|wait for|want|see|get|immediately|straight|away|that|this|there|is|are|a|an|the)\b/gi, '')
          .replace(/[^a-z0-9]/gi, '').length;
      }

      /* A description written in sections — "15M:", "BUY RULE:", "NO TRADE:" —
         carries context forward: everything under a timeframe heading is read on
         that timeframe, everything under a side heading belongs to that side. */
      const HEAD_TF = /^\s*[*\-•]?\s*(\d{1,3}\s*(?:m|min|h|hr|d|w))\s*(?:timeframe|chart)?\s*:?\s*$/i;
      const HEAD_SIDE = /^\s*[*\-\u2022]?\s*(buy|long|sell|short)(?:\s+(?:rule|rules|setup|side|entry|conditions?)\b[^.]*)?:?\s*$/i;
      const HEAD_NONE = /^\s*[*\-•]?\s*(no trade|do not trade|filters?|notes?)\s*:?\s*$/i;
      const SWING_DEF = /\bswing\s+(?:high|low)\s+is\b[\s\S]*?(\d+)\s*(?:completed\s*)?candles?\s*(?:before|either side|on each side)/i;
      const ENTRY_AT = /\benter\b[\s\S]{0,40}\bat the\s+(close|open)\b/i;

      function interpretStrategy(text) {
        const cov = [], ir = {
          v: 2, name: '', text: String(text || ''),
          long: null, short: null, exitLong: { mode: 'any', c: [] }, exitShort: { mode: 'any', c: [] }, coverage: []
        };
        const plans = { long: { steps: [], filters: [] }, short: { steps: [], filters: [] } };
        const ctx = { bias: 'long', lastRef: null, lastCmp: null, prevStepId: null };
        const stopSpec = {}, stopBySide = {}, targetSpec = {};
        let stepNo = 0;
        let sectionTf = null, sectionSide = null, noTradeSection = false;

        /* the swing definition, if the description gives one */
        const sd = String(text || '').match(SWING_DEF);
        if (sd) {
          ir.swingK = Math.max(1, Math.min(20, +sd[1]));
          cov.push({
            text: sd[0].trim().slice(0, 120), status: 'exact',
            detail: 'a swing point needs ' + ir.swingK + ' candles either side of it, and is only confirmed once those later candles exist'
          });
        }

        splitSentences(text).forEach((sentence, sentenceIx) => {
          sentence = sentence.replace(/^\s*[*\-\u2022]+\s*/, '').trim();
          if (!sentence) return;

          /* section headings set the context for the lines under them */
          let hm = sentence.match(HEAD_TF);
          if (hm) {
            const tfh = timeframeIn(' ' + hm[1].toLowerCase().replace(/\s+/g, '') + ' ');
            if (tfh) { sectionTf = tfh.tf; cov.push({ text: sentence, status: 'exact', detail: 'everything below this is read on the ' + tfh.tf }); return; }
          }
          hm = sentence.match(HEAD_SIDE);
          if (hm) {
            sectionSide = /sell|short/i.test(hm[1]) ? 'short' : 'long';
            sectionTf = null;
            cov.push({ text: sentence, status: 'exact', detail: 'everything below this belongs to the ' + sectionSide + ' side' });
            return;
          }
          if (HEAD_NONE.test(sentence)) {
            noTradeSection = true; sectionTf = null;
            cov.push({ text: sentence, status: 'exact', detail: 'read as a list of things that must not happen' }); return;
          }

          /* where the trade is actually taken */
          if (/\bswing\s+(?:high|low)\s+is\b/i.test(sentence) || /^\s*swing definition/i.test(sentence)) {
            if (!sd) cov.push({ text: sentence, status: 'ambiguous', detail: 'read as a definition, not as a rule, but the number of candles either side was not clear' });
            return;
          }
          const em = sentence.match(ENTRY_AT);
          if (em) {
            ir.entry = em[1].toLowerCase() === 'close' ? 'close' : 'open';
            cov.push({
              text: sentence, status: 'exact',
              detail: ir.entry === 'close'
                ? 'the trade is taken at the close of the candle that completes the setup, with spread and slippage charged on that price'
                : 'the trade is taken at the open of the candle after the setup completes'
            });
            return;
          }

          if (noTradeSection) {
            cov.push({
              text: sentence, status: 'exact',
              detail: 'no separate rule is needed: the buy plan only fires when its own 15m condition holds and the sell plan when its own does, so they cannot fire against each other'
            });
            return;
          }

          const low = ' ' + sentence.toLowerCase()
            .replace(/\bsell[- ]?side\b/g, 'ssl').replace(/\bbuy[- ]?side\b/g, 'bsl') + ' ';
          /* what is this sentence for? */
          let role = null, at = -1, cut = 0;
          ROLE_WORDS.forEach(R => {
            const m = low.match(R[0]);
            if (m && (role === null || m.index < at)) { role = R[1]; at = m.index; cut = m.index + m[0].length; }
          });
          /* stop and target sentences are handled as position settings, not rules */
          const sCand = sentence.match(/\bstop[- ]?(?:loss)?\b[^.]{0,30}?\b(?:is|=|at|goes)\b[^.]{0,30}?\b(?:the\s+)?(?:signal|entry|confirmation|setup)?\s*(?:candle|bar)'?s?\s*(low|high)\b/i)
            || sentence.match(/\bstop[- ]?(?:loss)?\b[^.]{0,20}\b(?:is|=)\b\s*(?:the\s+)?(low|high)\b/i);
          if (sCand && !/\bstop trading\b/i.test(sentence)) {
            const part = sCand[1].toLowerCase();
            const side = /\bsell|short\b/i.test(sentence) ? 'short' : /\bbuy|long\b/i.test(sentence) ? 'long' : (sectionSide || null);
            const snap = {
              mode: 'struct', op: { step: 'LAST', part: part }, ref: 'confirmation', tf: (timeframeIn(' ' + sentence.toLowerCase() + ' ') || {}).tf || null,
              name: 'the ' + part + ' of the candle that completes the setup'
            };
            if (side) stopBySide[side] = snap; else { stopBySide.long = snap; stopBySide.short = snap; }
            stopSpec.op = snap.op; stopSpec.name = snap.name; stopSpec.ref = snap.ref; stopSpec.tf = snap.tf;
            cov.push({
              text: sentence, status: 'exact',
              detail: 'stop loss placed exactly at ' + snap.name + ', with no buffer added'
            });
            if (!/\b(?:target|take profit|tp)\b/i.test(sentence)) return;
          }
          if (/\bstop\b|\bsl\b/i.test(sentence) && /\b(below|above|under|over|at)\b/i.test(sentence) && !/\bstop trading\b/i.test(sentence)) {
            const r = matchRef(sentence.toLowerCase());
            const refPrev = /\b(?:the\s+)?(?:\d+\s*[mhdw]\s+)?(?:liquidity\s+)?(?:sweep|rejection|signal|entry|setup|breakout|confirmation)\b/i.test(sentence)
              || /\bthe wick\b/i.test(sentence);
            if (r) { stopSpec.op = r.op; stopSpec.name = r.name; stopSpec.status = r.status; }
            else if (refPrev) {
              const which = (sentence.match(/\b(sweep|rejection|entry|signal|setup|breakout|confirmation)\b/i) || [])[1];
              stopSpec.op = { step: 'LAST', part: /\babove\b|\bhigh\b/i.test(sentence) ? 'high' : 'low' };
              stopSpec.ref = which ? which.toLowerCase() : null;
              const stf = timeframeIn(' ' + sentence.toLowerCase() + ' ');
              stopSpec.tf = stf ? stf.tf : null;
              stopSpec.name = 'the ' + (/\babove\b|\bhigh\b/i.test(sentence) ? 'high' : 'low') + ' of the ' + (which ? which.toLowerCase() + ' candle' : 'candle that completed the setup');
              stopSpec.status = 'default';
              stopSpec.detail = 'the stop is placed exactly at that candle\'s extreme, with no buffer added';
            }
            if (stopSpec.op) {
              const side = /\bsell|short\b/i.test(sentence) ? 'short'
                : /\bbuy|long\b/i.test(sentence) ? 'long'
                  : (sectionSide || null);
              const snap = {
                mode: 'struct', op: JSON.parse(JSON.stringify(stopSpec.op)), name: stopSpec.name,
                ref: stopSpec.ref || null, tf: stopSpec.tf || null
              };
              if (side) stopBySide[side] = snap; else { stopBySide.long = snap; stopBySide.short = snap; }
              cov.push({
                text: sentence, status: stopSpec.status || 'exact',
                detail: 'stop loss placed at ' + stopSpec.name + (stopSpec.detail ? ' — ' + stopSpec.detail : '')
              });
              if (!/\b(?:target|take profit|tp)\b/i.test(sentence)) return;
            }
          }
          if (/\b(?:target|take[- ]?profit|tp)\b/i.test(sentence) && /\d/.test(sentence) && !/\bwhen\b/i.test(sentence)) {
            if (!targetSpec.type) {
              const rr = sentence.match(/(\d+(?:\.\d+)?)\s*r\b/i)
                || sentence.match(/(\d+(?:\.\d+)?)\s*times?\s+(?:the\s+)?risk\b/i)
                || sentence.match(/1\s*(?::|to|\/)\s*(\d+(?:\.\d+)?)/);
              const pct = sentence.match(/(\d+(?:\.\d+)?)\s*%/);
              if (rr) { targetSpec.type = 'rr'; targetSpec.v = +rr[1]; cov.push({ text: sentence, status: 'exact', detail: 'take profit at ' + rr[1] + ' times the stop distance' }); }
              else if (pct) { targetSpec.type = 'pct'; targetSpec.v = +pct[1]; cov.push({ text: sentence, status: 'exact', detail: 'take profit ' + pct[1] + '% from entry' }); }
            }
            if (targetSpec.type && stopSpec.op) return;
            if (targetSpec.type && !/\b(?:buy|sell|long|short|entry|when)\b/i.test(sentence)) return;
          }
          if (SETTINGS_WORDS.test(sentence) && !role && clauseNoise(sentence) < 6) return;

          if (role === null && sectionSide) { role = sectionSide; }
          else if (role === null) {
            role = 'long'; cov.push({
              text: sentence, status: 'ambiguous',
              detail: 'this sentence did not say buy or sell, so it was read as part of the long entry'
            });
          }
          const bias = (role === 'short' || role === 'exitShort') ? 'short' : 'long';
          const body = (at > 0 ? sentence.slice(0, at) + ' , ' : '') + sentence.slice(Math.max(0, cut - 1));
          ctx.bias = bias; ctx.prevStepId = null;

          const clauses = splitClauses(body);
          const sentenceSeq = /^\s*(?:after|once|then|following|subsequently|wait|when)\b/i.test(sentence.replace(/^\s*[*\-\u2022]+\s*/, ''))
            || WAIT_WORDS.test(sentence);
          let firstOfSentence = true, roleNow = role, biasNow = bias;
          clauses.forEach(cl => {
            let raw = cl.text.trim();
            const ent = raw.match(/^\s*(buy|go long|enter long|long|sell short|go short|enter short|short|sell)\b/i);
            if (ent && !/^\s*(?:sell|buy)[- ]side\b/i.test(raw)) {
              biasNow = /short|sell/i.test(ent[1]) ? 'short' : 'long';
              roleNow = biasNow;
              ctx.bias = biasNow;
              raw = raw.slice(ent[0].length).replace(/^\s*(?:when|if|once|on|at)\b/i, '').trim();
              if (!raw) return;
            }
            const sw = raw.match(/^\s*(?:exit|close|get out of|get out|cover|flatten|take profit)\b\s*(?:the\s+|my\s+|any\s+)?(long|short)?s?/i);
            if (sw) {
              roleNow = sw[1] ? ('exit' + sw[1][0].toUpperCase() + sw[1].slice(1).toLowerCase()) : 'exitBoth';
              raw = raw.slice(sw[0].length).replace(/^\s*(?:when|if|once)\b/i, '').trim();
              if (!raw) return;
            }
            if (clauseNoise(raw) < 3) return;
            if (SETTINGS_WORDS.test(raw) && clauseNoise(raw) < 8) return;

            let tfHit = timeframeIn(' ' + raw.toLowerCase() + ' ');
            if (!tfHit && sectionTf) tfHit = { tf: sectionTf, exact: true, at: '\u0000', fromSection: true };
            const txt = ' ' + raw.toLowerCase().replace(/\s+/g, ' ').split(tfHit ? tfHit.at : '\u0000').join(' ') + ' ';
            if (clauseNoise(txt) < 3) return;              /* nothing left once the timeframe is taken out */
            /* things this engine cannot compute at all */
            const why = (typeof refusalFor === 'function') ? refusalFor(raw) : null;
            if (why) { cov.push({ text: raw, status: 'unsupported', detail: why }); return; }

            const neg = NEG_WORDS.test(txt) || SEQ_WORDS.test('') && false;
            const win = windowFrom(txt);
            const curPlan = plans[biasNow === 'short' ? 'short' : 'long'];
            ctx.prevStepId = curPlan.steps.length ? curPlan.steps[curPlan.steps.length - 1].id : null;

            let builtList = [], unsupported = null, work = txt, guard = 0, orderOnly = false;
            while (guard++ < 4) {
              let hit = null, hitAt = null;
              for (let i = 0; i < TEMPLATES.length; i++) {
                TEMPLATES[i].re.lastIndex = 0;
                const m = TEMPLATES[i].re.exec(work);
                if (!m) continue;
                const r = TEMPLATES[i].build(work, ctx);
                if (!r) continue;
                if (r.ordering) { hit = 'ORDER'; hitAt = m[0]; break; }
                if (r.unsupported) { if (!unsupported) unsupported = r.unsupported; continue; }
                hit = r; hitAt = m[0]; break;
              }
              if (!hit) break;
              if (hit === 'ORDER') {
                work = work.split(hitAt).join(' ');
                const left = work.replace(/\b(bullish|bearish|long|short|buy|sell|side|leg|move)\b/g, ' ');
                if (clauseNoise(left) < 3) { orderOnly = true; break; }
                continue;
              }
              const key = JSON.stringify(hit.cond);
              const types = c => {
                const out = {};
                (function walk(x) {
                  if (!x) return;
                  if (x.all) return x.all.forEach(walk);
                  if (x.any) return x.any.forEach(walk);
                  if (x.not) return walk(x.not);
                  if (x.f) { out['f:' + x.f] = 1; return; }
                  [x.l, x.r].forEach(o => { if (o && o.t && o.t !== 'num') out[o.t] = 1; if (o && o.step) out['step'] = 1; });
                })(c);
                return out;
              };
              const newT = types(hit.cond);
              const clash = builtList.some(b => {
                const old = types(b.cond);
                return Object.keys(newT).some(k => old[k]);
              });
              if (!clash && !builtList.some(b => JSON.stringify(b.cond) === key)) builtList.push(hit);
              work = work.split(hitAt).join(' ');
              if (clauseNoise(work) < 3) break;
            }
            let built = null;
            if (builtList.length === 1) built = builtList[0];
            else if (builtList.length > 1) {
              const rank = { exact: 0, default: 1, ambiguous: 2, unsupported: 3 };
              const worst = builtList.reduce((a, b) => rank[b.status] > rank[a.status] ? b : a);
              built = {
                cond: { all: builtList.map(b => b.cond) },
                label: builtList.map(b => b.label).join(', and '),
                short: builtList.map(b => b.short).join(' + '),
                status: worst.status,
                detail: builtList.map(b => b.detail).filter(Boolean).join(' '),
                kind: builtList.some(b => b.kind !== 'state') ? 'event' : 'state'
              };
            }
            if (orderOnly && !builtList.length) {
              cov.push({ text: raw, status: 'exact', detail: 'this only says which step comes after which, and that order is already how the steps below run' });
              return;
            }
            if (!built && !unsupported) {
              const toks = conceptTokens(txt);
              if (toks.some(w => ['trend', 'structure', 'bias', 'momentum', 'direction'].indexOf(w) >= 0) &&
                !toks.some(w => ['up', 'down', 'bullish', 'bearish', 'higher', 'lower', 'rising', 'falling', 'long', 'short', 'positive', 'negative'].indexOf(w) >= 0)) {
                cov.push({
                  text: raw, status: 'ambiguous',
                  detail: 'you named the trend but not which way — write "trend is bullish" or "trend is bearish" and it becomes a rule'
                });
                return;
              }
              const guess = conceptMatch(txt, { hasTf: !!tfHit });
              if (guess && guess.ambiguous) {
                cov.push({
                  text: raw, status: 'ambiguous',
                  detail: 'that could mean ' + guess.ambiguous[0] + ' or ' + guess.ambiguous[1] + ' — say which and it will be read exactly'
                });
                return;
              }
              if (guess) {
                const T2 = templateById(guess.tpl);
                const r2 = T2 && T2.build(txt, ctx);
                if (r2 && !r2.unsupported) {
                  r2.status = 'default';
                  r2.detail = (r2.detail ? r2.detail + ' ' : '') + 'read as ' + guess.name + ', from the words you used rather than an exact phrase — reword it if that is not what you meant';
                  built = r2;
                }
              }
            }
            if (!built) {
              if (!unsupported && SETTINGS_WORDS.test(raw)) return;   /* read by the settings pass */
              const vague = vagueRef(txt);
              cov.push({
                text: raw, status: 'unsupported',
                detail: unsupported || (vague ? '"' + vague + '" cannot be located objectively from open, high, low and close'
                  : 'no rule in this engine matches that phrase'),
                suggestions: (typeof suggestFor === 'function') ? suggestFor(raw) : []
              });
              return;
            }

            const leftover = vagueRef(txt);
            if (leftover && !/\bsupport and resistance\b/.test(txt)) {
              const LEVELS = {
                pdh: 1, pdl: 1, pwh: 1, pwl: 1, swingHi: 1, swingLo: 1, hh: 1, ll: 1, asiaHi: 1, asiaLo: 1,
                sessHi: 1, sessLo: 1, sma: 1, ema: 1, vwap: 1, dayOpen: 1, poc: 1, bbu: 1, bbl: 1, fvgUpMid: 1, fvgDnMid: 1
              };
              let usesLevel = false;
              (function walk(c) {
                if (!c || usesLevel) return;
                if (c.all) return c.all.forEach(walk);
                if (c.any) return c.any.forEach(walk);
                if (c.not) return walk(c.not);
                [c.l, c.r].forEach(o => { if (o && (o.step || LEVELS[o.t])) usesLevel = true; });
              })(built.cond);
              if (!usesLevel) cov.push({
                text: '"' + leftover + '" in: ' + raw, status: 'unsupported',
                detail: 'the rest of that clause was read, but "' + leftover + '" is not something this engine can locate from open, high, low and close. Name the level — the previous swing low, yesterday\'s low, the 20-bar low — and it becomes testable'
              });
            }
            if (tfHit) {
              applyTf(built.cond, tfHit.tf);
              built.label = built.label + ' — read on the ' + tfName(tfHit.tf);
              if (!tfHit.exact) built.status = built.status === 'exact' ? 'default' : built.status;
              built.detail = (built.detail ? built.detail + ' ' : '') +
                (tfHit.fromSection ? 'read on the ' + tfHit.tf + ', from the heading above it'
                  : tfHit.exact ? 'this condition is read on ' + tfHit.tf + ' bars, using the last ' + tfHit.tf + ' bar that had closed'
                    : '"higher timeframe" was read as four times your base timeframe');
            }
            let cond = built.cond;
            if (neg) built.label = 'it is NOT the case that ' + built.label;
            (function remember(c) {
              if (!c) return;
              if (c.all) return c.all.forEach(remember);
              if (c.any) return c.any.forEach(remember);
              if (c.f || c.not) return;
              if (c.l && c.r && !c.l.step && !c.r.step) ctx.lastCmp = JSON.parse(JSON.stringify(c));
            })(built.cond);
            if (neg) cond = { not: cond };
            const target = (roleNow === 'exitLong' || roleNow === 'exitShort' || roleNow === 'exitBoth') ? roleNow : biasNow;

            if (target === 'exitLong' || target === 'exitShort' || target === 'exitBoth') {
              const gs = target === 'exitBoth' ? ['exitLong', 'exitShort'] : [target];
              gs.forEach(g => ir[g].c.push(JSON.parse(JSON.stringify(cond))));
              cov.push({ text: raw, status: built.status, detail: built.label + (built.detail ? ' — ' + built.detail : '') });
              return;
            }

            const plan = plans[target];
            const sequenced = (sentenceSeq && firstOfSentence) || SEQ_WORDS.test(cl.conn) || cl.seqSelf || (win && win.n != null) ||
              /\bthen\b|\bafter\b(?!\s+\d)|\bfollowed by\b|\bnext candle\b|\bfollowing candle\b/i.test(raw);
            if (built.kind === 'state' && !sequenced) {
              /* only two COMPLETE windows mean "either"; an open-ended bound narrows */
              const isWindow = c => {
                if (!c) return false;
                if (c.any) return c.any.every(x => x && x.f === 'dow');
                if (!c.all || c.all.length !== 2) return false;
                return c.all.every(x => x && x.l && x.l.t === 'hour' && x.r && x.r.t === 'num');
              };
              const isTime = c => {
                let ok = true, any = false;
                (function walk(x) {
                  if (!x || !ok) return;
                  if (x.all) return x.all.forEach(walk);
                  if (x.any) return x.any.forEach(walk);
                  if (x.not) { ok = false; return; }
                  if (x.f) { if (x.f !== 'dow') ok = false; else any = true; return; }
                  [x.l, x.r].forEach(o => { if (!o) return; if (o.t === 'hour') { any = true; } else if (o.t !== 'num') ok = false; });
                })(c);
                return ok && any;
              };
              plan.filterLabels = plan.filterLabels || [];
              const prevIdx = plan.filters.length - 1;
              if (!neg && isWindow(cond) && prevIdx >= 0 && isWindow(plan.filters[prevIdx]) && cl.conn !== 'only if') {
                plan.filters[prevIdx] = { any: [plan.filters[prevIdx], cond] };
                plan.filterLabels[prevIdx] = plan.filterLabels[prevIdx] + ', or ' + built.label;
                cov.push({
                  text: raw, status: built.status,
                  detail: 'a second time window — the bar only has to fall inside one of them'
                });
                return;
              }
              const fk = JSON.stringify(cond);
              if (plan.filters.some(f => JSON.stringify(f) === fk)) {
                cov.push({ text: raw, status: built.status, detail: 'the same filter as one already in place, so it was not added twice' });
                return;
              }
              plan.filters.push(cond);
              plan.filterLabels.push(built.label);
              cov.push({ text: raw, status: built.status, detail: 'only taken while ' + built.label + (built.detail ? ' — ' + built.detail : '') });
              return;
            }
            let within = 0, winWhy = '', withinTf = (tfHit ? tfHit.tf : null);
            const prevStep = plan.steps.length ? plan.steps[plan.steps.length - 1] : null;
            /* separate lines are separate moments unless the wording ties them to one candle */
            const newLine = prevStep && prevStep.sentenceIx != null && prevStep.sentenceIx !== sentenceIx;
            const sameBarWords = /\bsame (?:candle|bar)\b|\bon that (?:candle|bar)\b|\bat the same time\b|\bsimultaneous\w*\b/.test(txt);
            const sameCandle = prevStep && prevStep.tf === withinTf &&
              /\b(?:the\s+(?:\d+\s*[mhdw]\s+)?candle|that candle|same candle)\b(?!'?s?\s*(?:high|low|close|open))/.test(txt);
            if (plan.steps.length === 0) { within = 0; }
            else if (sameCandle) { within = 0; winWhy = '"the candle" means the one from the step before, so both must be true on it'; }
            else if (win) { within = win.n; winWhy = win.exact ? '' : 'read as the very next candle'; }
            else if (sequenced) { within = LANG_DEF.seqWindow; winWhy = 'you did not say how long this step has to appear, so it must follow within ' + LANG_DEF.seqWindow + (withinTf ? ' ' + withinTf : '') + ' bars — write "within N candles" to set it yourself'; }
            else if (newLine && !sameBarWords) {
              within = LANG_DEF.seqWindow;
              winWhy = 'written on its own line, so it is taken as the next thing to happen, within ' + LANG_DEF.seqWindow + (withinTf ? ' ' + withinTf : '') +
                ' bars of the step before — write "on the same candle" if they must all happen at once, or "within N candles" to set the gap';
            }
            else if (withinTf && prevStep && prevStep.tf !== withinTf) {
              within = LANG_DEF.seqWindow; winWhy = 'no limit was given, so this step must follow the one before it within ' + LANG_DEF.seqWindow + ' ' + withinTf + ' bars — write "within N candles" to set it yourself';
            }
            else { within = 0; winWhy = 'joined with "and", so this describes the same candle as the step before it — write "then" if you meant a later candle'; }

            /* same bar as the previous step means the same candle: merge, do not stack */
            if (within === 0 && plan.steps.length && (sameCandle || !withinTf || (prevStep && prevStep.tf === withinTf))) {
              const prev = plan.steps[plan.steps.length - 1];
              (function walk(c) {
                if (!c) return; if (c.all) return c.all.forEach(walk); if (c.any) return c.any.forEach(walk);
                if (c.not) return walk(c.not);
                if (c.l && c.l.step === 'PREV') c.l.step = plan.steps.length > 1 ? plan.steps[plan.steps.length - 2].id : null;
                if (c.r && c.r.step === 'PREV') c.r.step = plan.steps.length > 1 ? plan.steps[plan.steps.length - 2].id : null;
              })(cond);
              const have = prev.cond.all ? prev.cond.all : [prev.cond];
              const key = JSON.stringify(cond);
              if (have.some(x => JSON.stringify(x) === key)) {
                cov.push({ text: raw, status: built.status, detail: 'the same requirement as the step before it, so it was not added twice' });
                return;
              }
              prev.cond = { all: have.concat([cond]) };
              prev.label = prev.label + ', and ' + built.label;
              cov.push({ text: raw, status: built.status, detail: 'on the same candle, ' + built.label + (built.detail ? ' — ' + built.detail : '') });
              return;
            }
            stepNo++;
            const id = 's' + stepNo;

            /* resolve a reference to the previous step */
            const fix = o => { if (o && o.step === 'PREV') o.step = plan.steps.length ? plan.steps[plan.steps.length - 1].id : null; };
            (function walk(c) {
              if (!c) return; if (c.all) return c.all.forEach(walk); if (c.any) return c.any.forEach(walk);
              if (c.not) return walk(c.not); fix(c.l); fix(c.r);
            })(cond);

            const dupKey = JSON.stringify(cond);
            if (prevStep && JSON.stringify(prevStep.cond) === dupKey) {
              cov.push({ text: raw, status: built.status, detail: 'the same requirement as the step before it, so it was not added twice' });
              return;
            }
            plan.steps.push({ id: id, label: built.label, short: built.short, cond: cond, within: within, withinTf: withinTf, tf: withinTf, sentenceIx: sentenceIx });
            cov.push({
              text: raw, status: (built.status === 'exact' && (!winWhy || within === 0 && plan.steps.length === 1)) ? built.status : (built.status === 'exact' && winWhy ? 'default' : built.status),
              detail: built.label + (built.detail ? ' — ' + built.detail : '') + (winWhy && plan.steps.length > 1 ? ' (' + winWhy + ')' : '')
            });
            firstOfSentence = false;
          });
        });

        ['long', 'short'].forEach(side => {
          const p = plans[side];
          if (!p.steps.length && p.filters.length) {       /* "buy when RSI<30 and price>200MA" */
            p.steps = [{
              id: side[0] + '0', label: (p.filterLabels && p.filterLabels.length === p.filters.length
                ? p.filterLabels.map(l => /, or /.test(l) ? '(' + l + ')' : l).join(', and ')
                : p.filters.map(c => condToText(c, 'UTC', [])).join(' and ')),
              short: 'the entry conditions', cond: { all: p.filters.slice() }, within: 0
            }];
            p.filters = []; p.filterLabels = [];
          }
        });
        if (plans.long.steps.length) ir.long = plans.long;
        if (plans.short.steps.length) ir.short = plans.short;
        /* a filter with no entry on that side is noise */
        if (!ir.long && plans.long.filters.length && !ir.short) {
          plans.long.steps = [];
        }
        ir.coverage = cov;
        ir.stop = stopSpec.op ? { mode: 'struct', op: stopSpec.op, name: stopSpec.name, ref: stopSpec.ref || null, tf: stopSpec.tf || null } : null;
        if (stopBySide.long || stopBySide.short) {
          ir.stop = ir.stop || { mode: 'struct' };
          ir.stop.bySide = { long: stopBySide.long || null, short: stopBySide.short || null };
          const any = stopBySide.long || stopBySide.short;
          ir.stop.op = any.op; ir.stop.name = any.name; ir.stop.ref = any.ref; ir.stop.tf = any.tf;
        }
        ir.target = targetSpec.type ? targetSpec : null;
        ir.name = (String(text || '').trim().split(/\s+/).slice(0, 8).join(' ').replace(/[.,]$/, '') || 'My strategy').slice(0, 60);
        return ir;
      }

      /* ------------------------------------------------------------- 6. metrics */
      function computeMetrics(run, cfg) {
        const tz = cfg.tz, trades = run.trades, equity = run.equity;
        const m = {};
        m.start = cfg.balance;
        m.end = equity.length ? equity[equity.length - 1].eq : cfg.balance;
        m.pnl = m.end - m.start;
        m.pnlPct = m.start > 0 ? m.pnl / m.start * 100 : 0;

        const wins = trades.filter(t => t.net > 0), losses = trades.filter(t => t.net <= 0);
        m.total = trades.length; m.wins = wins.length; m.losses = losses.length;
        m.winRate = trades.length ? wins.length / trades.length * 100 : 0;
        m.grossProfit = wins.reduce((s, t) => s + t.net, 0);
        m.grossLoss = losses.reduce((s, t) => s + t.net, 0);          /* negative or zero */
        m.avgWin = wins.length ? m.grossProfit / wins.length : 0;
        m.avgLoss = losses.length ? m.grossLoss / losses.length : 0;
        m.profitFactor = m.grossLoss < 0 ? m.grossProfit / Math.abs(m.grossLoss) : (m.grossProfit > 0 ? Infinity : 0);
        m.largestWin = wins.length ? Math.max.apply(null, wins.map(t => t.net)) : 0;
        m.largestLoss = losses.length ? Math.min.apply(null, losses.map(t => t.net)) : 0;
        m.realised = trades.reduce((s, t) => s + t.net, 0);
        m.expectancy = trades.length ? m.realised / trades.length : 0;
        m.totalCosts = trades.reduce((s, t) => s + t.costs, 0);
        m.totalCommission = trades.reduce((s, t) => s + t.commission, 0);
        m.avgHold = trades.length ? trades.reduce((s, t) => s + t.hold, 0) / trades.length : 0;
        m.longs = trades.filter(t => t.dir === 1).length;
        m.shorts = m.total - m.longs;
        m.longWins = trades.filter(t => t.dir === 1 && t.net > 0).length;
        m.shortWins = trades.filter(t => t.dir === -1 && t.net > 0).length;
        m.tpExits = trades.filter(t => t.reason === 'Take profit').length;
        m.slExits = trades.filter(t => t.reason === 'Stop loss').length;
        m.sigExits = trades.filter(t => t.reason === 'Reverse signal').length;
        m.ruleExits = trades.filter(t => t.reason === 'Exit rule').length;
        m.endExits = trades.filter(t => t.reason === 'End of period').length;

        /* ---- equity, drawdown --------------------------------------------- */
        let peak = m.start, maxDD = 0, maxDD$ = 0, trough = m.start, lowest = m.start;
        const ddSeries = [];
        const episodes = []; let inDD = false, epStart = 0, epPeak = m.start, epMin = Infinity, epMinPct = 0;
        for (let i = 0; i < equity.length; i++) {
          const e = equity[i];
          if (e.eq > peak) peak = e.eq;
          if (e.eq < lowest) lowest = e.eq;
          const dd$ = e.eq - peak;
          const ddP = peak > 0 ? dd$ / peak * 100 : 0;
          ddSeries.push({ t: e.t, dd: ddP, dd$: dd$ });
          if (ddP < -0.0001) {
            if (!inDD) { inDD = true; epStart = e.t; epPeak = peak; epMin = e.eq; epMinPct = ddP; }
            if (e.eq < epMin) epMin = e.eq;
            if (ddP < epMinPct) epMinPct = ddP;
          } else if (inDD) {
            episodes.push({ from: epStart, to: e.t, depthPct: epMinPct, depth$: epMin - epPeak, days: (e.t - epStart) / 86400000 });
            inDD = false;
          }
          if (ddP < maxDD) { maxDD = ddP; maxDD$ = dd$; }
        }
        if (inDD && equity.length) episodes.push({
          from: epStart, to: equity[equity.length - 1].t, depthPct: epMinPct,
          depth$: epMin - epPeak, days: (equity[equity.length - 1].t - epStart) / 86400000, ongoing: true
        });
        m.maxDD = maxDD; m.maxDD$ = maxDD$; m.peakBal = peak; m.lowBal = lowest;
        m.ddSeries = ddSeries; m.ddEpisodes = episodes;
        m.avgDD = episodes.length ? episodes.reduce((s, e) => s + e.depthPct, 0) / episodes.length : 0;
        m.longestDD = episodes.length ? Math.max.apply(null, episodes.map(e => e.days)) : 0;
        m.longestDDEp = episodes.length ? episodes[episodes.map(e => e.days).indexOf(m.longestDD)] : null;
        m.recoveryFactor = maxDD$ < 0 ? m.pnl / Math.abs(maxDD$) : null;

        /* ---- daily series -------------------------------------------------- */
        const dayMap = {}, dayOrder = [];
        for (let i = 0; i < equity.length; i++) {
          const k = dayKey(equity[i].t, tz);
          if (dayMap[k] == null) { dayOrder.push(k); dayMap[k] = { key: k, t: equity[i].t, eq: equity[i].eq }; }
          dayMap[k].eq = equity[i].eq;
        }
        const dayTrades = {};
        trades.forEach(t => { const k = dayKey(t.exitT, tz); dayTrades[k] = (dayTrades[k] || 0) + 1; });
        const days = []; let prevEq = m.start;
        for (let i = 0; i < dayOrder.length; i++) {
          const d = dayMap[dayOrder[i]];
          days.push({
            key: d.key, t: d.t, eq: d.eq, pnl: d.eq - prevEq, ret: prevEq > 0 ? (d.eq - prevEq) / prevEq : 0,
            n: dayTrades[d.key] || 0
          });
          prevEq = d.eq;
        }
        m.days = days;
        m.tradingDays = days.length;
        m.avgDaily = days.length ? days.reduce((s, d) => s + d.pnl, 0) / days.length : 0;
        const sorted = days.slice().sort((a, b) => b.pnl - a.pnl);
        m.bestDays = sorted.slice(0, 5);
        m.worstDays = sorted.slice(-5).reverse();
        m.bestDay = sorted.length ? sorted[0] : null;
        m.worstDay = sorted.length ? sorted[sorted.length - 1] : null;
        /* ---- months ---------------------------------------------------------- */
        const monKeys = [], monMap = {};
        days.forEach(d => {
          const k = d.key.slice(0, 7);
          if (!monMap[k]) { monKeys.push(k); monMap[k] = { key: k, t: d.t, pnl: 0, n: 0, days: 0, startEq: null, endEq: null }; }
          const mm = monMap[k];
          if (mm.startEq === null) mm.startEq = d.eq - d.pnl;      /* the balance it opened with */
          mm.pnl += d.pnl; mm.n += d.n; mm.endEq = d.eq;
          if (d.n) mm.days++;
        });
        m.months = monKeys.map(k => {
          const mm = monMap[k];
          return {
            key: k, t: mm.t, pnl: mm.pnl, n: mm.n, tradingDays: mm.days,
            ret: mm.startEq > 0 ? mm.pnl / mm.startEq * 100 : 0,
            startEq: mm.startEq, endEq: mm.endEq
          };
        });
        const monSorted = m.months.slice().sort((a, b) => b.pnl - a.pnl);
        m.bestMonths = monSorted.slice(0, 5);
        m.worstMonths = monSorted.slice(-5).reverse();
        m.bestMonth = monSorted.length ? monSorted[0] : null;
        m.worstMonth = monSorted.length ? monSorted[monSorted.length - 1] : null;
        m.greenMonths = m.months.filter(x => x.pnl > 0).length;
        m.redMonths = m.months.filter(x => x.pnl < 0).length;

        /* how many days in each month went which way */
        const dayByMonth = {};
        days.forEach(d => { const k = d.key.slice(0, 7); (dayByMonth[k] = dayByMonth[k] || []).push(d); });
        m.months.forEach(x => {
          const list = dayByMonth[x.key] || [];
          x.greenDays = list.filter(d => d.pnl > 0).length;
          x.redDays = list.filter(d => d.pnl < 0).length;
          x.flatDays = list.filter(d => d.pnl === 0).length;
        });

        /* ---- by day of the week --------------------------------------------- */
        const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const wd = WD.map((name, i) => ({
          i: i, name: name, pnl: 0, trades: 0, wins: 0, days: 0, pnlPct: 0,
          avgPerDay: 0, winRate: 0, greenDays: 0, redDays: 0
        }));
        days.forEach(d => {
          const a = d.key.split('-').map(Number);
          const idx = new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay();
          const w = wd[idx];
          w.pnl += d.pnl;
          if (d.n) { w.days++; if (d.pnl > 0) w.greenDays++; else if (d.pnl < 0) w.redDays++; }
        });
        trades.forEach(t => {
          const k = dayKey(t.entryT, tz).split('-').map(Number);
          const idx = new Date(Date.UTC(k[0], k[1] - 1, k[2])).getUTCDay();
          const w = wd[idx];
          w.trades++; if (t.net > 0) w.wins++;
        });
        wd.forEach(w => {
          w.pnlPct = m.start > 0 ? w.pnl / m.start * 100 : 0;
          w.avgPerDay = w.days ? w.pnl / w.days : 0;
          w.winRate = w.trades ? w.wins / w.trades * 100 : 0;
        });
        m.weekdays = wd;
        const wdTraded = wd.filter(w => w.trades > 0);
        m.bestWeekday = wdTraded.length ? wdTraded.slice().sort((a, b) => b.pnl - a.pnl)[0] : null;
        m.worstWeekday = wdTraded.length ? wdTraded.slice().sort((a, b) => a.pnl - b.pnl)[0] : null;

        /* ---- by year --------------------------------------------------------- */
        const yrKeys = [], yrMap = {};
        days.forEach(d => {
          const k = d.key.slice(0, 4);
          if (!yrMap[k]) { yrKeys.push(k); yrMap[k] = { key: k, pnl: 0, n: 0, days: 0, startEq: null, endEq: null }; }
          const y = yrMap[k];
          if (y.startEq === null) y.startEq = d.eq - d.pnl;
          y.pnl += d.pnl; y.n += d.n; y.endEq = d.eq;
          if (d.n) y.days++;
        });
        m.years = yrKeys.map(k => {
          const y = yrMap[k];
          return {
            key: k, pnl: y.pnl, n: y.n, tradingDays: y.days,
            ret: y.startEq > 0 ? y.pnl / y.startEq * 100 : 0, startEq: y.startEq, endEq: y.endEq
          };
        });

        m.greenDays = days.filter(d => d.pnl > 0).length;
        m.redDays = days.filter(d => d.pnl < 0).length;

        /* ---- trading sessions ----------------------------------------------
           Each session is defined in the clock of its own financial centre, which
           is how the market itself defines them, and means the UTC hours shift by
           themselves when the clocks change. Sessions overlap, so a trade can be
           counted in two of them; the overlap is shown separately. */
        const SESSIONS = [
          { id: 'sydney', name: 'Sydney', tz: 'Australia/Sydney', from: 7, to: 16, note: '07:00-16:00 Sydney time' },
          { id: 'tokyo', name: 'Tokyo', tz: 'Asia/Tokyo', from: 9, to: 18, note: '09:00-18:00 Tokyo time' },
          { id: 'london', name: 'London', tz: 'Europe/London', from: 8, to: 17, note: '08:00-17:00 London time' },
          { id: 'newyork', name: 'New York', tz: 'America/New_York', from: 8, to: 17, note: '08:00-17:00 New York time' }
        ];
        const inSession = (ms, S) => { const h = hourOf(ms, S.tz); return h >= S.from && h < S.to; };
        const bucket = () => ({ n: 0, pnl: 0, wins: 0, gross: 0, grossLoss: 0 });
        const sess = {};
        SESSIONS.forEach(S => { sess[S.id] = bucket(); });
        sess.overlap = bucket();          /* London and New York at the same time */
        sess.none = bucket();
        trades.forEach(t => {
          let any = false, inLon = false, inNy = false;
          SESSIONS.forEach(S => {
            if (!inSession(t.entryT, S)) return;
            any = true;
            if (S.id === 'london') inLon = true;
            if (S.id === 'newyork') inNy = true;
            const b = sess[S.id];
            b.n++; b.pnl += t.net; if (t.net > 0) { b.wins++; b.gross += t.net; } else b.grossLoss += Math.abs(t.net);
          });
          if (inLon && inNy) { const b = sess.overlap; b.n++; b.pnl += t.net; if (t.net > 0) { b.wins++; b.gross += t.net; } else b.grossLoss += Math.abs(t.net); }
          if (!any) { const b = sess.none; b.n++; b.pnl += t.net; if (t.net > 0) { b.wins++; b.gross += t.net; } else b.grossLoss += Math.abs(t.net); }
        });
        const finish = (id, name, note) => {
          const b = sess[id];
          return {
            id: id, name: name, note: note, n: b.n, pnl: b.pnl,
            pnlPct: m.start > 0 ? b.pnl / m.start * 100 : 0,
            winRate: b.n ? b.wins / b.n * 100 : 0,
            avg: b.n ? b.pnl / b.n : 0,
            pf: b.grossLoss > 0 ? b.gross / b.grossLoss : (b.gross > 0 ? Infinity : 0)
          };
        };
        m.sessions = SESSIONS.map(S => finish(S.id, S.name, S.note));
        m.sessionOverlap = finish('overlap', 'London / New York overlap', 'while both are open');
        m.sessionNone = finish('none', 'Outside all four', 'no major centre open');
        const sessTraded = m.sessions.filter(x => x.n > 0);
        m.bestSession = sessTraded.length ? sessTraded.slice().sort((a, b) => b.pnl - a.pnl)[0] : null;
        m.worstSession = sessTraded.length ? sessTraded.slice().sort((a, b) => a.pnl - b.pnl)[0] : null;

        /* Sharpe from daily returns, annualised at 252 trading days, rf = 0 */
        if (days.length > 2) {
          const r = days.map(d => d.ret);
          const mu = r.reduce((a, b) => a + b, 0) / r.length;
          const sd = Math.sqrt(r.reduce((a, b) => a + (b - mu) * (b - mu), 0) / (r.length - 1));
          m.sharpe = sd > 0 ? mu / sd * Math.sqrt(252) : null;
          const dn = r.filter(x => x < 0);
          const dsd = dn.length > 1 ? Math.sqrt(dn.reduce((a, b) => a + b * b, 0) / dn.length) : 0;
          m.sortino = dsd > 0 ? mu / dsd * Math.sqrt(252) : null;
        } else { m.sharpe = null; m.sortino = null; }

        /* ---- hourly windows (grouped by entry hour, data timezone) ---------- */
        const hours = [];
        for (let h = 0; h < 24; h++) hours.push({ h: h, n: 0, wins: 0, pnl: 0 });
        trades.forEach(t => {
          const h = hourOf(t.entryT, tz);
          hours[h].n++; hours[h].pnl += t.net; if (t.net > 0) hours[h].wins++;
        });
        hours.forEach(x => { x.winRate = x.n ? x.wins / x.n * 100 : 0; x.avg = x.n ? x.pnl / x.n : 0; });
        const traded = hours.filter(x => x.n > 0);
        const rank = traded.slice().sort((a, b) => b.pnl - a.pnl);
        hours.forEach(h => { h.pnlPct = m.start > 0 ? h.pnl / m.start * 100 : 0; });   /* money and percent */
        m.hours = hours;
        m.bestHour = rank.length ? rank[0] : null;
        m.worstHour = rank.length ? rank[rank.length - 1] : null;
        m.hoursTraded = traded.length;

        /* ---- streaks (chronological) --------------------------------------- */
        let cur = 0, curType = 0, maxW = 0, maxL = 0;
        trades.forEach(t => {
          const w = t.net > 0 ? 1 : -1;
          if (w === curType) cur++; else { curType = w; cur = 1; }
          if (w > 0) { if (cur > maxW) maxW = cur; } else { if (cur > maxL) maxL = cur; }
        });
        m.maxWinStreak = maxW; m.maxLossStreak = maxL;
        m.curStreak = cur; m.curStreakType = curType;

        return m;
      }

      /* ------------------------------------------------------------------ 8. UI */
      const state = {
        view: 'backtest',
        symbol: 'EURUSD',
        start: '2025-01-01',
        strategy: 'ma',
        params: {},
        source: 'demo',
        datasetId: null, datasetIds: [],
        current: null,
        running: false
      };
      Object.keys(STRATS).forEach(k => {
        const S = STRATS[k];
        if (S.defaults) { state.params[k] = S.defaults(); return; }
        if (!S.params) return;
        state.params[k] = {}; S.params.forEach(p => state.params[k][p.k] = p.def);
      });
      (function restoreCustom() {
        const saved = LS.get(K_CUSTOM, null);
        if (saved && saved.entryLong && saved.entryLong.c) state.params.custom = saved;
      })();
      function saveCustom() { LS.set(K_CUSTOM, state.params.custom); }

      function todayMinusYear() {
        const d = new Date();
        return new Date(Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate())).toISOString().slice(0, 10);
      }
      function switchView(v) {
        state.view = v;
        $$('#nav button').forEach(b => {
          const on = b.dataset.view === v;
          b.classList.toggle('on', on);
          if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
        });
        $$('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
        window.scrollTo({ top: 0, behavior: 'auto' });
        if (v === 'backtest') refresh();
        if (v === 'dashboard') renderDashboard();
        if (v === 'year') renderYearView();
        if (v === 'trades') renderTradesView();
        if (v === 'settings') renderSettings();
        viewEnter(v);
      }

      /* ------------------------------------------------------------ form wiring */
      function seg(hostId, value, attr) {
        $$('#' + hostId + ' button').forEach(b => b.classList.toggle('on', b.dataset[attr] === value));
      }
      /* Choose the market and the period; the right files load by themselves. */
      function libTfList(){ return libSetsFor(state.symbol); }
      function libWanted(){
        const sets = libTfList();
        if (!sets.length) return [];
        let base = state.libTf && sets.some(x => x.tf === state.libTf) ? state.libTf : null;
        if (!base) base = (sets.find(x => x.tfMin >= 60) || sets[0]).tf;
        const extra = (state.libExtra || []).filter(t => sets.some(x => x.tf === t) && TF_MIN[t] > TF_MIN[base]);
        return [base].concat(extra);
      }
      function libKey(){
        const cfg = { s: state.symbol, t: libWanted().join(','), a: state.start, p: prefs.period };
        return JSON.stringify(cfg);
      }
      /* fetch whatever the current market, timeframes and dates need */
      async function libSync(force){
        if (state.source !== 'lib' || !LIB.sets || LIB.err) return;
        if (needsPro('realData')) { showPaywall(); return; }
        const want = libWanted();
        if (!want.length) return;
        const key = libKey();
        if (!force && key === LIB.lastKey) return;
        if (LIB.busy) return;
        LIB.lastKey = key;
        const cfg = buildCfg();
        LIB.busy = 'prices';
        renderSourceBody(); refresh();
        try{
          await libUse(state.symbol, want, cfg.startMs, cfg.endMs, step => { LIB.busy = step; renderSourceBody(); });
          LIB.busy = '';
          /* make the dates fit what this market actually has, rather than
             leaving a blocked run for the person to work out */
          const ds = datasets['lib:' + state.symbol + ':' + want[0]];
          if (ds && ds.bars.length){
            const first = ds.bars[0].t, last = ds.bars[ds.bars.length - 1].t;
            const need = (cfg.endMs || 0) - (cfg.startMs || 0);
            const have = last - first;
            const iso = ms => new Date(ms).toISOString().slice(0, 10);
            if (cfg.startMs < first || cfg.endMs > last){
              if (need > 0 && need <= have){
                state.start = iso(last - need);           /* same length, ending where the data does */
              } else {
                state.start = iso(first);
                prefs.period = 'all'; savePrefs();        /* the window was longer than the history */
                const ps = $('#fPeriod'); if (ps) ps.value = 'all';
              }
              const f = $('#fStart'); if (f) f.value = state.start;
              toast('Dates moved onto this market\u2019s history: ' + fmtDate(first, prefs.tz) + ' \u2192 ' + fmtDate(last, prefs.tz) + '.', 'ok');
            }
          }
          renderSourceBody(); refresh();
        }catch(e){
          LIB.busy = '';
          LIB.loadErr = (e && e.message) || 'could not be loaded';
          renderSourceBody(); refresh();
        }
      }
      function renderLibraryBody(host){
        if (!LIB.sets){

          return;
        }
        if (LIB.err && (LIB.tries || 0) < 2){
          /* opening this panel again is itself a retry, up to twice */
          LIB.tries = (LIB.tries || 0) + 1;
          host.innerHTML = '<div class="note" style="margin-top:10px"><span class="spin"></span> Reading the list of markets\u2026</div>';

        const syms = libSymbols();

                  const on = want.indexOf(x.tf) > 0;
                  return '<label class="dsRow' + (on ? ' on' : '') + '"><input type="checkbox" data-libtf="' + x.tf + '"' + (on ? ' checked' : '') + '>' +
                    '<span class="dsTf">' + esc(x.tf) + '</span><span class="dsMeta">' + esc(fmtDate(x.fromMs, prefs.tz)) + ' \u2192 ' +
                    esc(fmtDate(x.toMs, prefs.tz)) + '</span></label>';
                }).join('') + '</div>'
            : '') +
          (LIB.busy ? '<div class="note" style="margin-top:10px"><span class="spin"></span> Loading ' + esc(LIB.busy) + '\u2026</div>' : '') +
          (!LIB.busy && LIB.loadErr ? '<div class="note bad" style="margin-top:10px">' + esc(LIB.loadErr) +
            ' <button class="mini" id="libRetry" type="button">Try again</button></div>' : '') +
          (!LIB.busy && !LIB.loadErr && loaded.length
            ? '<div class="note" style="margin-top:10px"><strong>Ready.</strong> ' +
              loaded.sort((a2, b2) => a2.tfMin - b2.tfMin).map(d => esc(d.tf) + ' \u00b7 ' + d.bars.length.toLocaleString('en-US') + ' candles').join(' &middot; ') +
              ' &middot; ' + esc(fmtDate(loaded[0].bars[0].t, prefs.tz)) + ' \u2192 ' +

        const tfSel = $('#libTf');
        if (tfSel) tfSel.addEventListener('change', e => { state.libTf = e.target.value; state.libExtra = []; libSync(true); });

          libSync(true);

        const rt = $('#libRetry');
        if (rt) rt.addEventListener('click', () => { LIB.loadErr = ''; libSync(true); });
