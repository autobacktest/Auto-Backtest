          () => ({ c: [{ l: { t: 'atr', n: 14 }, op: 'lt', r: { t: 'atr', n: 100 } }], note: '"squeeze" read as the last 14 candles swinging less than the last 100 have, on average' })],
        [/\b(?:high|rising|expanding) volatility\b|\bvolatile\b/,
          () => ({ c: [{ l: { t: 'atr', n: 14 }, op: 'gt', r: { t: 'atr', n: 100 } }], note: '"volatile" read as the last 14 candles swinging more than the last 100 have, on average' })],
        [/\b(?:the\s+)?(?:market|trend|price)\s+is\s+(?:in an?\s+)?up ?(?:trend|wards?)\b|\buptrend\b|\btrending up\b|\btrend is up\b/,
          () => ({ c: [{ l: { t: 'close' }, op: 'gt', r: { t: 'sma', n: 200 } }], note: '"uptrend" read as the price being above its 200-period average' })],
        [/\b(?:the\s+)?(?:market|trend|price)\s+is\s+(?:in an?\s+)?down ?(?:trend|wards?)\b|\bdowntrend\b|\btrending down\b|\btrend is down\b/,
          () => ({ c: [{ l: { t: 'close' }, op: 'lt', r: { t: 'sma', n: 200 } }], note: '"downtrend" read as the price being below its 200-period average' })],
        [/\bdips?\b|\bdipped\b|\b(?:buy\s+)?the\s+dip\b|\bon a dip\b|\bpulls? back\b|\bpullback\b|\b(?:it|price|the market)\s+is\s+cheap\b|\bcheap\b/,
          () => ({ c: [{ l: { t: 'rsi', n: 14 }, op: 'lt', r: { t: 'num', v: 35 } }], note: '"dip" read as RSI(14) below 35' })],
        [/\b(?:it|price|the market)\s+is\s+expensive\b|\bexpensive\b|\boverextended\b|\bstretched\b|\btoo far\b/,
          () => ({ c: [{ l: { t: 'rsi', n: 14 }, op: 'gt', r: { t: 'num', v: 65 } }], note: '"expensive" read as RSI(14) above 65' })],
        [/\bbreaks? (?:out )?(?:above|over) yesterday'?s? high\b|\bbreaks? yesterday'?s? high\b/,
          () => ({ c: [{ l: { t: 'close' }, op: 'xup', r: { t: 'hh', n: 24 } }], note: '"yesterday\'s high" read as the highest high of the previous 24 hourly bars' })],
        [/\bbreaks? (?:below|under) yesterday'?s? low\b|\bbreaks? yesterday'?s? low\b/,
          () => ({ c: [{ l: { t: 'close' }, op: 'xdn', r: { t: 'll', n: 24 } }], note: '"yesterday\'s low" read as the lowest low of the previous 24 hourly bars' })],
        [/\bgolden cross\b/, () => ({ side: 'long', c: [{ l: { t: 'sma', n: 50 }, op: 'xup', r: { t: 'sma', n: 200 } }], note: '"golden cross" read as SMA(50) crossing above SMA(200)' })],
        [/\bdeath cross\b/, () => ({ side: 'short', c: [{ l: { t: 'sma', n: 50 }, op: 'xdn', r: { t: 'sma', n: 200 } }], note: '"death cross" read as SMA(50) crossing below SMA(200)' })],
        [/\b(?:rsi\s*(?:\(\s*\d+\s*\))?\s*(?:is|goes|gets|drops|falls|dips)?\s*)?oversold\b/, () => ({ c: [{ l: { t: 'rsi', n: 14 }, op: 'lt', r: { t: 'num', v: 30 } }], note: '"oversold" read as RSI(14) below 30' })],
        [/\b(?:rsi\s*(?:\(\s*\d+\s*\))?\s*(?:is|goes|gets|rises|climbs)?\s*)?overbought\b/, () => ({ c: [{ l: { t: 'rsi', n: 14 }, op: 'gt', r: { t: 'num', v: 70 } }], note: '"overbought" read as RSI(14) above 70' })],
        [/\blondon (?:session|hours|open)\b/, () => ({ c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 7 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 16 } }], note: '"London session" read as hours 07:00-16:00 in the timezone chosen for the run' })],
        [/\b(?:new york|ny|us) (?:session|hours|open)\b/, () => ({ c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 12 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 21 } }], note: '"New York session" read as hours 12:00-21:00 in the timezone chosen for the run' })],
        [/\b(?:asian|tokyo|asia) (?:session|hours|open)\b/, () => ({ c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 0 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 9 } }], note: '"Asian session" read as hours 00:00-09:00 in the timezone chosen for the run' })]
      ];
      const DIRECTIVES = [
        { re: /\b(?:exit|close|get out of|flatten|cover)\s+(?:the\s+|my\s+|any\s+)?(?:long|longs)\b/, g: 'exitLong' },
        { re: /\b(?:exit|close|get out of|flatten|cover)\s+(?:the\s+|my\s+|any\s+)?(?:short|shorts)\b/, g: 'exitShort' },
        { re: /\b(?:take profit|exit|close|sell out|get out|flatten|cover|stop trading)\b/, g: 'exitBoth' },
        { re: /\b(?:buy|go long|long|enter long|open a long)\b/, g: 'entryLong' },
        { re: /\b(?:sell short|short|go short|sell|enter short|open a short)\b/, g: 'entryShort' }
      ];

      const SEQ_WINDOW = 12;
      const SETTINGS_WORDS = /\b(stop|stop ?-? ?loss|take ?-? ?profit|profit target|target|risk|reward|rr|balance|timezone|time zone|capital|start(?:ing)?|deposit|account|lots?|pips?|leverage|commission|spread|slippage)\b|\$\s*\d/i;

      const NOISE = /\b(and|or|then|also|the|a|an|is|are|was|be|it|its|to|of|with|for|my|any|position|trade|order|when|if|whenever|once|on|at|after|do|use|go|enter|open|buy|sell|must|should|needs?|requires?|required|setup|evaluate|shows?|show|during|after|before|near|around|inside|then|there|we|get|see|gets?|getting|looks?|seems?|becomes?|turns?|market|long|short|close|exit|please|i|we|you|want|would|like|should|will|am|new|price|gold|silver|oil|crude|brent|natgas|wti|xau|xag|eur|usd|gbp|jpy|chf|aud|cad|nzd|cable|aussie|kiwi|loonie|swissy|fiber|eurusd|gbpusd|usdjpy|usdchf|audusd|usdcad|nzdusd|eurgbp|eurjpy|gbpjpy)\b/gi;

      function nlSplitSentences(text) {
        return String(text || '')
          .replace(/\r/g, '')
          .replace(/(\d)\.(\d)/g, '$1\u0001$2')          /* protect decimals from the sentence split */
          .split(/[\n;.]+|,\s*(?=(?:buy|sell|go |exit|close|take profit|short|long)\b)|\s+and\s+(?=(?:buy|sell|go long|go short|short it|exit|close|take profit)\b)/i)
          .map(s => s.replace(/\u0001/g, '.').trim()).filter(s => s.length > 1);
      }
      function nlParseOperand(txt) {
        for (let i = 0; i < OPERAND_WORDS.length; i++) {
          const m = txt.match(OPERAND_WORDS[i][0]);
          if (m) return { op: OPERAND_WORDS[i][1](m), rest: txt.replace(m[0], ' ').trim() };
        }
        return null;
      }
      function nlParseClause(clause, lastCmp) {
        let t = ' ' + clause.toLowerCase().replace(/[^a-z0-9%<>=.\- ]/g, ' ').replace(/\s+/g, ' ') + ' ';
        const out = [];
        for (let guard = 0; guard < 6; guard++) {
          let hit = null;
          for (let i = 0; i < FLAG_WORDS.length; i++) {
            const m = t.match(FLAG_WORDS[i][0]);
            if (!m) continue;
            const f = FLAG_WORDS[i][1](m);
            if (f.f === 'dow' && !(f.v >= 0)) continue;
            hit = { cond: f, at: m[0] };
            break;
          }
          if (!hit) break;
          out.push(hit.cond);
          t = t.replace(hit.at, ' ');
        }
        let opKey = null, opIdx = -1, opLen = 0;
        for (let i = 0; i < CMP_WORDS.length; i++) {
          const m = t.match(CMP_WORDS[i][0]);
          if (m && (opIdx < 0 || m.index < opIdx)) { opKey = CMP_WORDS[i][1]; opIdx = m.index; opLen = m[0].length; }
        }
        if (opKey != null) {
          const L = nlParseOperand(t.slice(0, opIdx)), R = nlParseOperand(t.slice(opIdx + opLen));
          if (L && R) {
            const same = L.op.t === R.op.t && (L.op.n || 0) === (R.op.n || 0) && L.op.t !== 'num';
            if (!same) out.push({ l: L.op, op: opKey, r: R.op });
          }
          else if (!L && !R && lastCmp && !out.length)
            return { conds: [{ l: JSON.parse(JSON.stringify(lastCmp.l)), op: opKey, r: JSON.parse(JSON.stringify(lastCmp.r)) }], reused: true };
        }
        return out.length ? { conds: out } : null;
      }
      function nlParse(text) {
        const notes = [], ignored = [], parsed = [], misses = [];
        const miss = (txt, g) => {
          const t = String(txt).trim();
          const why = (typeof refusalFor === 'function') ? refusalFor(t) : null;
          ignored.push(why ? t + ' — ' + why : t);
          misses.push({ text: t, group: g, why: why, suggestions: suggestFor(t) });
        };
        const rules = {
          name: '', entryLong: { mode: 'all', c: [] }, entryShort: { mode: 'all', c: [] },
          exitLong: { mode: 'any', c: [] }, exitShort: { mode: 'any', c: [] }
        };
        const unsidedOnly = { exitLong: null, exitShort: null };   /* true while a group holds only unsided exits */
        const add = (g, conds) => { conds.forEach(c => rules[g].c.push(JSON.parse(JSON.stringify(c)))); };
        const sentences = nlSplitSentences(text);
        if (!sentences.length) return { rules: rules, parsed: parsed, ignored: ignored, notes: notes, empty: true };

        let lastCmp = null;
        sentences.forEach(sentence => {
          const low = ' ' + sentence.toLowerCase() + ' ';
          /* which side does this sentence talk about? */
          let dir = null, cut = 0, at = -1;
          for (let i = 0; i < DIRECTIVES.length; i++) {
            const m = low.match(DIRECTIVES[i].re);
            if (m && (dir === null || m.index < at)) { dir = DIRECTIVES[i].g; at = m.index; cut = m.index + m[0].length; }
          }
          let body = sentence;
          if (dir) body = sentence.slice(Math.max(0, cut - 1));
          body = body.replace(/^\s*(?:when|if|whenever|once|on|at|after)\b/i, ' ').trim();
          let sideGuess = null;
          if (!dir) { dir = 'entryLong'; sideGuess = '"' + sentence.trim() + '" did not say buy or sell, so it was read as a long entry.'; }

          /* whole-phrase shorthands first */
          let handled = false;
          SHORTHANDS.forEach(sh => {
            const m = body.toLowerCase().match(sh[0]);
            if (!m) return;
            const r = sh[1]();
            const target = r.side === 'long' ? 'entryLong' : r.side === 'short' ? 'entryShort' : dir;
            const targets = target === 'exitBoth' ? ['exitLong', 'exitShort'] : [target];
            targets.forEach(g => add(g, r.c));
            r.c.forEach(c => { if (!c.f) lastCmp = c; });
            notes.push(r.note);
            parsed.push(r.note);
            body = body.replace(new RegExp(m[0], 'i'), ' ').trim();
            handled = true;
          });
          const leftover = body.replace(NOISE, '').replace(/[^a-z0-9]/gi, '');
          if (handled && leftover.length < 3) return;
          if (!body || leftover.length < 3) {
            if (!handled && !SETTINGS_WORDS.test(sentence)) miss(sentence, dir === 'exitBoth' ? 'exitLong' : dir);
            return;
          }

          /* split into clauses and work out ALL vs ANY */
          const hasOr = /\bor\b/i.test(body), hasAnd = /\band\b/i.test(body);
          const seq = /\bthen\b|\bafter (?:that|which)\b|\bfollowed by\b/i.test(body);
          const clauses = body.split(/\b(?:and|or|with|while|plus|then|followed by)\b|,/i).map(s => s.trim()).filter(s => s.replace(/[^a-z0-9]/gi, '').length > 1);
          const got = [];
          clauses.forEach(cl => {
            if (typeof refusalFor === 'function' && refusalFor(cl)) { miss(cl, dir === 'exitBoth' ? 'exitLong' : dir); return; }
            const p = nlParseClause(cl, lastCmp);
            if (p) {
              p.conds.forEach(c => { got.push(c); if (!c.f) lastCmp = c; });
              if (p.reused) notes.push('"' + cl.trim() + '" was read as the same comparison as the rule before it, with the direction reversed.');
              return;
            }
            if (cl.replace(NOISE, '').replace(/[^a-z0-9]/gi, '').length < 3) return;   /* filler, not a rule */
            if (SETTINGS_WORDS.test(cl)) return;   /* money and risk settings are read separately */
            miss(cl, dir === 'exitBoth' ? 'exitLong' : dir);
          });
          if (!got.length) return;
          if (seq && got.length > 1) {
            const lastIdx = got.length - 1;
            got.forEach((c, ix) => { if (ix < lastIdx) c.within = SEQ_WINDOW; });
            notes.push('Your description is a sequence, so every step before the last one is checked as "at some point in the last ' + SEQ_WINDOW + ' bars", and the last step is what triggers the trade.');
          }
          if (sideGuess) notes.push(sideGuess);
          const targets = dir === 'exitBoth' ? ['exitLong', 'exitShort'] : [dir];
          targets.forEach(g => {
            if (g === 'exitLong' || g === 'exitShort') {
              if (dir === 'exitBoth') { if (unsidedOnly[g] === null) unsidedOnly[g] = true; }
              else unsidedOnly[g] = false;
            }
            add(g, got);
            if (hasOr && !hasAnd) rules[g].mode = 'any';
            else if (hasAnd && g.indexOf('entry') === 0) rules[g].mode = 'all';
          });
          if (dir === 'exitBoth' && got.length) notes.push('An exit that did not name a side was applied, as written, to whichever side your description trades.');
          got.forEach(c => parsed.push((dir === 'entryLong' ? 'BUY when ' : dir === 'entryShort' ? 'SELL when ' : dir === 'exitBoth' ? 'EXIT when ' : dir === 'exitLong' ? 'EXIT LONG when ' : 'EXIT SHORT when ') + (isFlag(c) ? flagText(c) : condText(c))));
        });

        /* an exit for a side that never trades is noise, not a rule */
        [['entryLong', 'exitLong', 'long'], ['entryShort', 'exitShort', 'short']].forEach(([e, x, word]) => {
          if (!rules[e].c.length && rules[x].c.length && unsidedOnly[x] === true) {
            rules[x] = { mode: rules[x].mode, c: [] };
            notes.push('The exit rule was dropped for ' + word + 's, because nothing in the description ever opens a ' + word + ' trade.');
          }
        });

        /* exit-only tests cannot be entry rules */
        ['entryLong', 'entryShort'].forEach(g => {
          const keep = [];
          rules[g].c.forEach(c => {
            if (isFlag(c) && FLAGS[c.f] && FLAGS[c.f].exitOnly) {
              miss(flagText(c) + ' — that describes an open trade, so it can only be an exit rule', g === 'entryLong' ? 'exitLong' : 'exitShort');
            } else keep.push(c);
          });
          rules[g].c = keep;
        });
        ['entryLong', 'entryShort', 'exitLong', 'exitShort'].forEach(g => {     /* drop repeats */
          const seen = {};
          rules[g].c = rules[g].c.filter(c => {
            const bare = Object.assign({}, c); delete bare.within;      /* same idea twice is still once */
            const k = JSON.stringify(bare);
            if (seen[k]) return false;
            seen[k] = 1; return true;
          });
        });
        const nAll = ['entryLong', 'entryShort', 'exitLong', 'exitShort'].reduce((a, g) => a + rules[g].c.length, 0);
        const uniq = a => a.filter((v, i) => a.indexOf(v) === i);
        return {
          rules: rules, parsed: uniq(parsed), ignored: uniq(ignored), notes: uniq(notes),
          misses: misses, empty: nAll === 0
        };
      }

      /* validate anything that arrives from outside (the parser, or Claude) so a
         malformed rule can never reach the engine */
      function sanitizeRules(raw) {
        const issues = [];
        const out = {
          name: typeof raw.name === 'string' ? raw.name.slice(0, 48) : 'Custom strategy',
          entryLong: { mode: 'all', c: [] }, entryShort: { mode: 'all', c: [] },
          exitLong: { mode: 'any', c: [] }, exitShort: { mode: 'any', c: [] }
        };
        ['entryLong', 'entryShort', 'exitLong', 'exitShort'].forEach(g => {
          const src = raw[g];
          if (!src || !Array.isArray(src.c)) return;
          out[g].mode = src.mode === 'any' ? 'any' : 'all';
          src.c.forEach(c => {
            if (c && c.f) {
              const S = FLAGS[c.f];
              if (!S) { issues.push('Unknown event "' + c.f + '" was dropped.'); return; }
              if (S.exitOnly && g.indexOf('entry') === 0) { issues.push(flagText(c) + ' can only be an exit rule; it was dropped from the entry rules.'); return; }
              const n = { f: c.f };
              if (S.period) n.n = Math.max(1, Math.min(2000, Math.round(+c.n || S.def)));
              if (S.value) n.v = isFinite(+c.v) ? +c.v : S.def;
              if (c.within) n.within = Math.max(1, Math.min(500, Math.round(+c.within)));
              out[g].c.push(n); return;
            }
            if (!c || !c.l || !c.r || !COND_OPS[c.op]) { issues.push('A rule was not in a readable form and was dropped.'); return; }
            const side = o => {
              const S = OPERANDS[o && o.t];
              if (!S) return null;
              const n = { t: o.t };
              if (S.period) n.n = Math.max(1, Math.min(2000, Math.round(+o.n || S.def)));
              if (S.value) n.v = isFinite(+o.v) ? +o.v : S.def;
              return n;
            };
            const l = side(c.l), r = side(c.r);
            if (!l || !r) { issues.push('A rule referred to something that does not exist and was dropped.'); return; }
            const cmp = { l: l, op: c.op, r: r };
            if (c.within) cmp.within = Math.max(1, Math.min(500, Math.round(+c.within)));
            out[g].c.push(cmp);
          });
        });
        return { rules: out, issues: issues };
      }

      /* ------------------------------------------- settings written in words */
      /* Traders describe the whole plan in one breath: "risk 1% with a 2% stop
         and a 4% target on gold, starting with $5,000". Those are settings, not
         rules, so they are pulled out here and every change is reported. */
      const MARKET_WORDS = [
        [/\bgold\b|\bxau\b|\bxau\s*\/?\s*usd\b/, 'XAUUSD'],
        [/\bsilver\b|\bxag\b/, 'XAGUSD'],
        [/\bnatural gas\b|\bnat ?gas\b|\bgas\b/, 'NATGAS'],
        [/\bbrent\b/, 'BRENT'],
        [/\b(?:crude|wti|oil)\b/, 'WTI'],
        [/\beur\s*\/?\s*usd\b|\beurusd\b|\beuro dollar\b|\bfiber\b/, 'EURUSD'],
        [/\bgbp\s*\/?\s*usd\b|\bgbpusd\b|\bcable\b|\bpound dollar\b/, 'GBPUSD'],
        [/\busd\s*\/?\s*jpy\b|\busdjpy\b|\bdollar yen\b/, 'USDJPY'],
        [/\busd\s*\/?\s*chf\b|\busdchf\b|\bswissy\b/, 'USDCHF'],
        [/\baud\s*\/?\s*usd\b|\baudusd\b|\baussie\b/, 'AUDUSD'],
        [/\busd\s*\/?\s*cad\b|\busdcad\b|\bloonie\b/, 'USDCAD'],
        [/\bnzd\s*\/?\s*usd\b|\bnzdusd\b|\bkiwi\b/, 'NZDUSD'],
        [/\beur\s*\/?\s*gbp\b|\beurgbp\b/, 'EURGBP'],
        [/\beur\s*\/?\s*jpy\b|\beurjpy\b/, 'EURJPY'],
        [/\bgbp\s*\/?\s*jpy\b|\bgbpjpy\b/, 'GBPJPY']
      ];
      function nlSettings(text) {
        const t = ' ' + String(text || '').toLowerCase().replace(/\s+/g, ' ') + ' ';
        const set = {}, notes = [], unsupported = [];
        const num = m => m ? parseFloat(String(m).replace(/,/g, '')) : NaN;
        let m;

        if ((m = t.match(/stop\s*-?\s*loss(?:\s*(?:of|at|is))?\s*\$?(\d+(?:\.\d+)?)\s*%/)) ||
          (m = t.match(/(\d+(?:\.\d+)?)\s*%\s*stop(?:\s*-?\s*loss)?/)) ||
          (m = t.match(/(?:cut|exit|get out)\s*(?:the\s*(?:trade|loss))?\s*(?:at|if(?:\s*i'?m)?\s*down)\s*(\d+(?:\.\d+)?)\s*%/))) {
          set.slType = 'pct'; set.slPct = num(m[1]);
          notes.push('Stop loss set to ' + set.slPct + '% below entry.');
        } else if (t.match(/stop\s*-?\s*loss\s*(?:of|at)?\s*\d+\s*pips?/)) {
          unsupported.push('a stop loss in pips — use a percentage or an ATR stop in the settings below');
        } else if (t.match(/\btrailing stop\b/)) {
          unsupported.push('a trailing stop');
        }

        if ((m = t.match(/(?:take\s*-?\s*profit|target|profit target)(?:\s*(?:of|at|is))?\s*\$?(\d+(?:\.\d+)?)\s*%/)) ||
          (m = t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:take\s*-?\s*profit|target|profit)/))) {
          set.tpType = 'pct'; set.tpPct = num(m[1]);
          notes.push('Take profit set to ' + set.tpPct + '% above entry.');
        } else if ((m = t.match(/(?:risk\s*(?:to|[:\/])\s*reward|reward\s*(?:to|[:\/])\s*risk|r\s*[:\/]\s*r)\s*(?:ratio\s*)?(?:of\s*)?1\s*[:to\/ ]+\s*(\d+(?:\.\d+)?)/)) ||
          (m = t.match(/\b1\s*(?:[:\/]|to)\s*(\d+(?:\.\d+)?)\s*(?:risk[ -]?reward|rr|r\b)/)) ||
          (m = t.match(/\b(\d+(?:\.\d+)?)\s*r\s*target\b/))) {
          set.tpType = 'rr'; set.tpRR = num(m[1]);
          notes.push('Take profit set to ' + set.tpRR + ' times the stop distance.');
        }

        if ((m = t.match(/risk(?:ing)?\s*(?:only\s*)?(\d+(?:\.\d+)?)\s*%/))) {
          set.sizeMode = 'riskPct'; set.riskPct = num(m[1]);
          notes.push('Position size set to risk ' + set.riskPct + '% of the account per trade.');
        } else if ((m = t.match(/risk(?:ing)?\s*\$\s*([\d,]+(?:\.\d+)?)\s*(?:per trade|a trade|each trade)?/))) {
          set.sizeMode = 'riskFixed'; set.riskFixed = num(m[1]);
          notes.push('Position size set to risk $' + set.riskFixed + ' per trade.');
        }
        if (t.match(/\b\d+(?:\.\d+)?\s*lots?\b/)) unsupported.push('a fixed lot size — size is set in the settings below, by risk or by notional');

        if ((m = t.match(/(?:start(?:ing)?|begin|open)\s*(?:with|balance(?:\s*of)?|account(?:\s*of)?|capital(?:\s*of)?)?\s*\$\s*([\d,]+(?:\.\d+)?)\s*(?:k\b)?/)) ||
          (m = t.match(/\$\s*([\d,]+(?:\.\d+)?)\s*(?:k\s*)?(?:account|balance|capital|starting)/))) {
          let v = num(m[1]);
          if (/\bk\b/.test(m[0]) && v < 1000) v *= 1000;
          if (v > 0) { set.balance = v; notes.push('Starting balance set to $' + v.toLocaleString('en-US') + '.'); }
        }

        let tz = null;
        const TZ_WORDS = [
          [/\bnew york time\b|\bny time\b|\best\b|\bedt\b|\beastern time\b|\bict (?:time|hours)\b/, 'America/New_York'],
          [/\blondon time\b|\buk time\b|\bbst\b|\bgmt\b/, 'Europe/London'],
          [/\btokyo time\b|\bjst\b|\bjapan time\b/, 'Asia/Tokyo'],
          [/\bsydney time\b|\baest\b|\baedt\b/, 'Australia/Sydney'],
          [/\bzurich time\b|\bcet\b|\bcest\b|\bbroker time\b|\bserver time\b/, 'Europe/Zurich'],
          [/\butc\b/, 'UTC']
        ];
        for (let i = 0; i < TZ_WORDS.length; i++) {
          if (TZ_WORDS[i][0].test(t)) {
            tz = TZ_WORDS[i][1];
            notes.push('All times read in ' + tz.replace('_', ' ') + ', because your description said so.');
            break;
          }
        }

        let symbol = null;
        for (let i = 0; i < MARKET_WORDS.length; i++) {
          if (MARKET_WORDS[i][0].test(t)) { symbol = MARKET_WORDS[i][1]; break; }
        }
        if (/\b(?:news|nfp|non ?farm|earnings|sentiment|twitter|fundamental)\b/.test(t)) unsupported.push('a news or fundamentals filter');
        if (/\b(?:add to|pyramid|scale in|average down|martingale)\b/.test(t)) unsupported.push('adding to a position');
        if (/\b(?:multiple|several|all) (?:pairs|markets|instruments)\b/.test(t)) unsupported.push('trading several markets at once — run them one at a time');
        return { set: set, symbol: symbol, tz: tz, notes: notes, unsupported: unsupported };
      }

      /* ------------------------------------- "I don't know that — did you mean" */
      /* Every miss gets the closest things this engine can actually test, so an
         unknown phrase turns into a choice instead of a dead end. */
      const CANNED = [
        { label: 'the price is above its 200-period average', cond: { l: { t: 'close' }, op: 'gt', r: { t: 'sma', n: 200 } } },
        { label: 'the price is below its 200-period average', cond: { l: { t: 'close' }, op: 'lt', r: { t: 'sma', n: 200 } } },
        { label: 'a fast average crosses above a slow one', cond: { l: { t: 'sma', n: 20 }, op: 'xup', r: { t: 'sma', n: 50 } } },
        { label: 'a fast average crosses below a slow one', cond: { l: { t: 'sma', n: 20 }, op: 'xdn', r: { t: 'sma', n: 50 } } },
        { label: 'RSI(14) is below 30 (oversold)', cond: { l: { t: 'rsi', n: 14 }, op: 'lt', r: { t: 'num', v: 30 } } },
        { label: 'RSI(14) is above 70 (overbought)', cond: { l: { t: 'rsi', n: 14 }, op: 'gt', r: { t: 'num', v: 70 } } },
        { label: 'the MACD line crosses above its signal line', cond: { l: { t: 'macd' }, op: 'xup', r: { t: 'macds' } } },
        { label: 'the MACD line crosses below its signal line', cond: { l: { t: 'macd' }, op: 'xdn', r: { t: 'macds' } } },
        { label: 'ADX(14) is above 25 (a strong trend)', cond: { l: { t: 'adx', n: 14 }, op: 'gt', r: { t: 'num', v: 25 } } },
        { label: 'the close is above the 24-bar VWAP', cond: { l: { t: 'close' }, op: 'gt', r: { t: 'vwap', n: 24 } } },
        { label: 'the close is below the 24-bar VWAP', cond: { l: { t: 'close' }, op: 'lt', r: { t: 'vwap', n: 24 } } },
        { label: 'the close crosses above the highest high of the previous 20 bars', cond: { l: { t: 'close' }, op: 'xup', r: { t: 'hh', n: 20 } } },
        { label: 'the close crosses below the lowest low of the previous 20 bars', cond: { l: { t: 'close' }, op: 'xdn', r: { t: 'll', n: 20 } } },
        { label: "the price is above yesterday's high", cond: { l: { t: 'close' }, op: 'gt', r: { t: 'pdh' } } },
        { label: "the price is below yesterday's low", cond: { l: { t: 'close' }, op: 'lt', r: { t: 'pdl' } } },
        { label: 'the close is above the upper Bollinger band', cond: { l: { t: 'close' }, op: 'xup', r: { t: 'bbu', n: 20 } } },
        { label: 'the close is below the lower Bollinger band', cond: { l: { t: 'close' }, op: 'xdn', r: { t: 'bbl', n: 20 } } },
        { label: 'Stochastic %K is below 20', cond: { l: { t: 'stok', n: 14 }, op: 'lt', r: { t: 'num', v: 20 } } },
        { label: 'Stochastic %K is above 80', cond: { l: { t: 'stok', n: 14 }, op: 'gt', r: { t: 'num', v: 80 } } },
        { label: 'the price has moved more than 0.5% over the last 24 bars', cond: { l: { t: 'chg', n: 24 }, op: 'gt', r: { t: 'num', v: 0.5 } } },
        { label: 'price is swinging more than it usually does', cond: { l: { t: 'atr', n: 14 }, op: 'gt', r: { t: 'atr', n: 100 } } }
      ];
      const STEM = w => w.replace(/(ing|ed|es|s)$/, '');
      function tokens(txt) {
        return String(txt || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
          .filter(w => w.length > 2 && !/^(the|and|when|with|that|this|from|into|your|you|are|was|for|its|but|not|buy|sell|long|short|exit|close|price|market|trade)$/.test(w))
          .map(STEM);
      }
      function suggestFor(text) {
        const want = tokens(text);
        if (!want.length) return [];
        const pool = [];
        Object.keys(FLAGS).forEach(f => {
          const S = FLAGS[f], c = { f: f };
          if (S.period) c.n = S.def;
          if (S.value) c.v = S.def;
          pool.push({ label: flagText(c), cond: c, words: tokens(S.label + ' ' + f) });
        });
        CANNED.forEach(x => pool.push({ label: x.label, cond: x.cond, words: tokens(x.label) }));
        const scored = pool.map(p => {
          let hit = 0;
          want.forEach(w => { if (p.words.some(v => v === w || (w.length > 4 && v.indexOf(w) >= 0) || (v.length > 4 && w.indexOf(v) >= 0))) hit++; });
          return { s: hit, label: p.label, cond: p.cond };
        }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
        const out = [], seen = {};
        scored.forEach(x => { if (out.length < 3 && !seen[x.label]) { seen[x.label] = 1; out.push({ label: x.label, cond: x.cond }); } });
        return out;
      }
      /* the whole vocabulary, for the "everything it can test" list */
      function vocabulary() {
        return {
          indicators: Object.keys(OPERANDS).filter(t => t !== 'num').map(t => OPERANDS[t].label),
          events: Object.keys(FLAGS).map(f => {
            const S = FLAGS[f], c = { f: f };
            if (S.period) c.n = S.def;
            if (S.value) c.v = S.def;
            return flagText(c) + (S.exitOnly ? ' (exit rules only)' : '');
          }),
          comparisons: Object.keys(COND_OPS).map(k => COND_OPS[k].label)
        };
      }

      /* =======================================================================
         4d. Market structure, ICT / SMC concepts, price action and order flow.
      
         Every detector below is point-in-time: at bar i it may only look at bars
         up to i. A swing point needs bars after it to be a swing at all, so it is
         only treated as known k bars later — that delay is deliberate, and the
         test suite checks it. Each concept carries the exact definition used,
         which is what the app shows you, because these terms are used loosely and
         a backtest has to pick one meaning and stick to it.
         ===================================================================== */

      const SMC_MEMO = new WeakMap();
      let SWING_K = 3;                    /* bars either side of a swing point; a description can set it */
      function setSwingK(k) { if (k >= 1 && k <= 20) SWING_K = k | 0; }
      function smcOf(bars, tz, k) {
        let byTz = SMC_MEMO.get(bars);
        if (!byTz) { byTz = {}; SMC_MEMO.set(bars, byTz); }
        const kk = k || SWING_K;
        const key = (tz || 'UTC') + '|' + kk;
        if (!byTz[key]) byTz[key] = buildStructure(bars, tz || 'UTC', kk);
        return byTz[key];
      }

      /* ---------------------------------------------------- swings and structure */
      function buildStructure(bars, tz, K) {
        const n = bars.length, k = K || SWING_K;
        const atr = atrWilder(bars, 14);

        /* a pivot at j is only CONFIRMED at j+k */
        const pivotHi = new Array(n).fill(false), pivotLo = new Array(n).fill(false);
        /* strictly higher than the bars before it, and at least as high as the bars
           after it — so a flat top still counts as a swing, which matters on data
           rounded to a few decimals where neighbouring highs can tie */
        for (let j = k; j < n - k; j++) {
          let hi = true, lo = true;
          for (let m = j - k; m < j; m++) {
            if (bars[m].h >= bars[j].h) hi = false;
            if (bars[m].l <= bars[j].l) lo = false;
          }
          for (let m = j + 1; m <= j + k; m++) {
            if (bars[m].h > bars[j].h) hi = false;
            if (bars[m].l < bars[j].l) lo = false;
          }
          pivotHi[j] = hi; pivotLo[j] = lo;
        }
        const lastHi = new Array(n).fill(NaN), lastLo = new Array(n).fill(NaN);
        const lastHiIdx = new Array(n).fill(-1), lastLoIdx = new Array(n).fill(-1);
        const prevHi = new Array(n).fill(NaN), prevLo = new Array(n).fill(NaN);
        let cH = NaN, cHi = -1, pH = NaN, cL = NaN, cLi = -1, pL = NaN;
        for (let i = 0; i < n; i++) {
          const j = i - k;                                   /* newly confirmed pivot */
          if (j >= 0 && pivotHi[j]) { pH = cH; cH = bars[j].h; cHi = j; }
          if (j >= 0 && pivotLo[j]) { pL = cL; cL = bars[j].l; cLi = j; }
          lastHi[i] = cH; lastHiIdx[i] = cHi; prevHi[i] = pH;
          lastLo[i] = cL; lastLoIdx[i] = cLi; prevLo[i] = pL;
        }

        /* break of structure and change of character */
        const bosUp = new Array(n).fill(false), bosDn = new Array(n).fill(false);
        const chochUp = new Array(n).fill(false), chochDn = new Array(n).fill(false);
        const trend = new Array(n).fill(0);
        let dir = 0, refHi = NaN, refLo = NaN;
        for (let i = 1; i < n; i++) {
          refHi = lastHi[i - 1]; refLo = lastLo[i - 1];
          const c = bars[i].c;
          if (isFinite(refHi) && c > refHi && !(bars[i - 1].c > refHi)) {
            bosUp[i] = true;
            if (dir === -1) chochUp[i] = true;
            dir = 1;
          } else if (isFinite(refLo) && c < refLo && !(bars[i - 1].c < refLo)) {
            bosDn[i] = true;
            if (dir === 1) chochDn[i] = true;
            dir = -1;
          }
          trend[i] = dir;
        }

        /* equal highs and lows: two consecutive swing points within 10% of ATR */
        const eqHi = new Array(n).fill(false), eqLo = new Array(n).fill(false);
        for (let i = 0; i < n; i++) {
          const tol = isFinite(atr[i]) ? atr[i] * 0.1 : 0;
          if (tol > 0 && isFinite(lastHi[i]) && isFinite(prevHi[i]) && Math.abs(lastHi[i] - prevHi[i]) <= tol
            && lastHiIdx[i] === i - k) eqHi[i] = true;
          if (tol > 0 && isFinite(lastLo[i]) && isFinite(prevLo[i]) && Math.abs(lastLo[i] - prevLo[i]) <= tol
            && lastLoIdx[i] === i - k) eqLo[i] = true;
        }

        /* displacement: an unusually large committed body */
        const disp = new Array(n).fill(0);
        for (let i = 0; i < n; i++) {
          const body = Math.abs(bars[i].c - bars[i].o), rg = bars[i].h - bars[i].l;
          if (isFinite(atr[i]) && atr[i] > 0 && body > 1.5 * atr[i] && rg > 0 && body >= 0.5 * rg)
            disp[i] = bars[i].c > bars[i].o ? 1 : -1;
        }

        /* fair value gaps (three-bar imbalance), tracked until they are filled */
        const fvgNew = new Array(n).fill(0);          /* +1 bullish, -1 bearish, this bar */
        const inFvgUp = new Array(n).fill(false), inFvgDn = new Array(n).fill(false);
        const fvgUpMid = new Array(n).fill(NaN), fvgDnMid = new Array(n).fill(NaN);
        let upZones = [], dnZones = [];
        for (let i = 0; i < n; i++) {
          if (i >= 2) {
            if (bars[i].l > bars[i - 2].h) { upZones.push({ lo: bars[i - 2].h, hi: bars[i].l, at: i }); fvgNew[i] = 1; }
            if (bars[i].h < bars[i - 2].l) { dnZones.push({ lo: bars[i].h, hi: bars[i - 2].l, at: i }); fvgNew[i] = -1; }
          }
          /* a gap is spent once price has closed through the far side of it */
          upZones = upZones.filter(z => bars[i].c >= z.lo);
          dnZones = dnZones.filter(z => bars[i].c <= z.hi);
          const uz = upZones.length ? upZones[upZones.length - 1] : null;
          const dz = dnZones.length ? dnZones[dnZones.length - 1] : null;
          if (uz && uz.at < i) { inFvgUp[i] = bars[i].l <= uz.hi && bars[i].h >= uz.lo; fvgUpMid[i] = (uz.lo + uz.hi) / 2; }
          if (dz && dz.at < i) { inFvgDn[i] = bars[i].h >= dz.lo && bars[i].l <= dz.hi; fvgDnMid[i] = (dz.lo + dz.hi) / 2; }
        }

        /* order blocks: the last opposing candle before the move that broke structure */
        const obUp = new Array(n).fill(false), obDn = new Array(n).fill(false);
        let obUpZone = null, obDnZone = null;
        for (let i = 0; i < n; i++) {
          if (bosUp[i]) {
            for (let j = i; j > Math.max(0, i - 20); j--) {
              if (bars[j].c < bars[j].o) { obUpZone = { lo: bars[j].l, hi: bars[j].h, at: i }; break; }
            }
          }
          if (bosDn[i]) {
            for (let j = i; j > Math.max(0, i - 20); j--) {
              if (bars[j].c > bars[j].o) { obDnZone = { lo: bars[j].l, hi: bars[j].h, at: i }; break; }
            }
          }
          if (obUpZone) {
            if (bars[i].c < obUpZone.lo) obUpZone = null;                       /* invalidated */
            else if (i > obUpZone.at) obUp[i] = bars[i].l <= obUpZone.hi;        /* price tapped it */
          }
          if (obDnZone) {
            if (bars[i].c > obDnZone.hi) obDnZone = null;
            else if (i > obDnZone.at) obDn[i] = bars[i].h >= obDnZone.lo;
          }
        }

        /* sessions, in the timezone chosen for the run */
        const hour = bars.map(b => hourOf(b.t, tz));
        const dkey = bars.map(b => dayKey(b.t, tz));
        const dayOpen = new Array(n).fill(NaN);
        const asiaHi = new Array(n).fill(NaN), asiaLo = new Array(n).fill(NaN);
        const sessHi = new Array(n).fill(NaN), sessLo = new Array(n).fill(NaN);
        let curDay = null, dOpen = NaN, aH = -Infinity, aL = Infinity, aHdone = NaN, aLdone = NaN, sH = -Infinity, sL = Infinity;
        for (let i = 0; i < n; i++) {
          if (dkey[i] !== curDay) {
            curDay = dkey[i]; dOpen = bars[i].o;
            aH = -Infinity; aL = Infinity; aHdone = NaN; aLdone = NaN; sH = -Infinity; sL = Infinity;
          }
          if (hour[i] < 7) { if (bars[i].h > aH) aH = bars[i].h; if (bars[i].l < aL) aL = bars[i].l; aHdone = aH; aLdone = aL; }
          if (bars[i].h > sH) sH = bars[i].h;
          if (bars[i].l < sL) sL = bars[i].l;
          dayOpen[i] = dOpen;
          asiaHi[i] = isFinite(aHdone) ? aHdone : NaN; asiaLo[i] = isFinite(aLdone) ? aLdone : NaN;
          sessHi[i] = sH; sessLo[i] = sL;
        }

        /* previous week's high, low and open */
        const wkey = bars.map(b => {
          const p = tzParts(b.t, tz);
          const d = new Date(Date.UTC(p.y, p.mo - 1, p.d));
          const day = d.getUTCDay();
          d.setUTCDate(d.getUTCDate() - ((day + 6) % 7));
          return d.toISOString().slice(0, 10);
        });
        const pwh = new Array(n).fill(NaN), pwl = new Array(n).fill(NaN), pwo = new Array(n).fill(NaN);
        let curWk = null, wH = -Infinity, wL = Infinity, wO = NaN, prevW = null;
        for (let i = 0; i < n; i++) {
          if (wkey[i] !== curWk) {
            if (curWk !== null) prevW = { h: wH, l: wL, o: wO };
            curWk = wkey[i]; wH = -Infinity; wL = Infinity; wO = bars[i].o;
          }
          if (prevW) { pwh[i] = prevW.h; pwl[i] = prevW.l; pwo[i] = prevW.o; }
          if (bars[i].h > wH) wH = bars[i].h;
          if (bars[i].l < wL) wL = bars[i].l;
        }

        return {
          k: k, atr: atr, lastHi: lastHi, lastLo: lastLo, prevHi: prevHi, prevLo: prevLo,
          bosUp: bosUp, bosDn: bosDn, chochUp: chochUp, chochDn: chochDn, trend: trend,
          eqHi: eqHi, eqLo: eqLo, disp: disp,
          fvgNew: fvgNew, inFvgUp: inFvgUp, inFvgDn: inFvgDn, fvgUpMid: fvgUpMid, fvgDnMid: fvgDnMid,
          obUp: obUp, obDn: obDn,
          dayOpen: dayOpen, asiaHi: asiaHi, asiaLo: asiaLo, sessHi: sessHi, sessLo: sessLo,
          pwh: pwh, pwl: pwl, pwo: pwo, hour: hour
        };
      }

      /* ------------------------------------------------ numeric series they add */
      function rangePos(bars, n) {
        const out = new Array(bars.length).fill(NaN);
        for (let i = n - 1; i < bars.length; i++) {
          let hi = -Infinity, lo = Infinity;
          for (let j = i - n + 1; j <= i; j++) { if (bars[j].h > hi) hi = bars[j].h; if (bars[j].l < lo) lo = bars[j].l; }
          out[i] = hi > lo ? (bars[i].c - lo) / (hi - lo) * 100 : 50;
        }
        return out;
      }
      function barDelta(bars) {                 /* an ESTIMATE from bar shape, not tape */
        return bars.map(b => {
          const rg = b.h - b.l;
          if (!(rg > 0)) return 0;
          return (b.v || 0) * ((2 * (b.c - b.l) / rg) - 1);
        });
      }
      function cumDelta(bars, n) {
        const d = barDelta(bars), out = new Array(bars.length).fill(NaN);
        for (let i = n - 1; i < bars.length; i++) { let s = 0; for (let j = i - n + 1; j <= i; j++) s += d[j]; out[i] = s; }
        return out;
      }
      function pocOf(bars, n) {                  /* volume point of control, 24 price bins */
        const out = new Array(bars.length).fill(NaN), BINS = 24;
        for (let i = n - 1; i < bars.length; i++) {
          let hi = -Infinity, lo = Infinity;
          for (let j = i - n + 1; j <= i; j++) { if (bars[j].h > hi) hi = bars[j].h; if (bars[j].l < lo) lo = bars[j].l; }
          if (!(hi > lo)) continue;
          const w = (hi - lo) / BINS, acc = new Array(BINS).fill(0);
          for (let j = i - n + 1; j <= i; j++) {
            const a = Math.max(0, Math.min(BINS - 1, Math.floor((bars[j].l - lo) / w)));
            const b = Math.max(0, Math.min(BINS - 1, Math.floor((bars[j].h - lo) / w)));
            const share = (bars[j].v || 1) / (b - a + 1);
            for (let q = a; q <= b; q++) acc[q] += share;
          }
          let best = 0;
          for (let q = 1; q < BINS; q++) if (acc[q] > acc[best]) best = q;
          out[i] = lo + w * (best + 0.5);
        }
        return out;
      }

      /* ------------------------------------------------------- register the lot */
      Object.assign(OPERANDS, {
        swingHi: { label: 'the last swing high', kind: 'price', warm: () => 40 },
        swingLo: { label: 'the last swing low', kind: 'price', warm: () => 40 },
        prevSwingHi: { label: 'the swing high before the last one', kind: 'price', warm: () => 60 },
        prevSwingLo: { label: 'the swing low before the last one', kind: 'price', warm: () => 60 },
        rangePos: { label: 'position in the last N-bar range (0 = the low, 100 = the high)', period: 1, def: 20, kind: 'osc', warm: n => n + 2 },
        poc: { label: 'volume point of control over N bars', period: 1, def: 60, kind: 'price', warm: n => n + 2 },
        delta: { label: 'estimated bar delta (from bar shape, not tape)', kind: 'vol', warm: () => 3 },
        cvd: { label: 'estimated cumulative delta (from bar shape, not tape)', period: 1, def: 24, kind: 'vol', warm: n => n + 2 },
        dayOpen: { label: "today's open", kind: 'price', warm: () => 30 },
        asiaHi: { label: 'the Asian session high', kind: 'price', warm: () => 30 },
        asiaLo: { label: 'the Asian session low', kind: 'price', warm: () => 30 },
        sessHi: { label: "today's high so far", kind: 'price', warm: () => 30 },
        sessLo: { label: "today's low so far", kind: 'price', warm: () => 30 },
        pwh: { label: "last week's high", kind: 'price', warm: () => 200 },
        pwl: { label: "last week's low", kind: 'price', warm: () => 200 },
        pwo: { label: "last week's open", kind: 'price', warm: () => 200 },
        fvgUpMid: { label: 'the midpoint of the open bullish fair value gap', kind: 'price', warm: () => 20 },
        fvgDnMid: { label: 'the midpoint of the open bearish fair value gap', kind: 'price', warm: () => 20 }
      });
      const SMC_SERIES = {
        swingHi: s => s.lastHi, swingLo: s => s.lastLo, prevSwingHi: s => s.prevHi, prevSwingLo: s => s.prevLo, dayOpen: s => s.dayOpen,
        asiaHi: s => s.asiaHi, asiaLo: s => s.asiaLo, sessHi: s => s.sessHi, sessLo: s => s.sessLo,
        pwh: s => s.pwh, pwl: s => s.pwl, pwo: s => s.pwo, fvgUpMid: s => s.fvgUpMid, fvgDnMid: s => s.fvgDnMid
      };
      Object.keys(SMC_SERIES).forEach(t => { EXTRA_SERIES[t] = (bars, o, tz) => SMC_SERIES[t](smcOf(bars, tz)); });
      EXTRA_SERIES.rangePos = (bars, o) => rangePos(bars, o.n || 20);
      EXTRA_SERIES.poc = (bars, o) => pocOf(bars, o.n || 60);
      EXTRA_SERIES.delta = (bars) => barDelta(bars);
      EXTRA_SERIES.cvd = (bars, o) => cumDelta(bars, o.n || 24);

      Object.assign(FLAGS, {
        bosUp: { label: 'structure breaks up (the close takes out the last swing high)', mirror: 'bosDn', warm: 45 },
        bosDn: { label: 'structure breaks down (the close takes out the last swing low)', mirror: 'bosUp', warm: 45 },
        chochUp: { label: 'the character changes to bullish (first up-break after a down-trend)', mirror: 'chochDn', warm: 60 },
        chochDn: { label: 'the character changes to bearish (first down-break after an up-trend)', mirror: 'chochUp', warm: 60 },
        fvgBull: { label: 'a bullish fair value gap forms', mirror: 'fvgBear', warm: 6 },
        fvgBear: { label: 'a bearish fair value gap forms', mirror: 'fvgBull', warm: 6 },
        inFvgBull: { label: 'price trades back into the open bullish fair value gap', mirror: 'inFvgBear', warm: 20 },
        inFvgBear: { label: 'price trades back into the open bearish fair value gap', mirror: 'inFvgBull', warm: 20 },
        obBull: { label: 'price taps the last bullish order block', mirror: 'obBear', warm: 50 },
        obBear: { label: 'price taps the last bearish order block', mirror: 'obBull', warm: 50 },
        sweepLow: { label: 'liquidity is swept below the last N bars and price closes back above', period: 1, def: 20, mirror: 'sweepHigh' },
        sweepHigh: { label: 'liquidity is swept above the last N bars and price closes back below', period: 1, def: 20, mirror: 'sweepLow' },
        eqHighs: { label: 'two swing highs form at the same level (equal highs)', mirror: 'eqLows', warm: 45 },
        eqLows: { label: 'two swing lows form at the same level (equal lows)', mirror: 'eqHighs', warm: 45 },
        dispUp: { label: 'a big up candle prints — body over 1.5 times the average recent swing', mirror: 'dispDn', warm: 20 },
        dispDn: { label: 'a big down candle prints — body over 1.5 times the average recent swing', mirror: 'dispUp', warm: 20 },
        inDiscount: { label: 'price is in the discount half of the last 20-bar range', mirror: 'inPremium', warm: 24 },
        inPremium: { label: 'price is in the premium half of the last 20-bar range', mirror: 'inDiscount', warm: 24 },
        oteLong: { label: 'price is in the 62-79% retracement zone of the last 20-bar range (long OTE)', mirror: 'oteShort', warm: 24 },
        oteShort: { label: 'price is in the 62-79% retracement zone of the last 20-bar range (short OTE)', mirror: 'oteLong', warm: 24 },
        absorption: { label: 'heavy volume on a small range (absorption, estimated from bars)', warm: 26 },
        trendUp: { label: 'market structure is bullish (last break was upward)', mirror: 'trendDn', warm: 60 },
        trendDn: { label: 'market structure is bearish (last break was downward)', mirror: 'trendUp', warm: 60 }
      });
      const SMC_FLAGS = {
        bosUp: s => s.bosUp, bosDn: s => s.bosDn, chochUp: s => s.chochUp, chochDn: s => s.chochDn,
        inFvgBull: s => s.inFvgUp, inFvgBear: s => s.inFvgDn, obBull: s => s.obUp, obBear: s => s.obDn,
        eqHighs: s => s.eqHi, eqLows: s => s.eqLo
      };
      Object.keys(SMC_FLAGS).forEach(f => { EXTRA_FLAGS[f] = (bars, c, tz) => SMC_FLAGS[f](smcOf(bars, tz)); });
      EXTRA_FLAGS.fvgBull = (bars, c, tz) => smcOf(bars, tz).fvgNew.map(v => v === 1);
      EXTRA_FLAGS.fvgBear = (bars, c, tz) => smcOf(bars, tz).fvgNew.map(v => v === -1);
      EXTRA_FLAGS.dispUp = (bars, c, tz) => smcOf(bars, tz).disp.map(v => v === 1);
      EXTRA_FLAGS.dispDn = (bars, c, tz) => smcOf(bars, tz).disp.map(v => v === -1);
      EXTRA_FLAGS.trendUp = (bars, c, tz) => smcOf(bars, tz).trend.map(v => v === 1);
      EXTRA_FLAGS.trendDn = (bars, c, tz) => smcOf(bars, tz).trend.map(v => v === -1);
      EXTRA_FLAGS.sweepLow = (bars, c) => {
        const n = Math.max(2, c.n | 0 || 20), out = new Array(bars.length).fill(false);
        for (let i = n; i < bars.length; i++) {
          let lo = Infinity;
          for (let j = i - n; j < i; j++) if (bars[j].l < lo) lo = bars[j].l;
          out[i] = bars[i].l < lo && bars[i].c > lo;
        }
        return out;
      };
      EXTRA_FLAGS.sweepHigh = (bars, c) => {
        const n = Math.max(2, c.n | 0 || 20), out = new Array(bars.length).fill(false);
        for (let i = n; i < bars.length; i++) {
          let hi = -Infinity;
          for (let j = i - n; j < i; j++) if (bars[j].h > hi) hi = bars[j].h;
          out[i] = bars[i].h > hi && bars[i].c < hi;
        }
        return out;
      };
      EXTRA_FLAGS.inDiscount = (bars) => rangePos(bars, 20).map(v => isFinite(v) && v < 50);
      EXTRA_FLAGS.inPremium = (bars) => rangePos(bars, 20).map(v => isFinite(v) && v > 50);
      EXTRA_FLAGS.oteLong = (bars) => rangePos(bars, 20).map(v => isFinite(v) && v >= 21 && v <= 38);
      EXTRA_FLAGS.oteShort = (bars) => rangePos(bars, 20).map(v => isFinite(v) && v >= 62 && v <= 79);
      EXTRA_FLAGS.absorption = (bars, c, tz) => {
        const s = smcOf(bars, tz), av = sma(bars.map(b => b.v), 20), out = new Array(bars.length).fill(false);
        for (let i = 0; i < bars.length; i++) {
          const rg = bars[i].h - bars[i].l;
          out[i] = isFinite(av[i]) && av[i] > 0 && isFinite(s.atr[i]) && s.atr[i] > 0 &&
            (bars[i].v || 0) > 2 * av[i] && rg < 0.7 * s.atr[i];
        }
        return out;
      };

      /* ------------------------------ the words traders actually use for all this */
      /* These go to the FRONT of the tables: they are more specific than the
         general phrases, so they must be tried first. */
      FLAG_WORDS.splice.apply(FLAG_WORDS, [0, 0].concat([
        /* --- liquidity ------------------------------------------------------- */
        [/\b(?:sweep|sweeps|swept|grab(?:s|bed)?|raid(?:s|ed)?|take[sn]? out|took out|run(?:s)? (?:on )?)\s*(?:the\s+|of\s+|on\s+|into\s+)*(?:sell[- ]?side|ssl|lows?|buy stops? below|equal lows?)\b/, () => ({ f: 'sweepLow', n: 20 })],
        [/\b(?:sweep|sweeps|swept|grab(?:s|bed)?|raid(?:s|ed)?|take[sn]? out|took out|run(?:s)? (?:on )?)\s*(?:the\s+|of\s+|on\s+|into\s+)*(?:buy[- ]?side|bsl|highs?|sell stops? above|equal highs?)\b/, () => ({ f: 'sweepHigh', n: 20 })],
        [/\bliquidity (?:sweep|grab|raid|hunt|run)\b(?!.*\bhigh)/, () => ({ f: 'sweepLow', n: 20 })],
        [/\bstop (?:hunt|run|raid)\b|\bturtle soup\b|\bfalse break(?:out|down)?\b|\bfakeout\b|\bspring\b/, () => ({ f: 'sweepLow', n: 20 })],
        [/\bupthrust\b|\bbull trap\b/, () => ({ f: 'sweepHigh', n: 20 })],
        [/\bbear trap\b/, () => ({ f: 'sweepLow', n: 20 })],
        [/\bequal highs?\b|\beqh\b|\bdouble top\b|\btwin peaks?\b/, () => ({ f: 'eqHighs' })],
        [/\bequal lows?\b|\beql\b|\bdouble bottom\b/, () => ({ f: 'eqLows' })],
        /* --- structure -------------------------------------------------------- */
        [/\bstructure breaks? (?:up|higher)\b|\bbreaks? structure (?:up|higher)\b/, () => ({ f: 'bosUp' })],
        [/\bstructure breaks? (?:down|lower)\b|\bbreaks? structure (?:down|lower)\b/, () => ({ f: 'bosDn' })],
        [/\bchoch\b|\bchange of character\b|\bcharacter change\b|\bturns? bullish structurally\b/, () => ({ f: 'chochUp' })],
        [/\bbearish choch\b|\bchoch down\b/, () => ({ f: 'chochDn' })],
        [/\b(?:bullish )?(?:bos|break of structure|market structure shift|mss|structure break)\s*(?:up|long|bullish)?\b/, () => ({ f: 'bosUp' })],
        [/\b(?:bearish )?(?:bos|break of structure|market structure shift|mss)\s*(?:down|short|bearish)\b/, () => ({ f: 'bosDn' })],
        [/\bhigher high\b|\bmakes? a new higher high\b|\bhh\b/, () => ({ f: 'bosUp' })],
        [/\blower low\b|\bmakes? a new lower low\b|\bll\b/, () => ({ f: 'bosDn' })],
        [/\bbullish (?:structure|order ?flow|trend structure)\b|\bstructure is bullish\b/, () => ({ f: 'trendUp' })],
        [/\bbearish (?:structure|order ?flow|trend structure)\b|\bstructure is bearish\b/, () => ({ f: 'trendDn' })],
        /* --- imbalance and blocks --------------------------------------------- */
        [/\b(?:bullish )?(?:fvg|fair value gap|imbalance|inefficiency)\b(?!.*\b(?:return|retest|back into|fill))/, () => ({ f: 'fvgBull' })],
        [/\bbearish (?:fvg|fair value gap|imbalance|inefficiency)\b/, () => ({ f: 'fvgBear' })],
        [/\b(?:fvg|imbalance|inefficiency|gap)\s*(?:retest|mitigation|fill|tap)\b/, () => ({ f: 'inFvgBull' })],
        [/\b(?:returns?|comes? back|trades? back|retest(?:s|ed)?|taps?|fills?|mitigat\w+)\s*(?:in)?to\s*(?:the\s+)?(?:bullish\s+)?(?:fvg|fair value gap|imbalance|inefficiency|gap)\b/, () => ({ f: 'inFvgBull' })],
        [/\b(?:returns?|comes? back|trades? back|retest(?:s|ed)?|taps?|fills?|mitigat\w+)\s*(?:in)?to\s*(?:the\s+)?bearish\s*(?:fvg|fair value gap|imbalance|inefficiency|gap)\b/, () => ({ f: 'inFvgBear' })],
        [/\b(?:bullish|demand)\s*(?:order ?block|ob|zone|block)\b|\btaps? (?:the )?(?:bullish )?order ?block\b|\bdemand zone\b/, () => ({ f: 'obBull' })],
        [/\b(?:bearish|supply)\s*(?:order ?block|ob|zone|block)\b|\bsupply zone\b/, () => ({ f: 'obBear' })],
        [/\border ?block\b|\bmitigation block\b|\bbreaker block\b|\bbreaker\b/, () => ({ f: 'obBull' })],
        [/\bdisplacement\b|\bimpulse (?:candle|move|leg)\b|\bexpansion candle\b|\bmomentum candle\b/, () => ({ f: 'dispUp' })],
        [/\bbearish displacement\b|\bdown displacement\b/, () => ({ f: 'dispDn' })],
        /* --- premium / discount / OTE ----------------------------------------- */
        [/\bdiscount\b|\bin discount\b|\bbelow equilibrium\b|\bcheap half\b/, () => ({ f: 'inDiscount' })],
        [/\bpremium\b|\bin premium\b|\babove equilibrium\b/, () => ({ f: 'inPremium' })],
        [/\bote\b|\boptimal trade entry\b|\bgolden pocket\b|\b(?:62|0\.?62|61\.8)\s*(?:to|-)\s*(?:79|0\.?79|78\.6)\b/, () => ({ f: 'oteLong' })],
        /* --- order flow proxies ---------------------------------------------- */
        [/\babsorption\b|\babsorbed\b|\beffort (?:with|without) result\b/, () => ({ f: 'absorption' })]
      ]));

      OPERAND_WORDS.splice.apply(OPERAND_WORDS, [0, 0].concat([
        [/\bswing high\b|\blast (?:major )?high\b|\bstructural high\b/, () => ({ t: 'swingHi' })],
        [/\bswing low\b|\blast (?:major )?low\b|\bstructural low\b/, () => ({ t: 'swingLo' })],
        [/\b(?:previous|last|prior) week'?s? high\b|\bpwh\b/, () => ({ t: 'pwh' })],
        [/\b(?:previous|last|prior) week'?s? low\b|\bpwl\b/, () => ({ t: 'pwl' })],
        [/\b(?:previous|last|prior) week'?s? open\b|\bweekly open\b/, () => ({ t: 'pwo' })],
        [/\bpdh\b/, () => ({ t: 'pdh' })],
        [/\bpdl\b/, () => ({ t: 'pdl' })],
        [/\b(?:daily|midnight|today'?s?) open\b|\bnew york midnight\b/, () => ({ t: 'dayOpen' })],
        [/\basian? (?:session |range )?high\b|\basia high\b/, () => ({ t: 'asiaHi' })],
        [/\basian? (?:session |range )?low\b|\basia low\b/, () => ({ t: 'asiaLo' })],
        [/\b(?:today'?s?|session|intraday) high\b/, () => ({ t: 'sessHi' })],
        [/\b(?:today'?s?|session|intraday) low\b/, () => ({ t: 'sessLo' })],
        [/\bconsequent encroachment\b|\bce of the (?:gap|fvg)\b|\bmid(?:point)? of the (?:bullish )?(?:fvg|gap)\b/, () => ({ t: 'fvgUpMid' })],
        [/\bpoc\b|\bpoint of control\b|\bhigh volume node\b|\bhvn\b/, () => ({ t: 'poc', n: 60 })],
        [/\bcumulative delta\b|\bcvd\b|\bdelta over\b/, () => ({ t: 'cvd', n: 24 })],
        [/\bdelta\b/, () => ({ t: 'delta' })],
        [/\brange position\b|\bwhere (?:it|price) sits in the range\b/, () => ({ t: 'rangePos', n: 20 })]
      ]));

      SHORTHANDS.splice.apply(SHORTHANDS, [0, 0].concat([
        [/\bsilver bullet\b/, () => ({
          c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 10 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 11 } }],
          note: '"silver bullet" read as the 10:00-11:00 window in the timezone chosen for the run — set that to New York for the ICT version'
        })],
        [/\blondon kill ?zone\b|\blondon open kill ?zone\b/, () => ({
          c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 2 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 5 } }],
          note: '"London killzone" read as 02:00-05:00 in the run timezone (set it to New York for ICT hours)'
        })],
        [/\b(?:new york|ny) kill ?zone\b/, () => ({
          c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 7 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 10 } }],
          note: '"New York killzone" read as 07:00-10:00 in the run timezone'
        })],
        [/\blondon close kill ?zone\b|\blondon close\b/, () => ({
          c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 10 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 12 } }],
          note: '"London close" read as 10:00-12:00 in the run timezone'
        })],
        [/\basian? range\b|\basian? session\b/, () => ({
          c: [{ l: { t: 'hour' }, op: 'gte', r: { t: 'num', v: 0 } }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 6 } }],
          note: '"Asian range" read as 00:00-06:00 in the run timezone'
        })],
        [/\bjudas swing\b/, () => ({
          c: [{ f: 'sweepHigh', n: 12 }, { l: { t: 'hour' }, op: 'lte', r: { t: 'num', v: 10 } }],
          note: '"Judas swing" read as an early-session sweep of the previous 12 bars\' high before 10:00 — the short side of it; mirror it by hand for longs'
        })],
        [/\bpower of (?:3|three)\b|\bamd\b|\baccumulation manipulation distribution\b/, () => ({
          c: [{ f: 'sweepLow', n: 20 }, { f: 'dispUp' }],
          note: '"Power of 3" read as a sweep of the previous 20 bars\' low followed by an up displacement candle'
        })],
        [/\bunicorn\b|\b(?:ob|order block)\s*\+\s*fvg\b/, () => ({
          c: [{ f: 'obBull' }, { f: 'inFvgBull' }],
          note: '"unicorn" read as price tapping a bullish order block that overlaps an open bullish fair value gap'
        })],
        [/\bmodel 2022\b|\bict 2022 model\b/, () => ({
          c: [{ f: 'sweepLow', n: 20 }, { f: 'chochUp' }, { f: 'inFvgBull' }],
          note: '"2022 model" read as a sweep of lows, then a bullish change of character, then a return into the fair value gap'
        })],
        [/\bsmart money (?:is )?(?:buying|accumulating|long)\b/, () => ({
          c: [{ f: 'trendUp' }, { f: 'sweepLow', n: 20 }],
          note: '"smart money buying" read as bullish structure after a sweep of lows — the closest testable reading'
        })],
        [/\bsmart money (?:is )?(?:selling|distributing|short)\b/, () => ({
          c: [{ f: 'trendDn' }, { f: 'sweepHigh', n: 20 }],
          note: '"smart money selling" read as bearish structure after a sweep of highs'
        })]
      ]));


      /* "sweeps the Asian high", "takes out PDL" — a sweep OF A NAMED LEVEL is a
         different thing from the generic N-bar sweep, and it is computable: the
         bar trades through the level and closes back on the original side. */
      const LEVEL_WORDS = [
        [/pdh|yesterday'?s? high|previous day'?s? high/, 'pdh', "yesterday's high", 1],
        [/pdl|yesterday'?s? low|previous day'?s? low/, 'pdl', "yesterday's low", 0],
        [/pwh|(?:previous|last) week'?s? high/, 'pwh', "last week's high", 1],
        [/pwl|(?:previous|last) week'?s? low/, 'pwl', "last week's low", 0],
        [/asian? (?:session |range )?high|asia high/, 'asiaHi', 'the Asian session high', 1],
        [/asian? (?:session |range )?low|asia low/, 'asiaLo', 'the Asian session low', 0],
        [/(?:today'?s?|session|intraday) high/, 'sessHi', "today's high", 1],
        [/(?:today'?s?|session|intraday) low/, 'sessLo', "today's low", 0],
        [/swing high/, 'swingHi', 'the last swing high', 1],
        [/swing low/, 'swingLo', 'the last swing low', 0]
      ];
      LEVEL_WORDS.forEach(L => {
        const re = new RegExp('\\b(?:sweeps?|swept|takes? out|took out|taken out|raids?|grabs?|runs? through|hunts?)\\s+(?:the\\s+)?(?:' + L[0].source + ')\\b');
        SHORTHANDS.splice(0, 0, [re, () => ({
          c: L[3] ? [{ l: { t: 'high' }, op: 'gt', r: { t: L[1] } }, { l: { t: 'close' }, op: 'lt', r: { t: L[1] } }]
            : [{ l: { t: 'low' }, op: 'lt', r: { t: L[1] } }, { l: { t: 'close' }, op: 'gt', r: { t: L[1] } }],
          note: '"sweeps ' + L[2] + '" read as the bar trading through ' + L[2] + ' and closing back on the other side of it'
        })]);
      });

      /* -------------------- things this engine genuinely cannot test, by name --- */
      const REFUSALS = [
        [/\bsmt\b|\bcorrelat\w+ (?:pair|asset|market)\b|\bdxy\b/i,
          'SMT divergence needs two markets compared at the same time, and a backtest here runs one market'],
        [/\bfootprint\b|\bdom\b|\bdepth of market\b|\border book\b|\btape\b|\bbid[\/ -]?ask\b|\biceberg\b|\bticks?\b|\bmarket profile letters\b/i,
          'true order flow needs tick and bid/ask data; this engine only has open, high, low, close and volume — the estimated delta is the nearest thing it has'],
        [/\bvah\b|\bval\b|\bvalue area\b|\bvolume profile\b|\blvn\b/i,
          'a full volume profile needs traded volume at each price; the point of control is approximated from bar ranges, and the value area is not'],
        [/\bhead and shoulders\b|\bcup and handle\b|\bwedge\b|\btriangle\b|\bpennant\b|\bflag pattern\b|\belliott\b|\bharmonic\b|\bgartley\b|\bbutterfly\b/i,
          'chart patterns that need line fitting are not implemented'],
        [/\btrend ?line\b|\bchannel\b|\bfib(?:onacci)? (?:level|extension|retracement) (?:at|of) \d/i,
          'drawn trendlines and channels are not implemented; the range position and swing levels are the closest testable ideas'],
        [/\bipda\b|\bquarterly (?:shift|theory)\b|\bmmxm\b|\bmarket maker (?:buy|sell) model\b|\balgorithm\w* (?:price )?delivery\b/i,
          'that is a framework rather than a rule the engine can evaluate on a bar'],
        [/\bopen interest\b|\bcot\b|\bcommitment of traders\b|\bfunding rate\b|\bsentiment\b/i,
          'that needs a data feed beyond price and volume'],
      ];
      function refusalFor(text) {
        for (let i = 0; i < REFUSALS.length; i++) if (REFUSALS[i][0].test(text)) return REFUSALS[i][1];
        return null;
      }

      /* swing-to-swing structure: higher highs, higher lows, and their opposites */
      Object.assign(FLAGS, {
        hhStruct: { label: 'a new swing high forms above the previous swing high', mirror: 'llStruct', warm: 60 },
        hlStruct: { label: 'a new swing low forms above the previous swing low', mirror: 'lhStruct', warm: 60 },
        lhStruct: { label: 'a new swing high forms below the previous swing high', mirror: 'hlStruct', warm: 60 },
        llStruct: { label: 'a new swing low forms below the previous swing low', mirror: 'hhStruct', warm: 60 }
      });
      function swingCompare(bars, tz, which) {
        const s = smcOf(bars, tz), n = bars.length, out = new Array(n).fill(false);
        const hiNew = (i) => i > 0 && s.lastHi[i] !== s.lastHi[i - 1] && isFinite(s.lastHi[i]) && isFinite(s.prevHi[i]);
        const loNew = (i) => i > 0 && s.lastLo[i] !== s.lastLo[i - 1] && isFinite(s.lastLo[i]) && isFinite(s.prevLo[i]);
        for (let i = 1; i < n; i++) {
          if (which === 'hh') out[i] = hiNew(i) && s.lastHi[i] > s.prevHi[i];
          if (which === 'lh') out[i] = hiNew(i) && s.lastHi[i] < s.prevHi[i];
          if (which === 'hl') out[i] = loNew(i) && s.lastLo[i] > s.prevLo[i];
          if (which === 'll') out[i] = loNew(i) && s.lastLo[i] < s.prevLo[i];
        }
        return out;
      }
      EXTRA_FLAGS.hhStruct = (bars, c, tz) => swingCompare(bars, tz, 'hh');
      EXTRA_FLAGS.hlStruct = (bars, c, tz) => swingCompare(bars, tz, 'hl');
      EXTRA_FLAGS.lhStruct = (bars, c, tz) => swingCompare(bars, tz, 'lh');
      EXTRA_FLAGS.llStruct = (bars, c, tz) => swingCompare(bars, tz, 'll');

      /* =======================================================================
         5. The strategy IR.
      
         A described strategy compiles to this shape, and the engine executes
         only this. Nothing here guesses: every number in it came either from
         what the user wrote or from a named default that is carried alongside
         so the interface can say which is which.
      
           Strategy = {
             v:2, name, text,
             long:  Plan | null,
             short: Plan | null,
             exitLong: Group, exitShort: Group,
             coverage: [{text, status, detail}]      status: exact | default | ambiguous | unsupported
           }
           Plan = { steps:[Step], filters:[Cond] }   steps are ORDERED; the last one triggers
           Step = { id, label, cond, within }        within = bars allowed since the previous step
           Cond = {l,op,r} | {f,n,v,within} | {all:[Cond]} | {any:[Cond]} | {not:Cond}
           Operand = {t, n?, v?, mult?, off?, step?, part?}
              off  = how many bars back from the bar being tested
              step = id of an earlier step; part = 'high'|'low'|'close'|'open'
         ===================================================================== */

      /* ------------------------------------------------- candle mathematics */
      const CANDLE_SERIES = {
        body: bars => bars.map(b => Math.abs(b.c - b.o)),
        range: bars => bars.map(b => b.h - b.l),
        upperWick: bars => bars.map(b => b.h - Math.max(b.o, b.c)),
        lowerWick: bars => bars.map(b => b.l * 0 + (Math.min(b.o, b.c) - b.l)),
        closePos: bars => bars.map(b => { const r = b.h - b.l; return r > 0 ? (b.c - b.l) / r * 100 : 50; }),
        openPos: bars => bars.map(b => { const r = b.h - b.l; return r > 0 ? (b.o - b.l) / r * 100 : 50; }),
        bodyPct: bars => bars.map(b => { const r = b.h - b.l; return r > 0 ? Math.abs(b.c - b.o) / r * 100 : 0; }),
        dirUp: bars => bars.map(b => b.c > b.o ? 1 : 0),
        dirDn: bars => bars.map(b => b.c < b.o ? 1 : 0)
      };
      Object.assign(OPERANDS, {
        body: { label: 'the candle body', kind: 'range', warm: () => 2 },
        range: { label: 'the candle range', kind: 'range', warm: () => 2 },
        upperWick: { label: 'the upper wick', kind: 'range', warm: () => 2 },
        lowerWick: { label: 'the lower wick', kind: 'range', warm: () => 2 },
        closePos: { label: 'where the close sits in the candle range (0 = the low, 100 = the high)', kind: 'osc', warm: () => 2 },
        openPos: { label: 'where the open sits in the candle range', kind: 'osc', warm: () => 2 },
        bodyPct: { label: 'the body as a percentage of the candle range', kind: 'osc', warm: () => 2 },
        dirUp: { label: 'the candle closed up (1 or 0)', kind: 'osc', warm: () => 2 },
        dirDn: { label: 'the candle closed down (1 or 0)', kind: 'osc', warm: () => 2 }

      const VAGUE_REFS = [

        [/\bdemand\b|\bsupply\b(?!\s*zone)/, 'a supply or demand area'],

      function matchRef(txt) {

            const m = txt.match(/(\d{1,4})\s*(?:period|bar|day)?\s*(ema|sma|ma|moving average|average)/);
            if (!m) return null;
            const ema = /ema/.test(m[2]);
            const lvl = { t: ema ? 'ema' : 'sma', n: +m[1] };
            const which = /\blow\b/.test(txt) ? 'low' : /\bhigh\b/.test(txt) ? 'high' : null;
            const name = (ema ? 'the ' + m[1] + '-period EMA' : 'the ' + m[1] + '-period average');
            return T({
              all: [{ l: { t: 'low' }, op: 'lte', r: JSON.parse(JSON.stringify(lvl)) },
              { l: { t: 'high' }, op: 'gte', r: JSON.parse(JSON.stringify(lvl)) }]
            },
              (which ? "the candle's " + which + ' reaches ' + name : 'the candle touches ' + name) +
              ' — the average sits between the low and the high of the candle',
              { kind: 'event', short: 'price touches ' + (ema ? m[1] + ' EMA' : m[1] + ' MA'), status: 'exact' });
          }
        },
        {
          id: 'maVsMa', re: /\b\d{1,4}\s*(?:period\s*)?(?:ema|sma|ma)\b[\s\S]*\b(?:above|below|over|under|greater|less|cross\w*)\b[\s\S]*\b\d{1,4}\s*(?:period\s*)?(?:ema|sma|ma|moving average|average)\b/,
          build: (txt) => {
            const all = []; const re = /(\d{1,4})\s*(?:period|bar|day)?\s*(ema|sma|ma|moving average|average)/g;
            let m; while ((m = re.exec(txt)) !== null) all.push({ n: +m[1], ema: /ema/.test(m[2]) });
            if (all.length < 2) return null;
            const cross = /\bcross\w*\b/.test(txt);
            const up = /\babove|over|greater|higher\b/.test(txt) && !/\bbelow|under|less|lower\b/.test(txt);
            const L = { t: all[0].ema ? 'ema' : 'sma', n: all[0].n }, R = { t: all[1].ema ? 'ema' : 'sma', n: all[1].n };
            const nm = o => o.n + '-period ' + (o.t === 'ema' ? 'EMA' : 'average');
            return T({ l: L, op: cross ? (up ? 'xup' : 'xdn') : (up ? 'gt' : 'lt'), r: R },
              'the ' + nm(L) + ' is ' + (cross ? (up ? 'crossing above ' : 'crossing below ') : (up ? 'above ' : 'below ')) + 'the ' + nm(R),
              {
                kind: cross ? 'event' : 'state',
                short: nm(L) + (cross ? (up ? ' crosses above ' : ' crosses below ') : (up ? ' above ' : ' below ')) + nm(R),
                status: 'exact'
              });
          }
        },
        /* ---- this candle closed up or down ---------------------------------- */
        {
          id: 'closedUp', re: /\b(?:candle|bar|it)\s+(?:has\s+)?clos\w*\s+(?:up|higher|green|bullish|positive)\b|\bclos\w*\s+(?:up|green|bullish)\b|\bbullish\s+(?:confirmation\s+)?(?:candle|close|bar)\b|\bgreen\s+(?:candle|bar)\b/,
          build: (txt) => {
            if (/\bstrong|displacement|impulsive|momentum|marubozu|engulf|doji|hammer|shooting|inside|outside\b/.test(txt)) return null;
            return T({ l: { t: 'dirUp' }, op: 'eq', r: { t: 'num', v: 1 } }, 'the candle closes up (its close is above its open)',
              { kind: 'event', short: 'candle closed up', status: 'exact' });
          }
        },
        {
          id: 'closedDown', re: /\b(?:candle|bar|it)\s+(?:has\s+)?clos\w*\s+(?:down|lower|red|bearish|negative)\b|\bclos\w*\s+(?:down|red|bearish)\b|\bbearish\s+(?:confirmation\s+)?(?:candle|close|bar)\b|\bred\s+(?:candle|bar)\b/,
          build: (txt) => {
            if (/\bstrong|displacement|impulsive|momentum|marubozu|engulf|doji|hammer|shooting|inside|outside\b/.test(txt)) return null;
            return T({ l: { t: 'dirDn' }, op: 'eq', r: { t: 'num', v: 1 } }, 'the candle closes down (its close is below its open)',
              { kind: 'event', short: 'candle closed down', status: 'exact' });
          }
        },
        /* ---- liquidity: taking out a level -------------------------------- */
        {
          id: 'orderingOnly', re: /^\s*(?:the\s+)?(?:\d+\s*[mhdw]\s+)?(?:bullish|bearish)\s+(?:break|setup|leg|move|confirmation)\s*$|\b(?:setup|leg|move|sequence)\s+is\s+(?:confirmed|complete[d]?|done)\b|\bafter the\s+(?:\d+\s*[mhdw]\s+)?(?:bullish|bearish)?\s*(?:setup|break|leg)\b/,
          build: (txt) => {
            if (/\bsweep|reject|close|break and|fvg|gap|order block|structure|trend\b/.test(txt.replace(/\bafter the[^,]*/, ''))) return null;
            return { ordering: true };
          }
        },
        {
          id: 'sweep', re: /\b(?:sweeps?|swept|sweeping|takes? out|took out|taken out|raids?|grabs?|runs?|hunts?|breaches?|violates?|wicks? (?:below|above|through))\b/,
          build: (txt, ctx) => {
            if (/\bclos\w+\s+back\s+(?:above|below)\b/.test(txt)) return null;   /* that is a close, not a sweep */
            const vague = vagueRef(txt);
            let r = matchRef(txt);
            if (!r && vague) return { unsupported: '"' + vague + '" cannot be located objectively from price alone — name the level (the previous swing low, yesterday\'s low, the 20-bar low) and it can be tested' };
            if (!r) {
              const wantsHigh = /\bhigh|highs|buy[- ]?side|bsl|resistance|above|upside\b/.test(txt) ||
                (!/\blow|lows|sell[- ]?side|ssl|below|downside\b/.test(txt) && ctx.bias === 'short');
              r = {
                op: wantsHigh ? { t: 'swingHi' } : { t: 'swingLo' }, name: wantsHigh ? 'the last swing high' : 'the last swing low',
                status: 'default', side: wantsHigh ? 'high' : 'low',
                detail: 'no level was named, so the sweep is measured against the last swing ' + (wantsHigh ? 'high' : 'low') +
                  ' (' + LANG_DEF.swingK + ' bars either side). Name a level — yesterday\'s low, the 20-bar low — to be exact'
              };
            }
            ctx.lastRef = r;
            const below = r.side === 'low' || /\b(?:below|under|beneath|through the low)\b/.test(txt);
            const cond = below ? { l: { t: 'low' }, op: 'lt', r: r.op } : { l: { t: 'high' }, op: 'gt', r: r.op };
            return T(cond, 'price trades ' + (below ? 'below ' : 'above ') + r.name + ' (taking the liquidity there)',
              { short: 'swept ' + r.name, status: r.status, detail: r.detail });
          }
        },
        /* ---- closing back through a level --------------------------------- */
        {
          re: /\bcloses?\s+(?:back\s+)?(?:above|below)\b|\bclosed?\s+(?:back\s+)?(?:above|below)\b|\breclaims?\b|\bholds?\s+(?:above|below)\b/,
          build: (txt, ctx) => {
            const above = /\b(?:above|over|back up)\b/.test(txt) || /\breclaims?\b/.test(txt);
            let r = stepRefIn(txt, ctx) || matchRef(txt), name, op;
            if (r) { if (!r.op.step) ctx.lastRef = r; name = r.name; op = r.op; }
            else if (/\bit\b|\bthe level\b|\bthat\b|\bthere\b/.test(txt) && ctx.lastRef) { r = ctx.lastRef; name = r.name + ' (the level just named)'; op = JSON.parse(JSON.stringify(r.op)); }
            else return vagueRef(txt) ? { unsupported: '"' + vagueRef(txt) + '" is not a level this engine can locate — name it explicitly' } : null;
            return T({ l: { t: 'close' }, op: above ? 'gt' : 'lt', r: op },
              'the candle closes ' + (above ? 'back above ' : 'back below ') + name,
              { short: 'closed ' + (above ? 'above ' : 'below ') + name, status: r.status, detail: r.detail });
          }
        },
        /* ---- rejection / wick work ---------------------------------------- */
        {
          id: 'rejection', re: /\breject\w*\b|\bwick\w*\s+(?:rejection|off|from)\b|\blong (?:lower|upper) wick\b|\bpin ?bar\b|\bhammer\b|\bshooting star\b/,
          build: (txt, ctx) => {
            /* "the rejection candle's high" names an earlier candle; it is not a new rejection */
            if (/\b(?:rejection|sweep|signal|setup)\s*(?:candle|bar)?'?s?\s*(?:high|low|close|open)\b/.test(txt)) return null;
            if (/\bcloses?\b|\bbreaks?\b|\btakes? out\b|\btrades? (?:above|below)\b/.test(txt)) return null;
            const lower = /\blower wick\b|\bhammer\b|\bbullish\b|\bfrom below\b|\boff the low\b|\bat the low\b/.test(txt) ||
              (!/\bupper wick\b|\bshooting star\b|\bbearish\b|\boff the high\b/.test(txt) && ctx.bias !== 'short');
            const q = numFrom(txt, LANG_DEF.wickBody);
            const wick = lower ? 'lowerWick' : 'upperWick';
            const other = lower ? 'upperWick' : 'lowerWick';
            const parts = [{ l: { t: wick }, op: 'gte', r: { t: 'body', mult: q.v } },
            { l: { t: wick }, op: 'gt', r: { t: other } }];
            let label = 'the candle leaves a ' + (lower ? 'lower' : 'upper') + ' wick at least ' + q.v +
              ' times its body, and bigger than the ' + (lower ? 'upper' : 'lower') + ' wick';
            const zone = pctZone(txt);
            if (zone) {
              parts.push(zone.end === 'top' ? { l: { t: 'closePos' }, op: 'gte', r: { t: 'num', v: 100 - zone.pct } }
                : { l: { t: 'closePos' }, op: 'lte', r: { t: 'num', v: zone.pct } });
              label += ', closing in the ' + (zone.end === 'top' ? 'top ' : 'bottom ') + zone.pct + '% of its range';
            }
            return T({ all: parts }, label, {
              short: (lower ? 'rejected from below' : 'rejected from above'),
              status: q.exact && (!zone || zone.exact) ? 'exact' : 'default',
              detail: q.exact ? '' : '"' + (txt.match(/\bstrong\b/) ? 'strong ' : '') + 'rejection" uses the house definition: wick at least ' + LANG_DEF.wickBody + 'x the body and larger than the opposite wick'
            });
          }
        },
        /* ---- explicit candle mathematics ----------------------------------- */
        {
          re: /\b(?:lower|upper) wick\b.*\b(?:body)\b|\bbody\b.*\b(?:lower|upper) wick\b/,
          build: (txt) => {
            const lower = /\blower wick\b/.test(txt);
            const q = numFrom(txt, LANG_DEF.wickBody);
            const op = /\bat least\b|\bminimum\b|\bor more\b/.test(txt) ? 'gte' : /\bno more than\b|\bat most\b|\bless than\b/.test(txt) ? 'lte' : 'gte';
            return T({ l: { t: lower ? 'lowerWick' : 'upperWick' }, op: op, r: { t: 'body', mult: q.v } },
              'the ' + (lower ? 'lower' : 'upper') + ' wick is ' + (op === 'lte' ? 'no more than ' : 'at least ') + q.v + ' times the body',
              { short: 'wick ' + q.v + 'x body', status: q.exact ? 'exact' : 'default' });
          }
        },
        {
          re: /\bcloses?\s+in the (?:top|bottom|upper|lower)\s+\d+\s*(?:%|percent|pct)/,

            return T(z.end === 'top' ? { l: { t: 'closePos' }, op: 'gte', r: { t: 'num', v: 100 - z.pct } }
