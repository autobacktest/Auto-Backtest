          '<div class="dk">Costs</div><div class="dv">' + cfg.spread + ' + ' + cfg.slippage + ' · ' + money(cfg.commission, 2) + '/lot</div>' +
          (v.data ? '<div class="dk">Dataset</div><div class="dv">' + v.data.rows.toLocaleString('en-US') + ' bars</div>' : '') +
          '</div>';
        let issues = '';
        v.errs.forEach(e => issues += '<div class="note bad" style="margin-top:10px">' + esc(e) + '</div>');
        v.warns.forEach(w => issues += '<div class="note warn" style="margin-top:10px">' + esc(w) + '</div>');
        $('#runIssues').innerHTML = issues;
        $('#btnRun').disabled = !v.ok || state.running;
        /* the pinned bar mirrors the panel, so the button is never out of reach */
        const bar = $('#runBar');
        if (bar) {
          const btn = $('#btnRunBar');
          btn.disabled = !v.ok || state.running;
          const strat = STRATS[cfg.strategy].describe ? STRATS[cfg.strategy].describe(cfg.params) : STRATS[cfg.strategy].name;
          $('#rbTitle').textContent = state.running ? 'Running…'
            : v.errs.length ? (v.errs.length + ' thing' + (v.errs.length === 1 ? '' : 's') + ' to fix')
              : 'Ready to run';
          $('#rbSub').textContent = v.errs.length
            ? v.errs[0].slice(0, 90)
            : esc(I.n) + ' · ' + (cfg.startMs != null ? fmtDate(cfg.startMs, cfg.tz) + ' → ' + fmtDate(cfg.endMs, cfg.tz) : 'no dates') + ' · ' + strat;
          bar.className = 'runbar' + (v.errs.length ? ' bad' : '') + (state.running ? ' busy' : '');
        }
        if ($('#dsCoverage') && v.data) $('#dsCoverage').textContent = 'Covers ' + fmtDate(v.data.first, cfg.tz) + ' → ' + fmtDate(v.data.last, cfg.tz);
        savePrefs();
        renderHistory();
      }

      /* ------------------------------------------------------------------- run */
      function setProgress(p, label) {
        $('#progBar').style.width = Math.round(p * 100) + '%';
        $('#progTxt').innerHTML = '<span class="spin"></span>' + esc(label);
      }
      async function doRun() {
        const cfg = buildCfg(), v = validate(cfg);
        if (!v.ok) { toast(v.errs[0], 'bad'); return; }
        state.running = true; $('#btnRun').disabled = true; $('#prog').classList.add('on');
        setProgress(0.02, 'Loading price data…');
        await new Promise(r => setTimeout(r, 40));
        try {
          const warm = warmupBars(cfg);
          let bars;
          if (cfg.source === 'demo') bars = genDemoBars(cfg.symbol, cfg.startMs - 50 * 86400000, cfg.endMs);
          else bars = datasets[cfg.datasetId].bars;

          const sl = sliceForRun(bars, cfg.startMs, cfg.endMs, warm);
          if (!sl || sl.slice.length < warm + 20) {
            throw new Error('Not enough bars inside the selected period to run this strategy.');
          }
          cfg.tradeStartIdx = sl.tradeStartIdx;
          cfg.bars = sl.slice.length;
          if (cfg.htfIds && Object.keys(cfg.htfIds).length) {
            cfg.htf = {};
            const from = sl.slice[0].t, to = sl.slice[sl.slice.length - 1].t;
            Object.keys(cfg.htfIds).forEach(tf => {
              const d = datasets[cfg.htfIds[tf]];
              if (!d) return;
              const span = (TF_MIN[tf] || 60) * 60000;
              cfg.htf[tf] = d.bars.filter(b => b.t >= from - span * 260 && b.t <= to + span);
            });
          }
          cfg.warmUsed = sl.warmAvailable;
          cfg.warmNeeded = warm;
          setProgress(0.08, 'Running strategy bar by bar…');
          const run = await runBacktest(cfg, sl.slice, p => setProgress(0.08 + p * 0.82, 'Running strategy bar by bar…'));
          setProgress(0.94, 'Calculating performance…');
          await new Promise(r => setTimeout(r, 30));
          const metrics = computeMetrics(run, cfg);
          const rec = {
            id: 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
            ranAt: Date.now(), cfg: cfg, trades: run.trades, equity: run.equity, metrics: metrics,
            bars: sl.slice, blown: run.blown, skipped: run.skippedSignals, skipWhy: run.skipWhy || null, diag: run.diag || null
          };
          state.current = rec;
          saveRun(rec);
          setProgress(1, 'Done');
          state.running = false; $('#prog').classList.remove('on'); $('#btnRun').disabled = false;
          if (!run.trades.length) {
            toast(run.diag ? 'No trades. The dashboard shows how far each setup got and which condition stopped it.'
              : 'Backtest finished, but the strategy produced no trades in that window. Try looser parameters or a different period.', 'bad');
          } else {
            toast('Backtest complete — ' + run.trades.length + ' trades, ' + pctSigned(metrics.pnlPct) + '.', 'good');
          }
          switchView('dashboard');
        } catch (err) {
          state.running = false; $('#prog').classList.remove('on'); $('#btnRun').disabled = false;
          toast(err && err.message ? err.message : 'The backtest failed to run.', 'bad');
          console.error(err);
        }
      }

      /* --------------------------------------------------------- run persistence */
      function sampleEquity(eq, max) {
        if (eq.length <= max) return eq;
        const step = Math.ceil(eq.length / max), out = [];
        for (let i = 0; i < eq.length; i += step) out.push(eq[i]);
        if (out[out.length - 1] !== eq[eq.length - 1]) out.push(eq[eq.length - 1]);
        return out;
      }
      /* the price data a run used is never stored with it — the bars live in the
         dataset registry, and copying them into every run is what used to fill the
         browser's storage and push older backtests out */
      function slimCfg(cfg) {
        const out = {};
        Object.keys(cfg).forEach(k => {
          if (k === 'htf') return;                       /* the higher-timeframe bar arrays */
          const v = cfg[k];
          if (Array.isArray(v) && v.length > 200 && v[0] && typeof v[0] === 'object' && v[0].t != null) return;
          out[k] = v;
        });
        return out;
      }
      /* trades are stored as plain arrays rather than objects: same information,
         a fraction of the characters, which is what decides whether a run fits */
      const TRADE_KEYS = ['n', 'dir', 'entryT', 'exitT', 'entryIdx', 'exitIdx', 'entry', 'exit', 'entryRaw', 'exitRaw',
        'units', 'lots', 'sl', 'tp', 'gross', 'commission', 'costs', 'net', 'balBefore', 'balAfter',
        'retPct', 'hold', 'reason', 'win'];
      function packTrades(trades) { return trades.map(t => TRADE_KEYS.map(k => t[k] === undefined ? null : t[k])); }
      function unpackTrades(rows) {
        if (!rows || !rows.length) return [];
        if (!Array.isArray(rows[0])) return rows;                 /* saved before this change */
        return rows.map(r => { const o = {}; TRADE_KEYS.forEach((k, i) => { o[k] = r[i]; }); return o; });
      }
      function saveRun(rec) {
        const m = rec.metrics;
        const lite = Object.assign({}, m); delete lite.ddSeries;
        const payload = {
          id: rec.id, ranAt: rec.ranAt, cfg: slimCfg(rec.cfg), tradesPacked: packTrades(rec.trades),
          equity: sampleEquity(rec.equity, 1500), metrics: lite, blown: rec.blown,
          skipped: rec.skipped, skipWhy: rec.skipWhy || null, diag: rec.diag || null
        };
        let hist = LS.get(K_HIST, []);
        hist.unshift({
          id: rec.id, ranAt: rec.ranAt, symbol: rec.cfg.symbol, symbolName: rec.cfg.symbolName,
          strategy: STRATS[rec.cfg.strategy].describe ? STRATS[rec.cfg.strategy].describe(rec.cfg.params) : rec.cfg.strategyName,
          startMs: rec.cfg.startMs, endMs: rec.cfg.endMs, tz: rec.cfg.tz, isDemo: rec.cfg.isDemo,
          ret: m.pnlPct, winRate: m.winRate, maxDD: m.maxDD, trades: m.total, pnl: m.pnl
        });
        hist = hist.slice(0, 50);
        let ok = LS.set(K_RUN + rec.id, payload);
        /* a run with tens of thousands of trades cannot fit: keep the most recent
           ones and say so, rather than losing the whole run */
        if (!ok && payload.tradesPacked.length > 2000) {
          const keep = 2000;
          payload.tradesKept = keep; payload.tradesTotal = payload.tradesPacked.length;
          payload.tradesPacked = payload.tradesPacked.slice(-keep);
          ok = LS.set(K_RUN + rec.id, payload);
          if (ok) toast('That run had ' + payload.tradesTotal.toLocaleString('en-US') + ' trades — the last ' + keep +
            ' are kept in the saved copy. Export the full log if you need it.', 'warn');
        }
        let freed = 0;
        /* if it still will not fit, drop the DETAIL of the oldest runs but keep their
           rows, so the list of what you have run never silently loses entries */
        for (let i = hist.length - 1; !ok && i > 0; i--) {
          if (hist[i].noDetail) continue;
          LS.del(K_RUN + hist[i].id);
          hist[i].noDetail = true; freed++;
          ok = LS.set(K_RUN + rec.id, payload);
        }
        if (!ok) {
          /* this one run is too big on its own: keep its row, without the detail */
          hist[0].noDetail = true;
          toast('This backtest was too large for browser storage. Its summary is in the list, and the dashboard stays open until you run another.', 'warn');
        } else if (freed) {
          toast('Browser storage was full, so the ' + freed + ' oldest backtest' + (freed === 1 ? '' : 's') +
            ' kept only their summary rows. Nothing was removed from the list.', 'warn');
        }
        LS.set(K_HIST, hist);
      }
      function loadRun(id) {
        const p = LS.get(K_RUN + id, null);
        if (!p) return null;
        /* ddSeries is rebuilt from the stored equity curve */
        const m = p.metrics; let peak = p.cfg.balance; m.ddSeries = [];
        p.equity.forEach(e => { if (e.eq > peak) peak = e.eq; m.ddSeries.push({ t: e.t, dd: peak > 0 ? (e.eq - peak) / peak * 100 : 0, dd$: e.eq - peak }); });
        /* demo runs regenerate their exact candles; CSV runs reuse the dataset if present */
        let bars = null;
        try {
          if (p.cfg.source === 'demo') {
            const all = genDemoBars(p.cfg.symbol, p.cfg.startMs - 50 * 86400000, p.cfg.endMs);
            const sl = sliceForRun(all, p.cfg.startMs, p.cfg.endMs, p.cfg.warmNeeded || 50);
            if (sl) bars = sl.slice;
          } else if (datasets[p.cfg.datasetId]) {
            const sl = sliceForRun(datasets[p.cfg.datasetId].bars, p.cfg.startMs, p.cfg.endMs, p.cfg.warmNeeded || 50);
            if (sl) bars = sl.slice;
          }
        } catch (e) { }
        p.bars = bars; p.reopened = true;
        p.trades = unpackTrades(p.tradesPacked || p.trades || []);
        delete p.tradesPacked;
        return p;
      }
      function renderHistory() {
        const host = $('#histHost'); if (!host) return;
        const hist = LS.get(K_HIST, []);

        if (!hist.length) {
          host.innerHTML = '<div class="card"><div class="empty"><div class="big">No backtests yet</div>Run one above and it will be saved ' + (account.user ? 'to your account.' : 'in this browser.') + '</div></div>';
          return;
        }
        host.innerHTML = '<div class="tblwrap"><table><thead><tr>' +
          '<th class="nosort l">Date run</th><th class="nosort l">Market</th><th class="nosort l">Strategy</th>' +
          '<th class="nosort l">Period</th><th class="nosort">Return</th><th class="nosort">Win rate</th>' +
          '<th class="nosort">Max DD</th><th class="nosort">Trades</th><th class="nosort"></th></tr></thead><tbody>' +
          hist.map(h => '<tr class="clickable" data-id="' + h.id + '">' +
            '<td class="l">' + fmtDateTime(h.ranAt, h.tz) + (h.isDemo ? ' <span class="badge demo">DEMO</span>' : '') + '</td>' +
            '<td class="l">' + esc(h.symbolName) + '</td><td class="l">' + esc(h.strategy) + '</td>' +
            '<td class="l">' + fmtDate(h.startMs, h.tz) + ' → ' + fmtDate(h.endMs, h.tz) + '</td>' +
            '<td class="' + sgn(h.ret) + '">' + pctSigned(h.ret) + '</td>' +
            '<td>' + pct(h.winRate, 1) + '</td>' +
            '<td class="neg">' + pct(h.maxDD, 1) + '</td>' +
            '<td>' + h.trades + '</td>' +
            '<td>' + (h.noDetail ? '<span class="help" style="margin:0">summary only</span> ' : '') +
            '<button class="btn sm" data-del="' + h.id + '">Delete</button></td></tr>').join('') +
          '</tbody></table></div>' +
          '<div class="tfoot">Click a row to reopen its dashboard.</div>';
        $$('#histHost tbody tr').forEach(tr => tr.addEventListener('click', e => {
          if (e.target.dataset.del) {
            LS.del(K_RUN + e.target.dataset.del);
            LS.set(K_HIST, LS.get(K_HIST, []).filter(x => x.id !== e.target.dataset.del));
            if (state.current && state.current.id === e.target.dataset.del) state.current = null;
            renderHistory(); return;
          }
          const rec = loadRun(tr.dataset.id);
          if (!rec) { toast('Only the summary of that backtest is kept — browser storage filled up, so its trades and charts were dropped. Run it again to see the dashboard.', 'warn'); return; }
          state.current = rec; switchView('dashboard');
        }));
      }

      /* ------------------------------------------------------------- dashboard */
      function kpi(k, v, sub, cls, big) {
        return '<div class="kpi' + (big ? ' lg' : '') + '"><div class="k">' + esc(k) + '</div>' +
          '<div class="v ' + (cls || '') + '">' + v + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
      }
      function emptyState(msg) {
        return '<div class="card"><div class="empty"><div class="big">' + esc(msg) + '</div>' +
          'Head to the Backtest page, pick a market and press Run backtest.<br><br>' +
          '<button class="btn primary" onclick="document.querySelector(\'#nav button[data-view=backtest]\').click()">Go to Backtest</button></div></div>';
      }
      function hoursSvg(hours, tz) {

          const w = Math.abs(h.pnl) / max * 100;

            '<div class="track"><i style="left:' + left + '%;width:' + width + '%;background:' + (h.pnl >= 0 ? 'var(--pos)' : 'var(--neg)') + ';opacity:' + (h.n ? 0.85 : 0.2) + '"></i></div>' +
            '<div class="val ' + sgn(h.pnl) + '">' + (h.n ? moneySigned(h.pnl, 0) + ' <span style="color:var(--faint)">(' + h.n + ')</span>' : '—') + '</div>';
        });

      }
      function renderDashboard() {
        const host = $('#view-dashboard');

        if (!rec) { host.innerHTML = '<div class="page-head"><div><h1>Dashboard</h1><p>The results of your most recent backtest.</p></div></div>' + emptyState('No backtest loaded'); return; }
        const cfg = rec.cfg, m = rec.metrics, tz = cfg.tz, I = INSTR[cfg.symbol];

      <p>${esc(I.n)} · ${esc(stratName)} · ${fmtDate(cfg.startMs, tz)} → ${fmtDate(cfg.endMs, tz)} · all times ${esc(tz)}</p></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${demoBadge}
      <button class="btn sm" id="btnExport">Export trades (CSV)</button></div>
  </div>

  ${rec.blown ? '<div class="note bad" style="margin-bottom:14px"><strong>Account wiped out.</strong> Equity reached zero during the test and trading stopped there.</div>' : ''}

  ${!m.total ? '<div class="note warn" style="margin-bottom:14px"><strong>No trades.</strong> The strategy never triggered in this window, so the metrics below are all zero. Rules joined by ALL have to be true on the same bar — if yours describe a sequence, say "then" and each earlier step is checked over the last 12 bars instead.</div>' : ''}
  <nav class="jump" aria-label="Jump to a section">

  ${funnelHtml(rec)}
  ${m.total && m.total < 20 ? '<div class="note warn" style="margin-bottom:14px"><strong>Only ' + m.total + ' trade' + (m.total === 1 ? '' : 's') + '.</strong> Win rate, profit factor and the rest are not meaningful on a sample this small — one trade moves them a long way. Treat this as a sign the rules are very restrictive rather than as a result.</div>' : ''}

  <div class="summary-grid" style="margin-bottom:14px">

  <div class="grid g4">
    ${kpi('Ending balance', money(m.end, 2), 'from ' + money(m.start, 0), '', true)}

    ${kpi('P&L %', pctSigned(m.pnlPct), 'over one year', sgn(m.pnlPct), true)}

  </div>
  <div class="grid g4" style="margin-top:12px">

    ${kpi('Profit factor', isFinite(m.profitFactor) ? num(m.profitFactor, 2) : '∞', 'money won for every £1 lost — above 1 is a profit')}
  </div>
  <div class="grid g4" style="margin-top:12px">
    ${kpi('Worst drop from a high', pct(m.maxDD, 2), money(m.maxDD$, 2) + ' below the best the account had been', 'neg')}
    ${kpi('Return for the risk taken', m.sharpe == null ? '—' : num(m.sharpe, 2), 'Sharpe ratio — higher means steadier gains')}
    ${kpi('Average result per trade', moneySigned(m.expectancy, 2), 'what one trade made or lost on average', sgn(m.expectancy))}
    ${kpi('Total costs', money(-Math.abs(m.totalCosts), 2), 'spread, slippage, commission', 'neg')}
  </div>

  <div class="sec-title" id="sec-equity"><h2>Equity curve</h2><span>account value marked to market at every bar close</span></div>

  <div class="card">

      ${kpi('Worst drop, as a percentage', pct(m.maxDD, 2), '', 'neg')}
      ${kpi('Worst drop, in money', money(m.maxDD$, 2), '', 'neg')}
      ${kpi('Typical drop', pct(m.avgDD, 2), 'across ' + m.ddEpisodes.length + ' losing stretches')}
      ${kpi('Longest time below a high', num(m.longestDD, 1) + ' days', m.longestDDEp ? fmtDate(m.longestDDEp.from, tz) + ' →' : '')}
      ${kpi('Peak balance', money(m.peakBal, 2), '', 'pos')}

    </div>

  <div class="sec-title" id="sec-price"><h2>Price and trades</h2><span>entries, exits, stops and targets on the candles</span></div>
  <div class="card">

      <h3>${esc(I.n)} &middot; <span id="tfDrawn">${esc(priceTf === 'base' ? tfLabelFor((cfg.baseTfMin) || 60) : priceTf)}</span> candles</h3>

  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <div class="card-head"><h2>P&amp;L analysis</h2></div>
      <div class="deflist">
        <div class="dk">Total net P&amp;L</div><div class="dv ${sgn(m.pnl)}">${moneySigned(m.pnl, 2)}</div>
        <div class="dk">Gross profit</div><div class="dv pos">${moneySigned(m.grossProfit, 2)}</div>
        <div class="dk">Gross loss</div><div class="dv neg">${moneySigned(m.grossLoss, 2)}</div>

            if (!n) return;

          });

      /* A whole month as a calendar, every date carrying its money and its

      function moneyShort(v) {
        if (v == null || !isFinite(v)) return '—';
        const cur = acctCur(), C = CURRENCIES[cur], rate = cur === 'USD' ? 1 : acctRate();

      function fullMonthCal(monthKey, byKey, startEq, opts) {
        opts = opts || {};

          if (openEq === null) openEq = rd.eq - rd.pnl;

          const tone = rd.pnl > 0 ? 'up' : rd.pnl < 0 ? 'down' : 'flat';

            (opts.clickable ? ' type="button" data-day="' + key + '"' : '') +
            ' style="--w:' + w.toFixed(2) + '" title="' + esc(fmtKeyDate(key) + ' · ' + moneySigned(rd.pnl, 2) + ' · ' + pctSigned(rd.ret * 100, 2) + ' · ' + rd.n + ' trade' + (rd.n === 1 ? '' : 's')) + '">' +

            (rd.pnl === 0 && !rd.n ? '' :
              (opts.lead === 'pct'

        const ret = openEq > 0 ? pnl / openEq * 100 : 0;

        return '<div class="fmonth' + (opts.best ? ' best' : '') + (opts.worst ? ' worst' : '') + (has ? '' : ' nodata') + '">' +

      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      function calendarHtml(m, tz) {

      /* --------------------------------------------- which session pays best */

    the rows are not meant to add up to your total.${m.sessionNone.n ? ' ' + m.sessionNone.n + ' trade' + (m.sessionNone.n === 1 ? '' : 's') + ' opened while none of the four were running.' : ''}</div>

      /* which timeframes this run can draw: the one it traded on, plus any coarser

      /* ------------------------------------------------------------ CSV export */

      let priceTf = 'base';        /* which timeframe the candles are drawn on */

      /* chart colours come from the stylesheet, so they follow the theme */
      function cssVar(name, fallback) {

      function chartPalette() {

      /* ---------------------------------------------------------------- charts */

      function addSeriesCompat(chart, kind, opts) {

          grid: { vertLines: { color: P.grid }, horzLines: { color: P.grid } },
          rightPriceScale: { borderColor: P.border, scaleMargins: { top: 0.12, bottom: 0.12 } },

      /* epoch ms -> chart seconds in the data timezone, forced strictly increasing */
      function chartTimes(list, tz, get) {
        const out = new Array(list.length); let prev = -Infinity;
        for (let i = 0; i < list.length; i++) {
          const t = get(list[i]);
          let s = Math.floor((t + tzOffset(t, tz)) / 1000);
          if (s <= prev) s = prev + 1;
          out[i] = s; prev = s;
        }

      }
      function killChart(id) {
        if (charts[id]) { try { charts[id].chart.remove(); } catch (e) { } delete charts[id]; }
      }
      /* One equity point per bar is more than a screen can show: a year of hourly
         bars is nearly nine thousand of them. Thinning to a couple of thousand keeps
         the shape of the curve, including every high and low, and lets the whole run
         sit on one screen without dragging. */
      function thinSeries(points, keep) {
        const n = points.length;
        if (n <= keep) return points.slice();
        const step = n / keep, out = [];
        for (let b = 0; b < keep; b++) {
          const from = Math.floor(b * step), to = Math.min(n, Math.floor((b + 1) * step));
          if (to <= from) continue;
          let lo = points[from], hi = points[from];
          for (let i = from; i < to; i++) {
            if (points[i].value < lo.value) lo = points[i];
            if (points[i].value > hi.value) hi = points[i];
          }
          const first = points[from], last = points[to - 1];
          const bucket = [first, lo, hi, last].filter((p, i, a) => a.indexOf(p) === i).sort((a, b2) => a.time - b2.time);
          bucket.forEach(p => { if (!out.length || out[out.length - 1].time < p.time) out.push(p); });
        }

      /* Charts are laid out before their card has its final width, so a fit done at

      function fitAll(id) {

      function addFitButton(host, id, label) {

        b.type = 'button';
        b.title = 'Show the whole period';
        b.addEventListener('click', () => fitAll(id));
        host.appendChild(b);
      }
      function chartHost(id, msg) {
        const host = $('#' + id); if (!host) return null;
        if (!lcReady()) { host.innerHTML = '<div class="chart-empty">' + esc(msg || 'Chart library unavailable — every number on this page is still exact.') + '</div>'; return null; }
        return host;
      }
      function mkTip(hostId, tipId) {
        let tip = $('#' + tipId);
        if (!tip) { tip = el('div', 'tip'); tip.id = tipId; $('#' + hostId).appendChild(tip); }
        return tip;
      }
      function placeTip(tip, host, x, y) {
        const w = host.clientWidth;
        let left = x + 16; if (left + 190 > w) left = x - 190;
        tip.style.left = Math.max(4, left) + 'px';
        tip.style.top = Math.max(4, y - 10) + 'px';
        tip.style.display = 'block';
      }

      /* One chart failing must not take the others, or the rest of the page, with it,
         and it must say what went wrong instead of leaving an empty box. */
      function guardChart(id, fn) {
        try { fn(); }
        catch (e) {
          const host = $('#' + id);
          if (host) host.innerHTML = '<div class="chart-empty">This chart could not be drawn: ' +
            esc((e && e.message) || 'unknown error') + '. Every number on this page is still exact.</div>';
          try { console.error('chart ' + id + ' failed:', e); } catch (e2) { }
        }
      }
      function drawDashboardCharts(rec) {
        ['chEquity', 'chDD', 'chDaily', 'chPrice'].forEach(killChart);
        const cfg = rec.cfg, tz = cfg.tz, m = rec.metrics, I = INSTR[cfg.symbol];
        if (!lcReady()) {
          ['chEquity', 'chDD', 'chDaily', 'chPrice'].forEach(id => chartHost(id,
            lcFailed ? 'The chart library could not be downloaded, so the candles cannot be drawn. Every number on this page is still exact.'
              : 'The chart library is still loading.'));
          return;
        }
        /* ---- equity ------------------------------------------------------- */
        guardChart('chEquity', function () {
          const host = chartHost('chEquity'); if (!host) return;
          host.innerHTML = ''; const tip = mkTip('chEquity', 'tipEquity');
          const chart = LC.createChart(host, chartTheme(host.clientHeight || 380, host.clientWidth));
          const P = chartPalette();
          const s = addSeriesCompat(chart, 'area', {
            lineColor: P.acc, topColor: rgba(P.acc, .20),
            bottomColor: rgba(P.acc, 0), lineWidth: 2, priceLineVisible: false
          });
          const ts = chartTimes(rec.equity, tz, e => e.t);
          s.setData(thinSeries(rec.equity.map((e, i) => ({ time: ts[i], value: +e.eq.toFixed(2) })), 1200));
          const base = addSeriesCompat(chart, 'line', { color: chartPalette().border, lineWidth: 1, lineStyle: 2, priceLineVisible: false, crosshairMarkerVisible: false });
          base.setData([{ time: ts[0], value: cfg.balance }, { time: ts[ts.length - 1], value: cfg.balance }]);
          const dayByKey = {}; m.days.forEach(d => dayByKey[d.key] = d);
          const byTime = {}; rec.equity.forEach((e, i) => byTime[ts[i]] = e);
          chart.subscribeCrosshairMove(p => {
            if (!p.point || !p.time || p.point.x < 0) { tip.style.display = 'none'; return; }
            const e = byTime[p.time]; if (!e) { tip.style.display = 'none'; return; }
            const d = dayByKey[dayKey(e.t, tz)];
            tip.innerHTML = '<div class="d">' + fmtDateTime(e.t, tz) + '</div>' +
              'Equity <b>' + money(e.eq, 2) + '</b><br>' +
              'Day P&amp;L <b class="' + (d ? sgn(d.pnl) : '') + '">' + (d ? moneySigned(d.pnl, 2) : '—') + '</b>';
            placeTip(tip, host, p.point.x, p.point.y);

          chart.timeScale().fitContent();
          addFitButton(host, 'chEquity');
          settleFit('chEquity');
          charts.chEquity = { chart: chart };
        });

        /* ---- drawdown ------------------------------------------------------ */
        guardChart('chDD', function () {
          const host = chartHost('chDD'); if (!host) return;
          host.innerHTML = ''; const tip = mkTip('chDD', 'tipDD');
          const chart = LC.createChart(host, chartTheme(host.clientHeight || 300, host.clientWidth));
          const P = chartPalette();
          const s = addSeriesCompat(chart, 'area', {
            lineColor: P.neg, topColor: rgba(P.neg, 0),
            bottomColor: rgba(P.neg, .28), lineWidth: 1, priceLineVisible: false,
            priceFormat: { type: 'custom', formatter: v => v.toFixed(1) + '%' }
          });
          const ts = chartTimes(m.ddSeries, tz, d => d.t);
          s.setData(thinSeries(m.ddSeries.map((d, i) => ({ time: ts[i], value: +d.dd.toFixed(3) })), 1200));
          const byTime = {}; m.ddSeries.forEach((d, i) => byTime[ts[i]] = d);
          chart.subscribeCrosshairMove(p => {
            if (!p.point || !p.time) { tip.style.display = 'none'; return; }
            const d = byTime[p.time]; if (!d) { tip.style.display = 'none'; return; }
            tip.innerHTML = '<div class="d">' + fmtDateTime(d.t, tz) + '</div>Drawdown <b class="neg">' + pct(d.dd, 2) + '</b><br>' +
              'Below peak <b class="neg">' + money(d.dd$, 2) + '</b>';
            placeTip(tip, host, p.point.x, p.point.y);
          });
          chart.timeScale().fitContent();
          addFitButton(host, 'chDD');
          settleFit('chDD');
          charts.chDD = { chart: chart };
        });

        /* ---- daily P&L ----------------------------------------------------- */
        guardChart('chDaily', function () {
          const host = chartHost('chDaily'); if (!host) return;
          host.innerHTML = ''; const tip = mkTip('chDaily', 'tipDaily');
          const chart = LC.createChart(host, Object.assign(chartTheme(host.clientHeight || 190, host.clientWidth), {}));
          const s = addSeriesCompat(chart, 'hist', { priceLineVisible: false, base: 0 });
          const ts = chartTimes(m.days, tz, d => d.t);
          s.setData(m.days.map((d, i) => ({ time: ts[i], value: +d.pnl.toFixed(2), color: d.pnl >= 0 ? rgba(chartPalette().pos, .85) : rgba(chartPalette().neg, .85) })));
          const byTime = {}; m.days.forEach((d, i) => byTime[ts[i]] = d);
          chart.subscribeCrosshairMove(p => {
            if (!p.point || !p.time) { tip.style.display = 'none'; return; }
            const d = byTime[p.time]; if (!d) { tip.style.display = 'none'; return; }
            tip.innerHTML = '<div class="d">' + fmtKeyDate(d.key) + '</div>P&amp;L <b class="' + sgn(d.pnl) + '">' + moneySigned(d.pnl, 2) + '</b><br>' +
              'Equity <b>' + money(d.eq, 2) + '</b>';
            placeTip(tip, host, p.point.x, p.point.y);
          });
          chart.timeScale().fitContent();
          addFitButton(host, 'chDaily');
          settleFit('chDaily');
          charts.chDaily = { chart: chart };
        });

        /* ---- price + trades ------------------------------------------------ */
        guardChart('chPrice', function () {
          const host = chartHost('chPrice'); if (!host) return;
          if (!rec.bars || !rec.bars.length) {
            host.innerHTML = '<div class="chart-empty">Price data for this saved backtest is not loaded, so the candles cannot be drawn. Re-run it to see the chart.</div>';
            return;
          }
          /* draw the candles of whichever timeframe is chosen: the one the trades
             were taken on, or any coarser file that was loaded with it */
          const baseMin = (rec.cfg && rec.cfg.baseTfMin) || tfMinutesOf(rec.bars);
          let bars = rec.bars, drawnTf = tfLabelFor(baseMin);
          const want = priceTf;
          if (want && want !== 'base') {
            const supplied = rec.cfg && rec.cfg.htf && rec.cfg.htf[want];
            const mins = TF_MIN[want];
            if (supplied && supplied.length) {
              const from = rec.bars[0].t, to = rec.bars[rec.bars.length - 1].t;
              bars = supplied.filter(b => b.t >= from - (mins || 60) * 60000 && b.t <= to);
              drawnTf = want;
            } else if (mins && mins > baseMin) {
              bars = resampleBars(rec.bars, mins, tz);
              drawnTf = want;
            }
          }
          host.innerHTML = '';
          const chart = LC.createChart(host, chartTheme(host.clientHeight || 420, host.clientWidth));
          const P = chartPalette();
          const s = addSeriesCompat(chart, 'candle', {
            upColor: P.pos, downColor: P.neg, borderVisible: false,
            wickUpColor: P.pos, wickDownColor: P.neg,
            priceFormat: { type: 'price', precision: I.dp, minMove: Math.pow(10, -I.dp) }
          });
          const ts = chartTimes(bars, tz, b => b.t);
          rec._ct = ts; rec._cbars = bars; rec._ctf = drawnTf;
          s.setData(bars.map((b, i) => ({ time: ts[i], open: b.o, high: b.h, low: b.l, close: b.c })));

          /* a trade's entry, stop and target belong to a moment in time, so they are
             matched to whichever candle of this timeframe contains it */
          const atTime = ms => {
            let lo = 0, hi = bars.length - 1, best = 0;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (bars[mid].t <= ms) { best = mid; lo = mid + 1; } else hi = mid - 1;
            }
            return best;
          };
          const markers = [];
          const cap = Math.min(rec.trades.length, 400);
          for (let k = 0; k < cap; k++) {
            const t = rec.trades[k];
            const ei = atTime(t.entryT), xi = atTime(t.exitT);
            if (ts[ei] == null || ts[xi] == null) continue;
            markers.push({
              time: ts[ei], position: t.dir === 1 ? 'belowBar' : 'aboveBar',
              color: t.dir === 1 ? P.pos : P.neg, shape: t.dir === 1 ? 'arrowUp' : 'arrowDown',
              text: (t.dir === 1 ? 'B' : 'S') + t.n
            });
            markers.push({
              time: ts[xi], position: t.dir === 1 ? 'aboveBar' : 'belowBar',
              color: P.faint, shape: 'circle', text: 'x' + t.n
            });
          }
          markers.sort((a, b) => a.time - b.time);
          setMarkersCompat(s, markers);
          chart.timeScale().fitContent();
          charts.chPrice = { chart: chart, series: s, lines: [], bars: bars, ts: ts, atTime: atTime, host: host };
          addFitButton(host, 'chPrice');
          settleFit('chPrice');
          if (rec.trades.length > cap)
            $('#tradeNav').textContent = 'showing markers for the first ' + cap + ' of ' + rec.trades.length + ' trades';
          if ($('#tfDrawn')) $('#tfDrawn').textContent = drawnTf;
        });
      }

      /* The trade log lives on its own page, so a click there has to bring the
         dashboard up first and wait for the candles to be drawn before marking
         the trade on them. */
      function showTradeOnChart(n) {
        if (charts.chPrice && charts.chPrice.chart) { focusTrade(n); return; }
        if (state.view !== 'dashboard') {
          switchView('dashboard');
          setTimeout(() => {
            if (charts.chPrice && charts.chPrice.chart) focusTrade(n);
            else toast('The candles could not be drawn for this run, so the trade cannot be marked on a chart.', 'warn');
          }, 120);
          return;
        }
        focusTrade(n);
      }
      function focusTrade(n) {
        const rec = state.current; if (!rec) return;
        const I = curInstr();
        const t = rec.trades.filter(x => x.n === (n && n.n ? n.n : n))[0];
        const c = charts.chPrice;
        if (!t || !c || !c.chart) { toast('The price chart is not drawn, so a trade cannot be shown on it.', 'warn'); return; }
        const ts = c.ts, ei = c.atTime(t.entryT), xi = c.atTime(t.exitT);
        if (ts[ei] == null || ts[xi] == null) return;

        /* clear the previous drawing */
        (c.lines || []).forEach(l => { try { c.series.removePriceLine(l); } catch (e) { } });
        c.lines = [];
        const P = chartPalette();
        const add = (price, color, title) => {
          if (price == null) return;
          try {
            c.lines.push(c.series.createPriceLine({
              price: price, color: color, lineWidth: 1, lineStyle: 2,
              axisLabelVisible: true, title: title
            }));
          } catch (e) { }
        };
        positionBox(c, t);

        const pad = Math.max(6, Math.round((xi - ei) * 0.6));
        const from = ts[Math.max(0, ei - pad)], to = ts[Math.min(ts.length - 1, xi + pad)];
        try { c.chart.timeScale().setVisibleRange({ from: from, to: to }); } catch (e) { }
        $('#tradeNav').innerHTML = 'Trade #' + t.n + ' · ' + (t.dir === 1 ? 'BUY' : 'SELL') + ' ' + px(t.entry, I.dp) + ' → ' + px(t.exit, I.dp) +
          ' · <b class="' + sgn(t.net) + '">' + moneySigned(t.net, 2) + '</b> · ' + esc(t.reason) +
          ' <button class="mini" id="tradeClear">clear</button> <button class="mini" id="tradeFit">show the whole period</button>';
        const cl = $('#tradeClear'), ft = $('#tradeFit');
        if (cl) cl.addEventListener('click', () => { clearPosition(c); (c.lines || []).forEach(l => { try { c.series.removePriceLine(l); } catch (e) { } }); c.lines = []; $('#tradeNav').textContent = ''; });
        if (ft) ft.addEventListener('click', () => { try { c.chart.timeScale().fitContent(); } catch (e) { } });
        const target = $('#sec-price') || $('#chPrice');
        if (target && target.scrollIntoView) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => { try { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { } }, 160);
        }
      }

      /* A TradingView-style position box drawn over the chart: the run from entry to
         exit, the reward zone shaded towards the target and the risk zone towards the
         stop. It is an overlay, so it is redrawn whenever the chart is moved. */
      function clearPosition(c) {
        if (c && c.posEl && c.posEl.parentNode) c.posEl.parentNode.removeChild(c.posEl);
        if (c && c.posRO) { try { c.posRO.disconnect(); } catch (e) { } c.posRO = null; }
        if (c) c.posEl = null, c.posTrade = null;
        if (c && c.posHandler) { try { c.chart.timeScale().unsubscribeVisibleTimeRangeChange(c.posHandler); } catch (e) { } c.posHandler = null; }
      }
      function curInstr() {
        const sym = (state.current && state.current.cfg && state.current.cfg.symbol) || state.symbol;
        return INSTR[sym] || { dp: 5, n: sym || '' };
      }
      function positionBox(c, t) {
        const I = curInstr();
        clearPosition(c);
        const host = c.host; if (!host) return;
        const long = t.dir === 1;
        const box = el('div', 'posbox ' + (long ? 'long' : 'short'));
        box.innerHTML =
          '<div class="pz reward"><b class="lvl"></b><b class="amt"></b></div>' +
          '<div class="pz risk"><b class="lvl"></b><b class="amt"></b></div>' +
          '<div class="pz entry"><b class="lvl"></b></div>' +
          '<div class="ptag"></div>';
        host.appendChild(box);
        c.posEl = box; c.posTrade = t;

        const draw = () => {
          try {
            const ts = c.ts, ei = c.atTime(t.entryT), xi = c.atTime(t.exitT);
            const H = host.clientHeight || 360, W = host.clientWidth || 600;
            let x1 = c.chart.timeScale().timeToCoordinate(ts[ei]);
            let x2 = c.chart.timeScale().timeToCoordinate(ts[xi]);
            if (x1 == null && x2 == null) { box.style.display = 'none'; return; }
            if (x1 == null) x1 = 0;
            if (x2 == null) x2 = W;
            const clampY = v => v == null ? null : Math.max(-40, Math.min(H + 40, v));
            const yE = clampY(c.series.priceToCoordinate(t.entry));
            if (yE == null) { box.style.display = 'none'; return; }
            const yT = t.tp != null ? clampY(c.series.priceToCoordinate(t.tp)) : null;
            const yS = t.sl != null ? clampY(c.series.priceToCoordinate(t.sl)) : null;

            box.style.display = 'block';
            const left = Math.min(x1, x2), width = Math.max(26, Math.abs(x2 - x1));
            box.style.left = left + 'px'; box.style.width = width + 'px';

            const risk = (t.sl != null) ? Math.abs(t.entry - t.sl) : null;
            const zone = (elSel, yA, yB, priceTxt, amountTxt) => {
              const z = box.querySelector(elSel);
              if (yA == null || yB == null) { z.style.display = 'none'; return; }
              z.style.display = 'block';
              z.style.top = Math.min(yA, yB) + 'px';
              z.style.height = Math.max(2, Math.abs(yB - yA)) + 'px';
              z.querySelector('.lvl').textContent = priceTxt;
              z.querySelector('.amt').textContent = amountTxt || '';
            };
            const rr = (risk && t.tp != null) ? (Math.abs(t.tp - t.entry) / risk) : null;
            zone('.reward', yE, yT, t.tp != null ? ('Target ' + px(t.tp, I.dp)) : '',
              rr != null ? (num(rr, 1) + 'R') : '');
            zone('.risk', yE, yS, t.sl != null ? ('Stop ' + px(t.sl, I.dp)) : '', risk != null ? '1R' : '');
            const ent = box.querySelector('.entry');
            ent.style.top = yE + 'px';
            ent.querySelector('.lvl').textContent = 'Entry ' + px(t.entry, I.dp);

            const tag = box.querySelector('.ptag');
            tag.textContent = (long ? 'LONG' : 'SHORT') + ' #' + t.n + ' · ' + moneySigned(t.net, 2);
            tag.className = 'ptag ' + (t.net >= 0 ? 'win' : 'lose');
            tag.style.top = Math.max(2, Math.min(H - 20, yE - 24)) + 'px';
          } catch (e) { box.style.display = 'none'; }
        };
        draw();
        /* the chart lays out asynchronously, so draw again once it has settled */
        setTimeout(draw, 60); setTimeout(draw, 240);
        c.posHandler = draw;
        try { c.chart.timeScale().subscribeVisibleTimeRangeChange(draw); } catch (e) { }
        if (window.ResizeObserver && !c.posRO) {
          try { c.posRO = new ResizeObserver(() => draw()); c.posRO.observe(host); } catch (e) { }
        }
      }



      /* resize */
      let rsTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(rsTimer);
        rsTimer = setTimeout(() => {
          Object.keys(charts).forEach(id => {
            const host = $('#' + id); if (!host || !charts[id]) return;
            try { charts[id].chart.resize(host.clientWidth, host.clientHeight); } catch (e) { }
          });
        }, 120);
      });

      /* ===========================================================================
         9. The year view.
      
         One page that answers: how did each day go, each month, each weekday and
         each hour of the day, for a year you pick. Everything here is worked out
         for that year alone, so a percentage is against the balance the year
         opened with rather than the balance the whole run opened with.
         ========================================================================= */
      let yearSel = null, yearMode = 'money', yearMonth = null, yearDay = null;

      function yearsIn(rec) {
        const out = [], seen = {};
        (rec.metrics.days || []).forEach(d => { const y = d.key.slice(0, 4); if (!seen[y]) { seen[y] = 1; out.push(y); } });
        return out;
      }
      /* every figure on the page, for one year */
      function yearStats(rec, year) {
        const tz = rec.cfg.tz, m = rec.metrics;
        const days = (m.days || []).filter(d => d.key.slice(0, 4) === year);
        const trades = (rec.trades || []).filter(t => dayKey(t.exitT, tz).slice(0, 4) === year);
        const entryYear = (rec.trades || []).filter(t => dayKey(t.entryT, tz).slice(0, 4) === year);
        const startEq = days.length ? days[0].eq - days[0].pnl : rec.cfg.balance;
        const pnl = days.reduce((a, d) => a + d.pnl, 0);

        const months = {}, mKeys = [];
        days.forEach(d => {
          const k = d.key.slice(0, 7);
          if (!months[k]) { months[k] = { key: k, pnl: 0, n: 0, days: 0, green: 0, red: 0, startEq: null }; mKeys.push(k); }
          const mm = months[k];
          if (mm.startEq === null) mm.startEq = d.eq - d.pnl;
          mm.pnl += d.pnl; mm.n += d.n;
          if (d.n) { mm.days++; if (d.pnl > 0) mm.green++; else if (d.pnl < 0) mm.red++; }
        });
        const monthList = mKeys.map(k => {
          const mm = months[k];
          return Object.assign(mm, { ret: mm.startEq > 0 ? mm.pnl / mm.startEq * 100 : 0 });
        });

        const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const wd = WD.map((n, i) => ({ i: i, name: n, pnl: 0, trades: 0, wins: 0, days: 0, green: 0, red: 0 }));
        days.forEach(d => {
          const a = d.key.split('-').map(Number);
          const w = wd[new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay()];
          w.pnl += d.pnl;
          if (d.n) { w.days++; if (d.pnl > 0) w.green++; else if (d.pnl < 0) w.red++; }
        });
        entryYear.forEach(t => {
          const a = dayKey(t.entryT, tz).split('-').map(Number);
          const w = wd[new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay()];
          w.trades++; if (t.net > 0) w.wins++;
        });
        wd.forEach(w => {
          w.pct = startEq > 0 ? w.pnl / startEq * 100 : 0;
          w.avgPerDay = w.days ? w.pnl / w.days : 0;
          w.winRate = w.trades ? w.wins / w.trades * 100 : 0;
        });

        const hours = [];
        for (let h = 0; h < 24; h++) hours.push({ h: h, pnl: 0, trades: 0, wins: 0 });
        entryYear.forEach(t => {
          const b = hours[hourOf(t.entryT, tz)];
          b.pnl += t.net; b.trades++; if (t.net > 0) b.wins++;
        });
        hours.forEach(b => {
          b.pct = startEq > 0 ? b.pnl / startEq * 100 : 0;
          b.winRate = b.trades ? b.wins / b.trades * 100 : 0;
        });

        const traded = days.filter(d => d.n > 0);
        const byPnl = arr => arr.slice().sort((a, b) => b.pnl - a.pnl);
        const wdT = wd.filter(w => w.trades > 0), hrT = hours.filter(h => h.trades > 0);
        return {
          year: year, days: days, trades: trades, startEq: startEq, pnl: pnl,
          ret: startEq > 0 ? pnl / startEq * 100 : 0,
          tradingDays: traded.length,
          greenDays: traded.filter(d => d.pnl > 0).length,
          redDays: traded.filter(d => d.pnl < 0).length,
          months: monthList,
          bestMonth: monthList.length ? byPnl(monthList)[0] : null,
          worstMonth: monthList.length ? byPnl(monthList)[monthList.length - 1] : null,
          bestDay: traded.length ? byPnl(traded)[0] : null,
          worstDay: traded.length ? byPnl(traded)[traded.length - 1] : null,
          weekdays: wd,
          bestWeekday: wdT.length ? byPnl(wdT)[0] : null,
          worstWeekday: wdT.length ? byPnl(wdT)[wdT.length - 1] : null,
          hours: hours,
          bestHour: hrT.length ? byPnl(hrT)[0] : null,
          worstHour: hrT.length ? byPnl(hrT)[hrT.length - 1] : null
        };
      }
      const yv = (money$, pct$) => yearMode === 'money' ? money$ : pct$;
      function yMoney(v) { return moneySigned(v, 2); }
      function yPct(v) { return pctSigned(v, 2); }
      function yBoth(v, p) { return yearMode === 'money' ? moneySigned(v, 2) : pctSigned(p, 2); }
      function hourLabel(h) { return String(h).padStart(2, '0') + ':00'; }

      function renderYearView() {
        const host = $('#view-year');
        const rec = state.current;
        if (!rec) {
          host.innerHTML = '<div class="page-head"><div><h1>Year</h1><p>Every day, month, weekday and hour of a chosen year.</p></div></div>' +
            emptyState('No backtest loaded');
          return;
        }
        const tz = rec.cfg.tz;
        const years = yearsIn(rec);

    ${kpi('Worst month', Y.worstMonth ? moneySigned(Y.worstMonth.pnl, 2) : '—',
            Y.worstMonth ? monthLabel(Y.worstMonth.key) + ' · ' + pctSigned(Y.worstMonth.ret, 2) : '', 'neg')}
    ${kpi('Best day', Y.bestDay ? moneySigned(Y.bestDay.pnl, 2) : '—',
              Y.bestDay ? fmtKeyDate(Y.bestDay.key) + ' · ' + pctSigned(Y.bestDay.ret * 100, 2) + ' · ' + Y.bestDay.n + ' trades' : '', 'pos')}

`;

      async function fsCall(method, url, body) {
        if (!account.user || !account.user.getIdToken) { const e = new Error('You are not signed in.'); e.code = 'unauthenticated'; throw e; }
        const token = await account.user.getIdToken();
        const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, FS_TIMEOUT);
        let res;
        try {
          res = await fetch(url, {
            method: method,
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined,
            signal: ctrl ? ctrl.signal : undefined
          });
        } catch (e) {
          const err = new Error((e && e.name === 'AbortError')
            ? 'Firestore did not answer within ' + (FS_TIMEOUT / 1000) + ' seconds'
            : 'the request never reached Google \u2014 something between this page and firestore.googleapis.com is blocking it');
          err.code = 'unavailable';
          throw err;
        } finally { clearTimeout(timer); }
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) {
          const g = (data && data.error) || {};
          const err = new Error(g.message || ('Firestore answered with status ' + res.status));
          err.code = String(g.status || '').toLowerCase().replace(/_/g, '-') || ('http-' + res.status);
          err.httpStatus = res.status;
          throw err;
        }
        return data || {};
      }
      /* "no such record" and "no such database" are both 404s; only the first is harmless */
      function isMissingDoc(e) { return e && e.httpStatus === 404 && !/database/i.test(e.message || ''); }

      async function cloudPullAll(db, uid) {
        const plain = {}, parts = {}, manifests = {};
        let pageToken = '';
        do {
          const data = await fsCall('GET', fsRoot() + fsPath(uid) + '?pageSize=25' +
                                    (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : ''));
          (data.documents || []).forEach(d => {
            const v = fromFields(d.fields);
            if (v.part != null) (parts[v.key] = parts[v.key] || [])[v.part] = v.v;
            else if (v.chunks) manifests[v.key] = v.chunks;
            else if (v.key) plain[v.key] = v.v;
          });
          pageToken = data.nextPageToken || '';
        } while (pageToken);
        Object.keys(manifests).forEach(k => {
          const arr = parts[k] || [];
          if (arr.length === manifests[k] && arr.every(x => typeof x === 'string')) plain[k] = arr.join('');
        });
        return plain;
      }
      async function cloudPut(db, uid, key, value) {
        const id = safeId(key);
        if (value.length <= CHUNK) {
          await fsCall('PATCH', fsRoot() + fsPath(uid, id), { fields: toFields({ key: key, v: value, t: Date.now() }) });
          return;
        }
        /* parts first, manifest last, so a reader never finds a manifest without its parts */
        const n = Math.ceil(value.length / CHUNK);
        for (let i = 0; i < n; i++) {
          await fsCall('PATCH', fsRoot() + fsPath(uid, id + '#' + i),
            { fields: toFields({ key: key, part: i, v: value.slice(i * CHUNK, (i + 1) * CHUNK), t: Date.now() }) });
        }
        await fsCall('PATCH', fsRoot() + fsPath(uid, id), { fields: toFields({ key: key, chunks: n, t: Date.now() }) });
      }
      async function cloudDel(db, uid, key) {
        const id = safeId(key);
        let n = 0;
        try {
          const d = await fsCall('GET', fsRoot() + fsPath(uid, id));
          n = fromFields(d.fields).chunks || 0;
        } catch (e) { if (!isMissingDoc(e)) throw e; }
        await fsCall('DELETE', fsRoot() + fsPath(uid, id));
        for (let i = 0; i < n; i++) await fsCall('DELETE', fsRoot() + fsPath(uid, id + '#' + i));
      }
      function safeId(key) { return key.replace(/\//g, '_'); }

      /* ---- keeping the browser and the account in step ---------------------- */
      function localKeys() { return LS.keys().filter(k => k.indexOf(SYNC_PREFIX) === 0 && !NEVER_SYNC[k]); }

      /* first sign-in keeps what was already here: anything in the account wins,
         anything only in this browser is added to the account */
      async function mergeOnSignIn(db, uid, ctl) {
        const cloud = await cloudPullAll(db, uid);
        if (ctl && ctl.cancelled) return { downloaded: 0, uploaded: 0, changed: 0 };
        const extra = [];
        /* the list of runs: keep the runs from both sides rather than letting one overwrite the other */
        try {
          const cl = cloud[K_HIST], lo = localStorage.getItem(K_HIST);
          if (cl != null && lo != null && cl !== lo) {
            const seen = {}, merged = [];
            JSON.parse(cl).concat(JSON.parse(lo)).forEach(h => { if (h && h.id && !seen[h.id]) { seen[h.id] = 1; merged.push(h); } });
            merged.sort((a, b) => (b.ranAt || 0) - (a.ranAt || 0));
            cloud[K_HIST] = JSON.stringify(merged.slice(0, 50));
            if (cloud[K_HIST] !== cl) extra.push(K_HIST);
          }
        } catch (e) { }
        const local = localKeys();
        const toUpload = local.filter(k => !(k in cloud));
        let changed = 0;
        account.pulling = true;
        try {
          Object.keys(cloud).forEach(k => {
            if (NEVER_SYNC[k]) return;
            try { if (localStorage.getItem(k) !== cloud[k]) { localStorage.setItem(k, cloud[k]); changed++; } } catch (e) { }
          });
        } finally { account.pulling = false; }
        for (let i = 0; i < extra.length; i++) { if (ctl && ctl.cancelled) break; await cloudPut(db, uid, extra[i], cloud[extra[i]]); }
        for (let i = 0; i < toUpload.length; i++) {
          if (ctl && ctl.cancelled) break;
          const k = toUpload[i], v = localStorage.getItem(k);
          if (v != null) await cloudPut(db, uid, k, v);
        }
        return { downloaded: Object.keys(cloud).length, uploaded: toUpload.length, changed: changed };
      }

      function queueSync(key, op) {
        if (!account.user || !account.db || account.pulling || account.paused) return;
        if (key.indexOf(SYNC_PREFIX) !== 0 || NEVER_SYNC[key]) return;
        account.queue[key] = op;
        clearTimeout(account.timer);
        account.timer = setTimeout(flushSync, 700);
        setAccountStatus('Saving…');
      }
      async function flushSync() {
        if (!account.user || !account.db) return;
        const q = account.queue; account.queue = {};
        const keys = Object.keys(q);
        account.inflight = keys.length;
        try {
          for (let i = 0; i < keys.length; i++) {
            const k = keys[i];
            if (q[k] === 'del') await cloudDel(account.db, account.user.uid, k);
            else { const v = localStorage.getItem(k); if (v != null) await cloudPut(account.db, account.user.uid, k, v); }
          }
          account.inflight = 0; account.detail = ''; account.lastSaved = Date.now();
          setAccountStatus('Saved to your account');
        } catch (e) {
          account.inflight = 0;
          keys.forEach(k => { if (!(k in account.queue)) account.queue[k] = q[k]; });
          account.detail = syncErrorText(e);
          setAccountStatus('Not saving \u2014 see Settings & data');
          clearTimeout(account.timer);
          account.timer = setTimeout(flushSync, 8000);
        }
      }
      /* every write to local storage is mirrored to the account */
      (function hookStorage() {
        const set = LS.set, del = LS.del;
        LS.set = function (k, v) { const ok = set.call(LS, k, v); if (ok) queueSync(k, 'set'); return ok; };
        LS.del = function (k) { del.call(LS, k); queueSync(k, 'del'); };
      })();

      function clearLocalData() {
        localKeys().forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
      }


      /* =====================================================================
         Plans and payment.

         Free covers everything on the demo prices, including writing your own
         strategy in plain English. Running a strategy on price files you
         upload is the paid part.

         Stripe takes the payment and the official Stripe extension for
         Firebase records the subscription under the person's own id, where
         only they can read it and only Stripe's webhook can write it. This
         page reads that record: nobody can hand themselves a subscription by
         editing their saved data.

         Being honest about the limit: the backtester runs in the browser, so
         somebody who edits the page in developer tools can switch the lock
         off on their own machine. Really enforcing it means running the
         engine on a server. This stops ordinary use, not a determined
         developer.
         ===================================================================== */
      const STRIPE_CFG = {
        /* ---------------------------------------------------------------
           TWO WAYS TO CHARGE. Fill in one.

           (A) No servers: a Stripe Payment Link. Create the link in Stripe
               (Payments > Payment Links), set it to a recurring price, and
               under "After payment" choose "Redirect customers to your
               website" with your address plus ?pro=1&session_id={CHECKOUT_SESSION_ID}
               Paste the link below.

               Honest about the catch: nothing can verify the payment,
               because there is no server to ask Stripe. Coming back from
               the link unlocks the account, so somebody who edits their own
               browser storage could unlock it without paying. Every payment
               is tagged with the person's account id (client_reference_id),
               so you can match payments to accounts in the Stripe dashboard,
               and cancellations will not lock anyone out by themselves:
               reconcile in Stripe, or move to (B).

           (B) Verified: the official Stripe extension for Firebase writes
               each subscription into the person's own Firestore record,
               which only Stripe's webhook may write. Fill in priceId (and
               optionally productId) instead of paymentLink. Nothing else
               changes.
           --------------------------------------------------------------- */
        paymentLink: '',                   /* (A) https://buy.stripe.com/... (monthly) */
        paymentLinkYearly: '',             /* (A) optional: a second link billed yearly */
        priceLabelYearly: '',              /* e.g. '$90 / year' */
        yearlyNote: 'two months free',     /* the saving shown on the yearly option */
        portalLink: '',                    /* (A) optional: your Stripe customer-portal link */
        linkGrantDays: 0,                  /* (A) 0 = until cancelled; or e.g. 35 to re-check monthly */

        priceId: '',                       /* (B) price_... from your Stripe product */
        productId: '',                     /* (B) prod_... (optional: shows the real price) */

        priceLabel: '$9 / month',          /* shown until a real price is read from Stripe */
        trialNote: '',                     /* e.g. '7 days free' if your price has a trial */
        region: 'us-central1'              /* (B) where the extension's functions live */
      };
      const K_PRO = 'ab:pro';              /* the unlock, saved with everything else in the account */
      const PLAN = { pro:false, status:'', until:0, price:null, loading:false, checking:false, period:'month' };
      function payMode(){
        if (STRIPE_CFG.priceId && fbConfigured()) return 'extension';   /* verified by Stripe's webhook */
        if (STRIPE_CFG.paymentLink) return 'link';                      /* no server; taken on trust */
        return '';
      }

      function proActive(){ return !!PLAN.pro; }

      /* what the subscription buys: real market history. Demo prices are free. */
      function needsPro(what){

        if (what === 'realData') return DATA_LIBRARY.requiresPro && stripeReady() && !proActive();
        return false;
      }

      async function refreshPlan(){
        PLAN.pro = false; PLAN.status = ''; PLAN.until = 0;
        if (payMode() === 'link') {
          const r = LS.get(K_PRO, null);
          if (r && r.at) {
            const days = +STRIPE_CFG.linkGrantDays || 0;
            const until = days ? r.at + days * 86400000 : 0;
            if (!until || until > Date.now()) { PLAN.pro = true; PLAN.status = 'link'; PLAN.until = until; }
          }
          renderPlanBits();
          return;
        }
        if(!account.user || !fbConfigured()) { renderPlanBits(); return; }
        try{
          /* Stripe's extension writes the subscription here; the rules make it read-only to you */
          const d = await fsCall('GET', fsRoot() + '/customers/' + encodeURIComponent(account.user.uid) + '/subscriptions?pageSize=20');
          let best = null;
          (d.documents || []).forEach(doc => {
            const v = fromFields(doc.fields);
            if (['active','trialing','past_due'].indexOf(v.status) >= 0) best = v;
          });
          if (best) {
            PLAN.pro = true; PLAN.status = best.status;

        }catch(e){

      function doc_ts(v){

          if (v.unit_amount != null){
            const cur = String(v.currency || 'usd').toUpperCase();
            const sym = { USD:'$', EUR:'\u20AC', GBP:'\u00A3', AUD:'A$', CAD:'C$', INR:'\u20B9' }[cur] || (cur + ' ');
            const amt = (v.unit_amount / 100);

      /* ---- going to Stripe ------------------------------------------------ */
      async function startCheckout(btn){

          let url = (PLAN.period === 'year' && STRIPE_CFG.paymentLinkYearly) ? STRIPE_CFG.paymentLinkYearly : STRIPE_CFG.paymentLink;
          const q = [];
          if (account.user) {
            q.push('client_reference_id=' + encodeURIComponent(account.user.uid));
            if (account.user.email) q.push('prefilled_email=' + encodeURIComponent(account.user.email));
          }
          if (q.length) url += (url.indexOf('?') >= 0 ? '&' : '?') + q.join('&');

        if (!account.user) { renderGate(); return; }
        if (!stripeReady()) { toast('Payments are not switched on for this site yet.','warn'); return; }
        const setBusy = t => { if (btn){ btn.disabled = !!t; btn.textContent = t || 'Upgrade'; } };
        setBusy('Opening Stripe\u2026');

                                 allow_promotion_codes: true, t: Date.now() }) });
          const name = made.name || '';
          const id = name.split('/').pop();
          /* the extension answers by writing the Stripe link back onto the same record */
          for (let i = 0; i < 30; i++){
            await new Promise(r => setTimeout(r, 1000));
            const d = await fsCall('GET', fsRoot() + '/customers/' + encodeURIComponent(uid) + '/checkout_sessions/' + encodeURIComponent(id));
            const v = fromFields(d.fields || {});
            if (v.error) throw new Error(v.error);
            if (v.url) { location.assign(v.url); return; }

        }catch(e){
          setBusy('');
          const m = (e && e.message) || 'something went wrong';
          toast(/PERMISSION|insufficient/i.test(m)
            ? 'Firestore refused to start the checkout. Publish the payment rules from firestore.rules.'
            : 'Could not open Stripe: ' + m, 'bad');

      /* =====================================================================
         The market library: price files you host, so nobody has to upload
         anything. Point DATA_LIBRARY.url at a small JSON file listing what
         you serve, split by year, and the page downloads only the years a
         run actually needs.

         Before you publish data, check you are allowed to: most historical
         price data is licensed to you rather than for redistribution.
         ===================================================================== */
      const DATA_LIBRARY = {
        url: '',                 /* e.g. 'data/library.json' on your own site */
        requiresPro: true,       /* false makes real prices free for everyone */
        label: 'Real market data'
      };
      const LIB = { sets:null, err:'', loading:false, busy:'', cache:{} };

      function libOn(){ return !!DATA_LIBRARY.url; }
      async function libLoad(force){
        /* a failed read is not final: the network may have been down for a moment */
        if (force || LIB.err) { LIB.sets = null; LIB.err = ''; }
        if (!libOn() || LIB.sets || LIB.loading) return LIB.sets;
        LIB.loading = true; LIB.err = '';
        try{
          const res = await fetch(DATA_LIBRARY.url, { cache: 'no-cache' });
          if (!res.ok) throw new Error('the list answered ' + res.status);
          const j = await res.json();
          const sets = (j.sets || j.datasets || []).filter(x => x && x.symbol && x.tf);
          sets.forEach(x => {
            x.tfMin = TF_MIN[x.tf] || tfMinutesOf([]) || 60;
            x.files = (x.files || []).map(f => Object.assign({}, f, {
              fromMs: Date.parse(f.from + 'T00:00:00Z'),
              toMs:   Date.parse((f.to || f.from) + 'T23:59:59Z')
            })).sort((a, b) => a.fromMs - b.fromMs);
            x.fromMs = x.files.length ? x.files[0].fromMs : Date.parse((x.from || '') + 'T00:00:00Z');
            x.toMs   = x.files.length ? x.files[x.files.length - 1].toMs : Date.parse((x.to || '') + 'T23:59:59Z');
          });
          LIB.sets = sets;
          LIB.tries = 0;
          LIB.base = j.base || '';
          LIB.note = j.note || '';
        }catch(e){
          LIB.err = (e && e.message) || 'could not be reached';
          LIB.sets = [];
        }
        LIB.loading = false;
        return LIB.sets;
      }
      function libSymbols(){
        const out = [];
        (LIB.sets || []).forEach(x => { if (INSTR[x.symbol] && out.indexOf(x.symbol) < 0) out.push(x.symbol); });
        return out;
      }
      function libSetsFor(sym){ return (LIB.sets || []).filter(x => x.symbol === sym).sort((a, b) => a.tfMin - b.tfMin); }
      /* file names in the list are relative to the list itself */
      function libUrl(u){
        if (/^https?:/i.test(u)) return u;
        try { return new URL((LIB.base || '') + u, new URL(DATA_LIBRARY.url, location.href)).href; }
        catch (e) { return (LIB.base || '') + u; }
      }

      /* download only the pieces covering the window being tested */
      async function libFetchSet(set, fromMs, toMs, onStep){
        const want = set.files.filter(f => f.toMs >= fromMs && f.fromMs <= toMs);
        const use = want.length ? want : set.files;
        if (!use.length) throw new Error('that set lists no files');
        let text = '';
        for (let i = 0; i < use.length; i++){
          const u = libUrl(use[i].url);
          if (onStep) onStep(i + 1, use.length, use[i]);
          if (LIB.cache[u]) { text += (text ? '\n' : '') + LIB.cache[u]; continue; }
          const res = await fetch(u);
          if (!res.ok) throw new Error(u.split('/').pop() + ' answered ' + res.status);
          const body = await res.text();
          LIB.cache[u] = body;
          text += (text ? '\n' : '') + body;
        }
        return text;
      }
      /* turn the chosen sets into the same kind of price data an upload makes */
      async function libUse(sym, tfs, fromMs, toMs, onStep){
        const chosen = libSetsFor(sym).filter(x => tfs.indexOf(x.tf) >= 0);
        if (!chosen.length) throw new Error('pick at least one timeframe');
        const made = [];
        for (let i = 0; i < chosen.length; i++){
          const set = chosen[i];
          const text = await libFetchSet(set, fromMs, toMs, (n, of, f) =>
            onStep && onStep(set.tf + ' \u00b7 ' + (f.label || (f.from || '').slice(0, 4)) + ' (' + n + ' of ' + of + ')'));
          const res = parseCSV(text, set.tz || 'UTC', 'auto');
          if (!res.bars.length) throw new Error('no candles could be read from the ' + set.tf + ' files');
          const id = 'lib:' + sym + ':' + set.tf;
          dsSave({ id: id, name: INSTR[sym].n + ' ' + set.tf + ' (library)', symbol: sym,
                   tz: set.tz || 'UTC', uploaded: Date.now(), tf: set.tf, tfMin: set.tfMin,
                   bars: res.bars, source: 'library' });
          made.push(id);
        }
        state.symbol = sym;
        state.datasetIds = made;
        /* the source stays 'lib': the files came from the site, not from the person */
        return made;
      }

        const ctx=cv && cv.getContext ? cv.getContext('2d') : null;

        /* a candlestick chart that streams across the background */
        let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
        const candles=[]; let px=100;
        const add=()=>{ const o=px; const mv=(rnd()-.49)*2.4 + Math.sin(candles.length/17)*0.55; const c=o+mv;
          const h=Math.max(o,c)+rnd()*1.2, l=Math.min(o,c)-rnd()*1.2; px=c; candles.push({o,h,l,c}); };
        for(let i=0;i<220;i++) add();
        let shift=0, lo=null, hi=null, last=0, W=0, H=0, dpr=1;
        const size=()=>{ if(!cv) return; dpr=Math.min(1.5, window.devicePixelRatio||1);
          W=cv.clientWidth||window.innerWidth; H=cv.clientHeight||window.innerHeight;
          cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); };
        size(); window.addEventListener('resize', size);
        const draw=(t)=>{
          if(!document.body.contains(gate)){ GX.on=false; window.removeEventListener('resize', size); return; }
          GX.raf=requestAnimationFrame(draw);
          if(!ctx || document.hidden || t-last<33) return;
          last=t;
          const vis=Math.max(60, Math.round(W/13)), cw=W/vis;
          if(!reduced){ shift+=0.35; if(shift>=cw){ shift-=cw; candles.shift(); add(); } }
          const view=candles.slice(-vis-2);
          let mn=Infinity,mx=-Infinity; view.forEach(k=>{ if(k.l<mn) mn=k.l; if(k.h>mx) mx=k.h; });
          lo = lo==null? mn : lo+(mn-lo)*0.05; hi = hi==null? mx : hi+(mx-hi)*0.05;
          const top=H*0.18, bot=H*0.88, y=v=>bot-(v-lo)/Math.max(1e-6,hi-lo)*(bot-top);
          ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
          /* moving average, glowing */
          ctx.beginPath(); let ma=null;
          view.forEach((k,i)=>{ ma = ma==null? k.c : ma+(k.c-ma)*0.12; const xx=i*cw-shift+cw/2; i?ctx.lineTo(xx,y(ma)):ctx.moveTo(xx,y(ma)); });
          ctx.strokeStyle='rgba(62,197,224,.55)'; ctx.lineWidth=1.6; ctx.shadowColor='rgba(62,197,224,.8)'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0;
          view.forEach((k,i)=>{
            const xx=i*cw-shift, up=k.c>=k.o;
            ctx.strokeStyle= up?'rgba(95,211,160,.55)':'rgba(240,138,116,.5)';
            ctx.fillStyle  = up?'rgba(95,211,160,.32)':'rgba(240,138,116,.30)';
            ctx.beginPath(); ctx.moveTo(xx+cw/2,y(k.h)); ctx.lineTo(xx+cw/2,y(k.l)); ctx.lineWidth=1; ctx.stroke();
            const b1=y(Math.max(k.o,k.c)), b2=y(Math.min(k.o,k.c));
            ctx.fillRect(xx+cw*0.22,b1,cw*0.56,Math.max(1.2,b2-b1));
          });
        };
        GX.raf=requestAnimationFrame(draw);

        /* scroll: parallax layers, the timeline line, and reveals */
        const onScroll=()=>{
          const sy=gate.scrollTop;
          gate.style.setProperty('--sy', sy);
          const st=gate.querySelector('#gxSteps');
          if(st){ const r=st.getBoundingClientRect(), vh=gate.clientHeight;
            const p=Math.max(0,Math.min(1,(vh*0.75-r.top)/Math.max(1,r.height)));
            st.style.setProperty('--p', p.toFixed(3));
            [...st.children].forEach((li,i)=> li.classList.toggle('lit', p >= (i+0.3)/st.children.length)); }
        };
        gate.addEventListener('scroll', ()=>requestAnimationFrame(onScroll), {passive:true});
        onScroll();

        const reveal=el=>{
          el.classList.add('in');
          el.querySelectorAll('[data-v]').forEach(countUp);
          if(el.id==='gxPreview') el.classList.add('drawn');
        };
        const items=[...gate.querySelectorAll('.rv')];
        items.forEach((el,i)=>{ const sib=[...el.parentNode.children].filter(x=>x.classList&&x.classList.contains('rv')); el.style.setProperty('--d', (sib.indexOf(el)%6)*70+'ms'); });
        if(reduced || typeof IntersectionObserver==='undefined'){ items.forEach(el=>{ el.classList.add('in'); if(el.id==='gxPreview') el.classList.add('drawn'); }); }
        else {
          gate.classList.add('gx-anim');
          const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } }),
                                            {root:gate, threshold:0.12});
          items.forEach(el=>io.observe(el));
        }

        /* the preview card leans towards the pointer; feature tiles follow it with light */
        if(!reduced){
          const pv=gate.querySelector('#gxPreview');
          gate.addEventListener('pointermove', e=>{
            if(pv){ const r=pv.getBoundingClientRect(); const dx=(e.clientX-(r.left+r.width/2))/r.width, dy=(e.clientY-(r.top+r.height/2))/r.height;
              if(Math.abs(dx)<1.4 && Math.abs(dy)<1.6){ pv.style.setProperty('--rx', (-dy*6).toFixed(2)+'deg'); pv.style.setProperty('--ry', (dx*8).toFixed(2)+'deg'); }
              else { pv.style.setProperty('--rx','0deg'); pv.style.setProperty('--ry','0deg'); } }
            const f=e.target.closest && e.target.closest('.gx-feat');
            if(f){ const r=f.getBoundingClientRect(); f.style.setProperty('--mx',(e.clientX-r.left)+'px'); f.style.setProperty('--my',(e.clientY-r.top)+'px'); }
          }, {passive:true});
        }

        /* the headline cycles through the kinds of strategy people test */
        const rot=gate.querySelector('#gxRot');
        if(rot && !reduced){
          const words=['breakout','pullback','London open','ICT','trend-following','RSI','scalping','swing'];
          let i=0;
          const tick=()=>{ if(!document.body.contains(rot)) return;
            rot.classList.add('out');
            setTimeout(()=>{ i=(i+1)%words.length; rot.textContent=words[i]; rot.classList.remove('out'); rot.classList.add('enter');
              requestAnimationFrame(()=>requestAnimationFrame(()=>rot.classList.remove('enter'))); }, 380);
            setTimeout(tick, 2300); };
          setTimeout(tick, 2300);
        }

        const cta=gate.querySelector('#gCta');
        if(cta) cta.addEventListener('click', ()=>{
          const btn=gate.querySelector('#gSignIn');
          if(btn && !btn.disabled && window.innerWidth>980){ btn.focus(); btn.classList.add('pulse'); setTimeout(()=>btn.classList.remove('pulse'),1400); }
          const side=gate.querySelector('.gx-side');
          if(side && side.scrollIntoView) side.scrollIntoView({behavior:'smooth', block:'start'});
          else gate.scrollTo({top:0, behavior:'smooth'});
        });
      }

      /* ---- the scene behind the app --------------------------------------
         The same streaming candles and drifting light as the sign-in page,
         quieter, and only drawn while the scene look is on and the tab is in
         view, so it costs nothing when hidden. */
      function appSceneFx() {
        const bg = document.getElementById('appBg'); if (!bg || bg._on) return; bg._on = true;
        const cv = bg.querySelector('.gx-canvas'), ctx = cv && cv.getContext ? cv.getContext('2d') : null;
        const reduced = gxReduced();
        let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
        const candles = []; let px = 100;
        const add = () => { const o = px, c = o + (rnd() - .49) * 2.2 + Math.sin(candles.length / 21) * .5;
          candles.push({ o: o, c: c, h: Math.max(o, c) + rnd() * 1.1, l: Math.min(o, c) - rnd() * 1.1 }); px = c; };
        for (let i = 0; i < 240; i++) add();
        let shift = 0, lo = null, hi = null, last = 0, W = 0, H = 0, dpr = 1;
        const size = () => { if (!cv) return; dpr = Math.min(1.5, window.devicePixelRatio || 1);
          W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
        size(); window.addEventListener('resize', size);
        const draw = t => {
          requestAnimationFrame(draw);
          if (!ctx || document.hidden || document.documentElement.getAttribute('data-theme') !== 'dark' || t - last < 45) return;
          if (document.getElementById('authGate')) return;            /* the sign-in page has its own */
          last = t;
          const vis = Math.max(70, Math.round(W / 14)), cw = W / vis;
          if (!reduced) { shift += .28; if (shift >= cw) { shift -= cw; candles.shift(); add(); } }
          const view = candles.slice(-vis - 2);
          let mn = Infinity, mx = -Infinity; view.forEach(k => { if (k.l < mn) mn = k.l; if (k.h > mx) mx = k.h; });
          lo = lo == null ? mn : lo + (mn - lo) * .05; hi = hi == null ? mx : hi + (mx - hi) * .05;
          const top = H * .2, bot = H * .85, y = v => bot - (v - lo) / Math.max(1e-6, hi - lo) * (bot - top);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
          ctx.beginPath(); let ma = null;
          view.forEach((k, i) => { ma = ma == null ? k.c : ma + (k.c - ma) * .12; const xx = i * cw - shift + cw / 2; i ? ctx.lineTo(xx, y(ma)) : ctx.moveTo(xx, y(ma)); });
          ctx.strokeStyle = 'rgba(62,197,224,.5)'; ctx.lineWidth = 1.5; ctx.shadowColor = 'rgba(62,197,224,.8)'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
          view.forEach((k, i) => {
            const xx = i * cw - shift, up = k.c >= k.o;
            ctx.strokeStyle = up ? 'rgba(95,211,160,.5)' : 'rgba(240,138,116,.45)';
            ctx.fillStyle = up ? 'rgba(95,211,160,.28)' : 'rgba(240,138,116,.26)';
            ctx.beginPath(); ctx.moveTo(xx + cw / 2, y(k.h)); ctx.lineTo(xx + cw / 2, y(k.l)); ctx.lineWidth = 1; ctx.stroke();
            const b1 = y(Math.max(k.o, k.c)), b2 = y(Math.min(k.o, k.c));
            ctx.fillRect(xx + cw * .22, b1, cw * .56, Math.max(1.2, b2 - b1));
          });
        };
        requestAnimationFrame(draw);
        /* parallax: the layers slide at their own speeds as the page scrolls */
        let pending = false;
        window.addEventListener('scroll', () => {
          if (pending) return; pending = true;
          requestAnimationFrame(() => { pending = false; bg.style.setProperty('--sy', Math.round(window.scrollY)); });
        }, { passive: true });
      }
      /* numbers count up from zero the first time they come into view */
      function countUp(b){
        if(b.dataset.done) return; b.dataset.done=1;
        const v=parseFloat(b.dataset.v), f=b.dataset.f||'';
        const dec=+(f.replace(/\D/g,'')||0), sign=f[0]==='+'?'+':f[0]==='-'?'\u2212':'', pc=f.indexOf('%')>=0?'%':'';
        const fmt=x=>sign+x.toFixed(dec)+pc;
        if(gxReduced()){ b.textContent=fmt(v); return; }
        const t0=performance.now(), D=1300;
        const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); b.textContent=fmt(v*e); if(k<1) requestAnimationFrame(step); };
        b.textContent=fmt(0); requestAnimationFrame(step);
      }
      /* the page frame, built once; the sign-in column is refilled as things change */
      function gateShell(){
        let gate=$('#authGate');
        if(!gate){ gate=el('div'); gate.id='authGate'; document.body.appendChild(gate); }

            '<div class="gx-bg" aria-hidden="true">'+

              '<canvas class="gx-canvas"></canvas><div class="gx-grid"></div><div class="gx-vig"></div>'+
            '</div>'+
            '<div class="gx-side"><div class="gate-card gx-form" role="dialog" aria-labelledby="gateTitle"></div></div>'+gateShowcase();
          try{ gateFx(gate); }catch(e){}
        }
        return gate.querySelector('.gx-form');
      }
      function gateBrand(){

          '<svg viewBox="0 0 24 24" fill="none" width="28" height="28" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5" stroke="currentColor" stroke-width="1.4"/><path d="M5 16.5l4-5 3.2 3 6.3-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
          '<span>AutoBacktest</span></div>';
      }
      function renderGate(msg, kind) {
        const ready = fbConfigured();

        const sb = $('#gSignIn');

      function hideGate() { const g = $('#authGate'); if (g) g.remove(); }
      function busyGate(text) {
