        $('#gSkip').addEventListener('click', () => { skipped = true; hideGate(); startBoot(); });
      }

      async function signIn() {
        try {
          busyGate('Opening Google…');
          const fb = account.fb || await initFirebase();
          const provider = new fb.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await fb.auth().signInWithPopup(provider);
          /* onAuthStateChanged takes it from here */
        } catch (e) {
          const code = (e && e.code) || '';
          const msg = code === 'auth/popup-closed-by-user' ? 'The Google window was closed before signing in finished.'
            : code === 'auth/popup-blocked' ? 'Your browser blocked the Google window. Allow pop-ups for this site and try again.'
              : code === 'auth/unauthorized-domain' ? 'This address is not on the list of allowed domains in the Firebase project yet.'
                : code === 'auth/network-request-failed' ? 'Google could not be reached. Check your connection and try again.'
                  : 'Signing in did not work: ' + ((e && e.message) || 'unknown error');
          renderGate(msg, 'bad');
        }
      }
      async function signOut() {
        try { await withTimeout(flushSync(), 10000, 'Saving'); } catch (e) { }
        if (Object.keys(account.queue).length || account.inflight || account.paused) {
          if (!window.confirm('Some of your latest work has not reached your account' + (account.detail ? ' (' + account.detail + ')' : '') +
            '.\n\nSigning out removes this browser\'s copy, so that work would be lost. Sign out anyway?')) return;
        }
        clearLocalData();
        try { localStorage.removeItem('ab:mode'); } catch (e) { }
        try { if (account.fb) await account.fb.auth().signOut(); } catch (e) { }
        location.reload();
      }

      /* ---- Settings card: is my data really reaching my account? ---------------- */
      function fmtAgo(ms) {
        if (!ms) return 'not yet this session';
        const s = Math.round((Date.now() - ms) / 1000);
        return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
      }
      function renderSyncCard() {
        const host = $('#syncCard'); if (!host) return;
        if (!fbConfigured()) { host.innerHTML = ''; return; }
        const u = account.user;
        const bad = !!account.detail;
        host.innerHTML =
          '<div class="card"><div class="card-head"><h2>Account &amp; sync</h2><span class="hint">' + (u ? 'signed in' : 'not signed in') + '</span></div>' +
          (u
            ? '<p style="color:var(--dim);margin:0 0 10px">Signed in as <strong>' + esc(u.email || u.displayName || 'your Google account') + '</strong>. ' +
            'Your backtests, uploaded files, strategies and settings are saved to your account and follow you to any browser you sign in from.</p>' +

        const keys = Object.keys(INSTR);
        for (let i = 0; i < keys.length; i++) if (n.indexOf(keys[i]) >= 0) return keys[i];
        const alias = {
          NAS100: 'US100', NASDAQ: 'US100', USTEC: 'US100', NDX: 'US100',
          SPX500: 'US500', SP500: 'US500', SPX: 'US500', USSPX: 'US500',
          WS30: 'US30', DJ30: 'US30', DJI: 'US30', DOW: 'US30',
          RUSSELL: 'US2000', RUT: 'US2000',
          DE40: 'GER40', GER30: 'GER40', DE30: 'GER40', DAX: 'GER40',
          FTSE: 'UK100', CAC: 'FRA40', STOXX: 'EU50', SX5E: 'EU50', EUSTX50: 'EU50',
          JP225: 'JPN225', NIKKEI: 'JPN225', NKY: 'JPN225',
          HSI: 'HK50', HANGSENG: 'HK50', ASX: 'AUS200',

          NATGAS: 'NATGAS', GAS: 'NATGAS', CABLE: 'GBPUSD', FIBER: 'EURUSD'

        if (!window.claude || typeof window.claude.use !== 'function') return;
        downloadsTried = true;
        Promise.resolve(window.claude.use('downloads')).then(d => { downloadsCap = d || null; }).catch(() => { downloadsCap = null; });
        Promise.resolve(window.claude.use('sample')).then(fn => {
          if (!fn) return;
          window.__sampleFn = fn; window.__sampleReady = true;
          if (state.view === 'backtest' && state.strategy === 'custom' && $('#cxAsk')) $('#cxAsk').hidden = false;
        }).catch(() => { });
      }
      function boot() {
        applyTheme();
        $$('#themeToggle button').forEach(b => b.addEventListener('click', () => {
          prefs.theme = b.dataset.themeSet;
          savePrefs();
          applyTheme(prefs.theme);
          if (state.view === 'dashboard') renderDashboard();   /* charts are drawn with theme colours */
          if (state.view === 'trades') renderTradesView();
        }));
        if (window.matchMedia) {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          const onSys = () => { if (!prefs.theme) { applyTheme(); if (state.view === 'dashboard') renderDashboard(); } };
          if (mq.addEventListener) mq.addEventListener('change', onSys);
        }
        try { appSceneFx(); } catch (e) { }
        try { claimLinkReturn(); } catch (e) { }     /* just back from a Stripe Payment Link? */
        try { refreshPlan(); } catch (e) { }
        dsLoadAll();
        renderBacktestView();
        renderSettings();
        $$('#nav button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
        switchView(state.view || 'backtest');
        /* restore the most recent saved run so the dashboard is not empty on reload */
        const hist = LS.get(K_HIST, []);
        if (hist.length) {
          const rec = loadRun(hist[0].id);
          if (rec) state.current = rec;
        }
        initCapabilities();
        loadChartLib().then(ok => {
          if (!ok) {
            $('#brandTag').textContent = 'v1.0 · charts offline';
            toast('The chart library could not load. All metrics and tables still work.', 'bad');
          }
          if (state.view === 'dashboard') renderDashboard();
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startApp); else startApp();

    })();


  </script>
