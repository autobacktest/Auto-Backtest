              'the candle closes in the ' + (z.end === 'top' ? 'top ' : 'bottom ') + z.pct + '% of its range',
              { short: 'closes in the ' + z.end + ' ' + z.pct + '%', status: 'exact' });
          }
        },
        /* ---- strong / momentum / displacement candles ---------------------- */
        {
          id: 'strong', re: /\bstrong(?:ly)?\s+(?:bullish|bearish|green|red|up|down)?\s*(?:candle|bar|close)?\b|\bmomentum candle\b|\bdisplacement\b|\bimpulsive?\b|\bconviction\b|\bbig (?:green|red) (?:candle|bar)\b/,
          build: (txt, ctx) => {
            if (/\bfvg\b|\bfair value gap\b|\bimbalance\b|\barea\b|\bzone\b/.test(txt)) return null;
            const up = /\bbullish|green|up\b/.test(txt) ? true : /\bbearish|red|down\b/.test(txt) ? false : (ctx.bias !== 'short');
            const parts = [{ l: { t: up ? 'dirUp' : 'dirDn' }, op: 'eq', r: { t: 'num', v: 1 } },
            { l: { t: 'bodyPct' }, op: 'gte', r: { t: 'num', v: LANG_DEF.strongBody } },
            { l: { t: 'body' }, op: 'gte', r: { t: 'atr', n: 14, mult: 1 } }];
            return T({ all: parts },
              'a ' + (up ? 'bullish' : 'bearish') + ' candle whose body is at least ' + LANG_DEF.strongBody + '% of the candle and at least as tall as the average recent swing',
              {
                short: 'a strong ' + (up ? 'bullish' : 'bearish') + ' candle', status: 'default',
                detail: '"strong" uses the house definition: body at least ' + LANG_DEF.strongBody + '% of the candle, and the candle at least as tall as the average recent swing. Say "body at least 70% of the range" to set it yourself'
              });
          }
        },
        {
          re: /\b(?:bullish|green|up)\s+(?:candle|bar|close)\b/,
          build: (txt) => {
            if (/\bstrong|displacement|impulsive|momentum|marubozu|engulf|doji|hammer|shooting|inside|outside\b/.test(txt)) return null;
            return T({ l: { t: 'dirUp' }, op: 'eq', r: { t: 'num', v: 1 } }, 'the candle closes up', { short: 'candle closed up' });
          }
        },
        {
          re: /\b(?:bearish|red|down)\s+(?:candle|bar|close)\b/,
          build: (txt) => {
            if (/\bstrong|displacement|impulsive|momentum|marubozu|engulf|doji|hammer|shooting|inside|outside\b/.test(txt)) return null;
            return T({ l: { t: 'dirDn' }, op: 'eq', r: { t: 'num', v: 1 } }, 'the candle closes down', { short: 'candle closed down' });
          }
        },
        /* ---- breaking a level, and closing beyond it ----------------------- */
        {
          id: 'breaks', re: /\bbreaks?\b|\bbreakout\b|\bbroke(?:n)?\b|\bbreaking\b|\btaken out\b|\btrades? (?:above|below)\b|\btouch(?:es)?\b|\bretests?\b|\breturns? to\b|\btaps?\b/,
          build: (txt, ctx) => {
            const vague = vagueRef(txt);
            const sr = stepRefIn(txt, ctx);
            let r = sr || matchRef(txt);
            let refOp, name, status = 'exact', detail = '';
            if (r) { if (!r.op.step) ctx.lastRef = r; refOp = r.op; name = r.name; status = r.status; detail = r.detail; }
            else if (/\bthe (?:rejection|sweep|signal|that|previous step)\b|\bits\b/.test(txt) && ctx.prevStepId) {
              const part = /\blow\b/.test(txt) ? 'low' : 'high';
              refOp = { step: 'PREV', part: part }; name = 'the ' + part + ' of the candle from the previous step';
            }
            else if (/\bretests?\b|\breturns? to\b|\bbacks? into\b|\bthe retest\b/.test(txt) && ctx.lastRef && ctx.prevStepId) {
              refOp = Object.assign({}, JSON.parse(JSON.stringify(ctx.lastRef.op)), { step: 'PREV' });
              name = ctx.lastRef.name + ' as it stood when it broke';
              status = ctx.lastRef.status; detail = ctx.lastRef.detail;
            }
            else if (vague) return { unsupported: '"' + vague + '" is not a level this engine can locate — name it (the 20-bar high, yesterday\'s high, the last swing high) and it can be tested' };
            else return null;
            const retest = /\bretests?\b|\breturns? to\b|\btouch(?:es)?\b|\btaps?\b|\bbacks? into\b/.test(txt);
            const down = /\bbelow|under|down\b/.test(txt) || (r && r.side === 'low' && !/\babove\b/.test(txt));
            const closes = /\bcloses?\b/.test(txt);
            let cond, label;
            if (retest) {
              cond = down ? { l: { t: 'high' }, op: 'gte', r: refOp } : { l: { t: 'low' }, op: 'lte', r: refOp };
              label = 'price trades back to ' + name;
            } else if (closes) {
              cond = { l: { t: 'close' }, op: down ? 'lt' : 'gt', r: refOp };
              label = 'the candle closes ' + (down ? 'below ' : 'above ') + name;
            } else {
              cond = down ? { l: { t: 'low' }, op: 'lt', r: refOp } : { l: { t: 'high' }, op: 'gt', r: refOp };
              label = 'price trades ' + (down ? 'below ' : 'above ') + name;
            }
            return T(cond, label, { short: label, status: status, detail: detail });
          }
        },
        /* ---- market structure ---------------------------------------------- */
        {
          id: 'choch', re: /\bchange of character\b|\bchoch\b/,

            return T({ f: up ? 'chochUp' : 'chochDn' },
              'the market structure changes character to ' + (up ? 'bullish' : 'bearish') + ' — the first close beyond the last swing ' + (up ? 'high' : 'low') + ' after a ' + (up ? 'down' : 'up') + ' leg',
              {
                short: 'change of character', status: 'default',
                detail: 'swings use ' + LANG_DEF.swingK + ' bars either side; a change of character is the first structure break in the new direction'

        {

            return T({ f: up ? 'bosUp' : 'bosDn' },
              'structure breaks ' + (up ? 'up — a close above the last swing high' : 'down — a close below the last swing low'),
              {
                short: 'break of structure', status: 'default',
                detail: 'swing points use ' + LANG_DEF.swingK + ' bars either side'
              });
          }
        },
        { re: /\bhigher high\b/, build: () => T({ f: 'hhStruct' }, 'a new swing high forms above the previous swing high', { short: 'higher high', status: 'default', detail: 'swings use ' + LANG_DEF.swingK + ' bars either side' }) },
        { re: /\bhigher low\b/, build: () => T({ f: 'hlStruct' }, 'a new swing low forms above the previous swing low', { short: 'higher low', status: 'default', detail: 'swings use ' + LANG_DEF.swingK + ' bars either side' }) },
        { re: /\blower high\b/, build: () => T({ f: 'lhStruct' }, 'a new swing high forms below the previous swing high', { short: 'lower high', status: 'default', detail: 'swings use ' + LANG_DEF.swingK + ' bars either side' }) },
        { re: /\blower low\b/, build: () => T({ f: 'llStruct' }, 'a new swing low forms below the previous swing low', { short: 'lower low', status: 'default', detail: 'swings use ' + LANG_DEF.swingK + ' bars either side' }) },
        {
          id: 'hhhl', re: /\bhigher highs?\b[\s\S]*\bhigher lows?\b|\bhh\b[\s\S]*\bhl\b/,
          build: () => T({ all: [{ l: { t: 'swingHi' }, op: 'gt', r: { t: 'prevSwingHi' } }, { l: { t: 'swingLo' }, op: 'gt', r: { t: 'prevSwingLo' } }] },
            'the last swing high is above the one before it and the last swing low is above the one before it (higher highs and higher lows)',

        },
        {
          id: 'lhll', re: /\blower highs?\b[\s\S]*\blower lows?\b|\blh\b[\s\S]*\bll\b/,
          build: () => T({ all: [{ l: { t: 'swingHi' }, op: 'lt', r: { t: 'prevSwingHi' } }, { l: { t: 'swingLo' }, op: 'lt', r: { t: 'prevSwingLo' } }] },
            'the last swing high is below the one before it and the last swing low is below the one before it (lower highs and lower lows)',
            { kind: 'state', short: 'lower highs and lower lows', status: 'exact' })
        },
        {
          id: 'nearLevel', re: /\b(?:at or near|near|close to|around)\b[\s\S]*\b(?:support|resistance|swing (?:low|high)|level)\b|\b(?:at|below|above)\s+a?\s*significant\b/,
          build: (txt, ctx) => {

              : { l: { t: 'high' }, op: 'gte', r: Object.assign({ t: 'swingHi' }, off) };

          build: () => T({ f: 'trendUp' }, 'market structure is bullish (the last structure break was upward)',

        },
        {
          id: 'trendDn', re: /\b(?:down ?trend|trend is down|bearish trend|trending down|downtrend|bearish structure|structure is bearish|bias is bearish|bearish bias|bias is short)\b/,
          build: () => T({ f: 'trendDn' }, 'market structure is bearish (the last structure break was downward)',
