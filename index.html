    .hbars .track {
      background: var(--panel2);
      border-radius: 4px;
      height: 16px;
      position: relative;
      overflow: hidden
    }

    .hbars .track i {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 3px
    }

    .hbars .val {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .hbars .row0 {
      color: var(--faint)
    }

    .deflist {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px 14px;
      font-size: 12.5px
    }

    .deflist .dk {
      color: var(--dim)
    }

    .deflist .dv {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      text-align: right
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .summary-grid>div {
      background: var(--panel);
      padding: 12px 14px;
      box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line)
    }

    .summary-grid .k {
      color: var(--dim);
      font-size: 11.5px
    }

    .summary-grid .v {
      font-family: var(--mono);
      font-size: 14.5px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      background: var(--panel);
      border: 1px solid var(--line2);
      border-left: 3px solid var(--acc);
      border-radius: 9px;
      padding: 12px 14px;
      max-width: 340px;
      font-size: 13px;
      box-shadow: 0 10px 28px rgba(27, 36, 48, .14)
    }

    .toast.bad {
      border-left-color: var(--neg)
    }

    .toast.good {
      border-left-color: var(--pos)
    }

    .fc.empty, .cal-cell.empty, .yd.empty { padding: 0 !important }   /* blank days before the 1st */
    .empty {
      padding: 44px 20px;
      text-align: center;
      color: var(--faint);
      font-size: 13.5px
    }

    .empty .big {
      color: var(--dim);
      font-size: 15px;
      margin-bottom: 8px
    }

    .sec-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 22px 0 10px
    }

    .sec-title h2 {
      font-size: 15px
    }

    .sec-title span {
      color: var(--faint);
      font-size: 11.5px;
      font-family: var(--mono)
    }

    .spin {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid var(--line2);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: sp .7s linear infinite;
      vertical-align: -1px;
      margin-right: 7px
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    @media(max-width:1180px) {
      .cols {
        grid-template-columns: 1fr
      }

      .sticky {
        position: static
      }

      .g4 {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:860px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        position: static;
        height: auto;
        flex-direction: column;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .nav {
        flex-direction: row;
        overflow-x: auto;
        padding: 8px
      }

      .nav button {
        white-space: nowrap
      }

      .side-foot {
        display: none
      }

      .main {
        padding: 16px 14px 50px
      }

      .g3,
      .g2 {
        grid-template-columns: 1fr
      }

      .strat {
        grid-template-columns: 1fr
      }

      .row.r2,
      .row.r3 {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:560px) {
      .g4 {
        grid-template-columns: 1fr
      }

      .kpi .v {
        font-size: 19px
      }
    }
  </style>
</head>

  <div id="toastHost"></div>
  <script>
    /* =========================================================================
       AutoBacktest v1 — browser backtesting engine
       Sections: 1 core utils · 2 data · 3 indicators · 4 strategies
                 5 engine · 6 metrics · 7 storage · 8 UI · 9 charts
       ========================================================================= */
    (function () {
      "use strict";

      /* ---------------------------------------------------------------- 1. utils */
      const $ = (s, r) => (r || document).querySelector(s);
      const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
      const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      /* The engine works in the currency the instrument settles in, which for these
         markets is the US dollar. Showing the account in another currency is a
         conversion at one rate you set, and it is labelled as such. */
      const CURRENCIES = {
        USD: { sym: '$', name: 'US dollar' },
        EUR: { sym: '\u20AC', name: 'Euro' },
        GBP: { sym: '\u00A3', name: 'British pound' },
        JPY: { sym: '\u00A5', name: 'Japanese yen', dp: 0 },
        INR: { sym: '\u20B9', name: 'Indian rupee' },
        AUD: { sym: 'A$', name: 'Australian dollar' },
        CAD: { sym: 'C$', name: 'Canadian dollar' },
        CHF: { sym: 'CHF ', name: 'Swiss franc' },
        NZD: { sym: 'NZ$', name: 'New Zealand dollar' },
        SGD: { sym: 'S$', name: 'Singapore dollar' },
        AED: { sym: 'AED ', name: 'UAE dirham' },
        ZAR: { sym: 'R', name: 'South African rand' },
        BRL: { sym: 'R$', name: 'Brazilian real' },
        MXN: { sym: 'MX$', name: 'Mexican peso' },
        PLN: { sym: 'z\u0142 ', name: 'Polish z\u0142oty' },
        SEK: { sym: 'kr ', name: 'Swedish krona' },
        NOK: { sym: 'kr ', name: 'Norwegian krone' },
        TRY: { sym: '\u20BA', name: 'Turkish lira' },
        CNY: { sym: 'CN\u00A5', name: 'Chinese yuan' }
      };
      function acctCur() { return (prefs && CURRENCIES[prefs.currency]) ? prefs.currency : 'USD'; }
      function acctRate() { const r = prefs && +prefs.currencyRate; return (isFinite(r) && r > 0) ? r : 1; }
      function money(v, dp) {
        if (v == null || !isFinite(v)) return '—';

      }

      /* dataset registry: uploaded datasets live in memory, and are mirrored to
         localStorage when they fit inside the quota                               */
      const datasets = {};        /* id -> {id,name,symbol,bars,tz,uploaded,rows} */
      function dsList() { return Object.keys(datasets).map(k => datasets[k]).sort((a, b) => b.uploaded - a.uploaded); }
      /* Bars are stored as delta-encoded integers in one string. The same numbers,
         roughly a third of the characters, which decides how many files fit beside
         your saved backtests. */
      function packBarsV2(bars) {
        if (!bars.length) return { v: 2, n: 0, d: '' };
        let dp = 0;
        for (let i = 0; i < Math.min(200, bars.length); i++) {
          ['o', 'h', 'l', 'c'].forEach(k => {
            const str = String(bars[i][k]), dot = str.indexOf('.');
            if (dot >= 0) dp = Math.max(dp, str.length - dot - 1);
          });
        }
        dp = Math.min(8, Math.max(2, dp));
        const sc = Math.pow(10, dp);
        const out = []; let pt = 0, pc = 0;
        for (let i = 0; i < bars.length; i++) {
          const b = bars[i];
          const tm = Math.round(b.t / 60000);
          const o = Math.round(b.o * sc), h = Math.round(b.h * sc), l = Math.round(b.l * sc), c = Math.round(b.c * sc);
          out.push((tm - pt) + '|' + (o - pc) + '|' + (h - o) + '|' + (o - l) + '|' + (c - o) + '|' + Math.round(b.v || 0));
          pt = tm; pc = c;
        }
        return { v: 2, dp: dp, n: bars.length, d: out.join(';') };
      }
      function unpackBarsV2(p) {
        if (!p || !p.n) return [];
        const sc = Math.pow(10, p.dp || 5), rows = p.d.split(';'), out = new Array(rows.length);
        let pt = 0, pc = 0;
        for (let i = 0; i < rows.length; i++) {
          const f = rows[i].split('|');
          const tm = pt + +f[0], o = pc + +f[1], h = o + +f[2], l = o - +f[3], c = o + +f[4];
          out[i] = { t: tm * 60000, o: o / sc, h: h / sc, l: l / sc, c: c / sc, v: +f[5] };
          pt = tm; pc = c;
        }
        return out;
      }
      function packBars(bars) {
        const a = new Array(bars.length * 6);
        for (let i = 0; i < bars.length; i++) { const b = bars[i], j = i * 6; a[j] = b.t; a[j + 1] = b.o; a[j + 2] = b.h; a[j + 3] = b.l; a[j + 4] = b.c; a[j + 5] = b.v; }
        return a;
      }
      function unpackBars(a) {
        const out = new Array(a.length / 6);
        for (let i = 0; i < out.length; i++) { const j = i * 6; out[i] = { t: a[j], o: a[j + 1], h: a[j + 2], l: a[j + 3], c: a[j + 4], v: a[j + 5] }; }
        return out;
      }
      const DS_BUDGET = 1_400_000;      /* characters a single file may take, so runs still fit */
      function dsSave(ds) {
        if (ds.tfMin == null) { ds.tfMin = tfMinutesOf(ds.bars); ds.tf = tfLabelFor(ds.tfMin); }
        datasets[ds.id] = ds;
        /* library files belong to the site, not to the person: they are not
           copied into their browser storage or their account, because they can
           always be fetched again */
        if (ds.source === 'library') { ds.persisted = false; return false; }
        const rec = {
          id: ds.id, name: ds.name, symbol: ds.symbol, tz: ds.tz, uploaded: ds.uploaded,
          tf: ds.tf, tfMin: ds.tfMin, b2: packBarsV2(ds.bars)
        };
        let ok = false;
        try {
          const size = JSON.stringify(rec).length;
          ds.storeSize = size;
          ok = size <= DS_BUDGET && LS.set(K_DS + ds.id, rec);
          if (size > DS_BUDGET) ds.tooBig = true;
        } catch (e) { ok = false; }
        ds.persisted = ok;
        return ok;
      }
      function dsLoadAll() {
        LS.keys().filter(k => k.indexOf(K_DS) === 0).forEach(k => {
          const raw = LS.get(k, null); if (!raw || (!raw.b && !raw.b2)) return;   /* either storage format */
          const bb = raw.b2 ? unpackBarsV2(raw.b2) : unpackBars(raw.b);
          datasets[raw.id] = {
            id: raw.id, name: raw.name, symbol: raw.symbol, tz: raw.tz, uploaded: raw.uploaded,
            tfMin: raw.tfMin || tfMinutesOf(bb), tf: raw.tf || tfLabelFor(raw.tfMin || tfMinutesOf(bb)),
            bars: bb, persisted: true
          };
        });
      }
      function dsDelete(id) { delete datasets[id]; LS.del(K_DS + id); }

      /* slice bars for a period, keeping `warm` bars of indicator warm-up before it */
      function sliceForRun(bars, startMs, endMs, warm) {
        let s = 0; while (s < bars.length && bars[s].t < startMs) s++;
        let e = bars.length - 1; while (e >= 0 && bars[e].t > endMs) e--;
        if (s > e) return null;
        const from = Math.max(0, s - warm);
        return { slice: bars.slice(from, e + 1), tradeStartIdx: s - from, warmAvailable: s - from };
      }

      /* ------------------------------------------------- timeframes and resampling */
      const TF_MIN = {
        '1m': 1, '2m': 2, '3m': 3, '5m': 5, '10m': 10, '15m': 15, '20m': 20, '30m': 30,
        '1h': 60, '2h': 120, '3h': 180, '4h': 240, '6h': 360, '8h': 480, '12h': 720,
        '1d': 1440, '2d': 2880, '3d': 4320, '1w': 10080
      };
      function tfLabelFor(min) {
        let best = null, diff = Infinity;
        Object.keys(TF_MIN).forEach(k => { const d = Math.abs(TF_MIN[k] - min); if (d < diff) { diff = d; best = k; } });
        return (diff <= Math.max(1, min * 0.15)) ? best : (min < 60 ? Math.round(min) + 'm'
          : min < 1440 ? Math.round(min / 60) + 'h' : Math.round(min / 1440) + 'd');
      }
      /* the median gap, in minutes — robust against weekend holes */
      function tfMinutesOf(bars) {
        if (!bars || bars.length < 3) return 60;
        const d = [];
        for (let i = 1; i < bars.length && d.length < 500; i++) {
          const g = (bars[i].t - bars[i - 1].t) / 60000;
          if (g > 0) d.push(g);
        }
        if (!d.length) return 60;
        d.sort((a, b) => a - b);
        return d[Math.floor(d.length / 2)];
      }
      /* bucket start for a timestamp, aligned to the wall clock in tz */
      function bucketStart(ms, minutes, tz) {
        const span = minutes * 60000;
        if (minutes >= 10080) {                                   /* weeks start on Monday */
          const p = tzParts(ms, tz);
          const d = new Date(Date.UTC(p.y, p.mo - 1, p.d));
          d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
          return zonedToEpoch(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), 0, 0, tz);
        }
        if (minutes >= 1440) {                                    /* days start at midnight in tz */
          const p = tzParts(ms, tz);
          const step = Math.round(minutes / 1440);
          const day0 = zonedToEpoch(p.y, p.mo, p.d, 0, 0, tz);
          if (step <= 1) return day0;
          const n = Math.floor(day0 / 86400000);
          return (n - (n % step)) * 86400000;
        }
        const off = tzOffset(ms, tz);                            /* intraday aligns to the local hour grid */
        const local = ms + off;
        return local - (local % span) - off;
      }
      /* combine finer bars into coarser ones. Deterministic, and never forward-looking:
         a coarse bar is only complete once its last fine bar has printed. */
      function resampleBars(bars, minutes, tz) {
        if (!bars || !bars.length) return [];
        const out = [];
        let cur = null, curKey = null;
        for (let i = 0; i < bars.length; i++) {
          const b = bars[i], k = bucketStart(b.t, minutes, tz);
          if (k !== curKey) {
            if (cur) out.push(cur);
            cur = { t: k, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0 };
            curKey = k;
          } else {
            if (b.h > cur.h) cur.h = b.h;
            if (b.l < cur.l) cur.l = b.l;
            cur.c = b.c; cur.v += (b.v || 0);
          }
        }
        if (cur) out.push(cur);
        return out;
      }
      /* for each base bar, the index of the most recent HTF bar that had ALREADY
         CLOSED when that base bar opened. -1 until one exists. */
      function alignHTF(base, htf, htfMinutes) {
        const span = htfMinutes * 60000, n = base.length, out = new Int32Array(n).fill(-1);
        let j = -1;
        for (let i = 0; i < n; i++) {
          while (j + 1 < htf.length && (htf[j + 1].t + span) <= base[i].t) j++;
          out[i] = j;
        }
        return out;
      }

      /* ---------------------------------------------------------- 3. indicators */
      function sma(v, p) {
        const out = new Array(v.length).fill(NaN); let s = 0;
        for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= p) s -= v[i - p]; if (i >= p - 1) out[i] = s / p; }
        return out;
      }
      function rsiWilder(closes, p) {
        const out = new Array(closes.length).fill(NaN);
        if (closes.length <= p) return out;
        let g = 0, l = 0;
        for (let i = 1; i <= p; i++) { const d = closes[i] - closes[i - 1]; if (d >= 0) g += d; else l -= d; }
        g /= p; l /= p;
        out[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
        for (let i = p + 1; i < closes.length; i++) {
          const d = closes[i] - closes[i - 1];
          g = (g * (p - 1) + (d > 0 ? d : 0)) / p;
          l = (l * (p - 1) + (d < 0 ? -d : 0)) / p;
          out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
        }
        return out;
      }
      function atrWilder(bars, p) {
        const out = new Array(bars.length).fill(NaN);
        if (bars.length <= p) return out;
        const tr = new Array(bars.length).fill(NaN);
        for (let i = 1; i < bars.length; i++) {
          const b = bars[i], pc = bars[i - 1].c;
          tr[i] = Math.max(b.h - b.l, Math.abs(b.h - pc), Math.abs(b.l - pc));
        }
        let s = 0; for (let i = 1; i <= p; i++) s += tr[i];
        out[p] = s / p;
        for (let i = p + 1; i < bars.length; i++) out[i] = (out[i - 1] * (p - 1) + tr[i]) / p;
        return out;
      }
      function rollHigh(bars, p) {   /* highest high of the p bars BEFORE i */
        const out = new Array(bars.length).fill(NaN);
        for (let i = p; i < bars.length; i++) { let m = -Infinity; for (let k = i - p; k < i; k++) if (bars[k].h > m) m = bars[k].h; out[i] = m; }
        return out;
      }
      function rollLow(bars, p) {
        const out = new Array(bars.length).fill(NaN);
        for (let i = p; i < bars.length; i++) { let m = Infinity; for (let k = i - p; k < i; k++) if (bars[k].l < m) m = bars[k].l; out[i] = m; }
        return out;
      }

      /* ---------------------------------------------------------- 4. strategies */
      const STRATS = {
        ma: {
          name: 'Moving Average Crossover',
          blurb: 'Buy when the fast MA crosses above the slow MA; sell when it crosses below.',
          params: [{ k: 'fast', label: 'Fast MA', def: 20, min: 2, max: 400, step: 1 },
          { k: 'slow', label: 'Slow MA', def: 50, min: 3, max: 800, step: 1 }],
          warmup: p => p.slow + 2,
          validate: p => p.fast >= p.slow ? 'Fast MA must be shorter than slow MA.' : null,
          prepare: (bars, p) => { const c = bars.map(b => b.c); return { f: sma(c, p.fast), s: sma(c, p.slow) }; },
          signal: (i, x) => {
            if (i < 1) return 0;
            const a = x.f[i], b = x.s[i], a1 = x.f[i - 1], b1 = x.s[i - 1];
            if (!isFinite(a) || !isFinite(b) || !isFinite(a1) || !isFinite(b1)) return 0;
            if (a > b && a1 <= b1) return 1;
            if (a < b && a1 >= b1) return -1;
            return 0;
          },
          describe: p => p.fast + '/' + p.slow + ' Moving Average Crossover',
          rules: p => ['BUY when the ' + p.fast + '-period MA closes above the ' + p.slow + '-period MA',
          'SELL when the ' + p.fast + '-period MA closes below the ' + p.slow + '-period MA',
            'A signal in the opposite direction closes any open position and reverses']
        },
        rsi: {
          name: 'RSI reversal',
          blurb: 'Buy when RSI drops under the oversold level and turns back up through it; sell on the mirror image.',
          params: [{ k: 'period', label: 'RSI period', def: 14, min: 2, max: 100, step: 1 },
          { k: 'os', label: 'Oversold', def: 30, min: 1, max: 49, step: 1 },
          { k: 'ob', label: 'Overbought', def: 70, min: 51, max: 99, step: 1 }],
          warmup: p => p.period + 3,
          validate: p => p.ob <= p.os ? 'Overbought must be above oversold.' : null,
          prepare: (bars, p) => ({ r: rsiWilder(bars.map(b => b.c), p.period) }),
          signal: (i, x, p) => {
            if (i < 1) return 0;
            const r = x.r[i], r1 = x.r[i - 1];
            if (!isFinite(r) || !isFinite(r1)) return 0;
            if (r1 < p.os && r >= p.os && r > r1) return 1;      /* reversed up out of oversold */
            if (r1 > p.ob && r <= p.ob && r < r1) return -1;     /* reversed down out of overbought */
            return 0;
          },
          describe: p => 'RSI(' + p.period + ') ' + p.os + '/' + p.ob + ' reversal',
          rules: p => ['BUY when RSI(' + p.period + ') has been below ' + p.os + ' and turns back up through ' + p.os,
          'SELL when RSI(' + p.period + ') has been above ' + p.ob + ' and turns back down through ' + p.ob,
            'A signal in the opposite direction closes any open position and reverses']
        },
        breakout: {
          name: 'Channel breakout',
          blurb: 'Buy when price closes above the highest high of the lookback window; sell below the lowest low.',
          params: [{ k: 'lookback', label: 'Lookback (bars)', def: 20, min: 2, max: 500, step: 1 }],
          warmup: p => p.lookback + 2,
          validate: () => null,
          prepare: (bars, p) => ({ hi: rollHigh(bars, p.lookback), lo: rollLow(bars, p.lookback) }),
          signal: (i, x, p, bars) => {
            const h = x.hi[i], l = x.lo[i], c = bars[i].c;
            if (!isFinite(h) || !isFinite(l)) return 0;
            if (c > h) return 1;
            if (c < l) return -1;
            return 0;
          },
          describe: p => p.lookback + '-bar Channel Breakout',
          rules: p => ['BUY when a bar closes above the highest high of the previous ' + p.lookback + ' bars',
          'SELL when a bar closes below the lowest low of the previous ' + p.lookback + ' bars',
            'A signal in the opposite direction closes any open position and reverses']
        },
        /* custom (the rule builder) is registered in the next section */
      };

      /* -------------------------------------------------------------- 5. engine */
      /* Execution model (also surfaced to the user in "Assumptions"):
         - Indicators for bar i use only bars 0..i (no look-ahead).
         - A signal produced at the CLOSE of bar i is executed at the OPEN of bar i+1.
         - Stops and targets are tested against the high/low of each bar after entry.
         - If a bar could hit both the stop and the target, the STOP is assumed first.
         - A gap through the stop fills at the bar open (worse fill). Targets fill at
           the target price.
         - Spread is charged as half the quoted spread on entry and half on exit,
           slippage is charged adverse on both sides, commission on the round turn.  */

      function makeConv(I, fxRate) {
        if (I.conv === 'direct') return () => 1;
        if (I.conv === 'inverse') return p => 1 / p;                 /* USD is the base ccy */
        return () => fxRate;                                     /* cross: quote ccy -> USD */
      }

      function runBacktest(cfg, bars, onProgress) {
        return new Promise((resolve, reject) => {
          try {
            const I = INSTR[cfg.symbol];
            const S = STRATS[cfg.strategy];
            const ctx = S.prepare(bars, cfg.params, cfg);
            const atr = (cfg.slType === 'atr') ? atrWilder(bars, cfg.atrPeriod) : null;
            const conv = makeConv(I, cfg.fxRate);
            const half = cfg.spread * I.pip / 2;
            const slip = cfg.slippage * I.pip;

            let balance = cfg.balance;
            let peakBal = balance;
            const trades = [], equity = [];
            let pos = null, pending = 0, pendStop = null, blown = false, skippedSignals = 0;
            const skipWhy = { stopSide: 0, tooSmall: 0, inTrade: 0, other: 0 };

            function closePos(exitRaw, t, reason, idx) {
              const fill = exitRaw - pos.dir * (half + slip);
              const q = conv(exitRaw);
              const gross = pos.units * (exitRaw - pos.entryRaw) * pos.dir * q;
              const commission = (pos.units / I.contract) * cfg.commission;
              const net = pos.units * (fill - pos.entryFill) * pos.dir * q - commission;
              balance += net;
              trades.push({
                n: trades.length + 1, dir: pos.dir, entryT: pos.entryT, exitT: t,
                entryIdx: pos.entryIdx, exitIdx: idx,
                entry: pos.entryFill, exit: fill, entryRaw: pos.entryRaw, exitRaw: exitRaw,
                units: pos.units, lots: pos.units / I.contract, sl: pos.sl, tp: pos.tp,
                gross: gross, commission: commission, costs: gross - net, net: net,
                balBefore: pos.balAtEntry, balAfter: balance,
                retPct: pos.balAtEntry > 0 ? net / pos.balAtEntry * 100 : 0,
                hold: t - pos.entryT, reason: reason, win: net > 0
              });
              pos = null;
              if (balance <= cfg.balance * 0.001) { blown = true; balance = Math.max(balance, 0); }
            }
            function openPos(dir, bar, i, stopPx, atClose) {
              const raw = atClose ? bar.c : bar.o;
              const fill = raw + dir * (half + slip);
              const qEntry = conv(raw);
              let sl = null;
              if (cfg.slType === 'pct') sl = fill * (1 - dir * cfg.slPct / 100);
              else if (cfg.slType === 'struct') {
                if (!(stopPx > 0) || (dir === 1 && stopPx >= fill) || (dir === -1 && stopPx <= fill)) {
                  skippedSignals++; skipWhy.stopSide++; return;   /* price had already traded past the level */
                }
                sl = stopPx;
              }
              else if (cfg.slType === 'atr') {
                const a = atr[i];
                if (!isFinite(a) || a <= 0) { skippedSignals++; skipWhy.other++; return; }
                sl = fill - dir * a * cfg.slAtr;
              }
              let units;
              const priceUsd = raw * qEntry;                        /* USD value of 1 unit */
              if (cfg.sizeMode === 'riskPct' || cfg.sizeMode === 'riskFixed') {
                const riskUsd = cfg.sizeMode === 'riskPct' ? balance * cfg.riskPct / 100 : cfg.riskFixed;
                const dist = Math.abs(fill - sl);
                if (!(dist > 0)) { skippedSignals++; skipWhy.other++; return; }
                units = riskUsd / (dist * qEntry);
              } else if (cfg.sizeMode === 'notionalFixed') {
                units = cfg.notionalFixed / priceUsd;
              } else {
                units = (balance * cfg.notionalPct / 100) / priceUsd;
              }
              const maxUnits = (balance * cfg.leverage) / priceUsd;
              if (units > maxUnits) units = maxUnits;
              if (!(units > 0) || !isFinite(units)) { skippedSignals++; skipWhy.tooSmall++; return; }
              let tp = null;
              if (cfg.tpType === 'rr' && sl != null) tp = fill + dir * Math.abs(fill - sl) * cfg.tpRR;
              else if (cfg.tpType === 'pct') tp = fill * (1 + dir * cfg.tpPct / 100);
              pos = {
                dir: dir, entryRaw: raw, entryFill: fill, entryT: bar.t, entryIdx: i,
                units: units, sl: sl, tp: tp, qEntry: qEntry, balAtEntry: balance
              };
            }

            const i0 = cfg.tradeStartIdx, iN = bars.length;
            let i = i0;
            const CHUNK = 700;
            function step() {
              const stop = Math.min(i + CHUNK, iN);
              for (; i < stop; i++) {
                const bar = bars[i];
                /* 1 — execute the signal raised at the close of the previous bar */
                if (pending !== 0 && !blown) {
                  if (pending === 2) {                               /* exit rule — flatten only */
                    if (pos) closePos(bar.o, bar.t, 'Exit rule', i);
                  } else {
                    if (pos && pos.dir !== pending) closePos(bar.o, bar.t, 'Reverse signal', i);
                    else if (pos) skipWhy.inTrade++;
                    if (!pos && !blown) openPos(pending, bar, i, pendStop);
                  }
                  pending = 0; pendStop = null;
                }
                /* 2 — stop / target inside this bar */
                if (pos) {
                  let exitRaw = null, reason = null;
                  if (pos.dir === 1) {
                    if (pos.sl != null && bar.l <= pos.sl) { exitRaw = Math.min(pos.sl, bar.o); reason = 'Stop loss'; }
                    else if (pos.tp != null && bar.h >= pos.tp) { exitRaw = pos.tp; reason = 'Take profit'; }
                  } else {
                    if (pos.sl != null && bar.h >= pos.sl) { exitRaw = Math.max(pos.sl, bar.o); reason = 'Stop loss'; }
                    else if (pos.tp != null && bar.l <= pos.tp) { exitRaw = pos.tp; reason = 'Take profit'; }
                  }
                  if (exitRaw != null) closePos(exitRaw, bar.t, reason, i);
                }
                /* 3 — mark to market (liquidation value, costs included) */
                let eq = balance;
                if (pos) {
                  const fill = bar.c - pos.dir * (half + slip);
                  eq = balance + pos.units * (fill - pos.entryFill) * pos.dir * conv(bar.c) - (pos.units / I.contract) * cfg.commission;
                }
                if (eq > peakBal) peakBal = eq;
                equity.push({ t: bar.t, eq: eq, bal: balance });
                /* 4 — raise the signal. With fillMode 'close' it is acted on straight
                       away at this candle's close, which is what a trader watching the
                       close does; otherwise it waits for the next bar's open. */
                if (!blown) {
                  const sg = S.signal(i, ctx, cfg.params, bars, pos);
                  if (sg && typeof sg === 'object') { pending = sg.d || 0; pendStop = (sg.stop != null ? sg.stop : null); }
                  else { pending = sg || 0; pendStop = null; }
                  if (cfg.fillMode === 'close' && pending !== 0 && !blown) {
                    if (pending === 2) { if (pos) closePos(bar.c, bar.t, 'Exit rule', i); }
                    else {
                      if (pos && pos.dir !== pending) closePos(bar.c, bar.t, 'Reverse signal', i);
                      else if (pos) skipWhy.inTrade++;
                      if (!pos && !blown) openPos(pending, bar, i, pendStop, true);
                    }
                    pending = 0; pendStop = null;
                  }
                }
                else pending = 0;
              }
              if (onProgress) onProgress((i - i0) / Math.max(1, (iN - i0)));
              if (i < iN) { setTimeout(step, 0); return; }
              /* close anything still open at the last bar */
              if (pos) closePos(bars[iN - 1].c, bars[iN - 1].t, 'End of period', iN - 1);
              if (equity.length) equity[equity.length - 1] = { t: bars[iN - 1].t, eq: balance, bal: balance };
              resolve({
                trades: trades, equity: equity, blown: blown, skippedSignals: skippedSignals,
                diag: (ctx && ctx.diag) || null, skipWhy: skipWhy
              });
            }
            setTimeout(step, 0);
          } catch (err) { reject(err); }
        });
      }

      /* ------------------------------------------- 4b. custom strategy builder */
      function ema(v, p) {
        const out = new Array(v.length).fill(NaN);
        if (v.length < p) return out;
        const k = 2 / (p + 1); let s = 0;
        for (let i = 0; i < p; i++) s += v[i];
